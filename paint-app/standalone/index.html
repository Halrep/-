<style>
:root{
  --ink:#3a3a3a;
  --ink-soft:#6b6b6b;
  --paper-bg:#fff6ea;
  --panel-bg:#ffffff;
  --line:#e2ddd2;
  --mint:#5ec8a8;
  --mint-dark:#3fa987;
  --coral:#ff8f6b;
  --danger:#e0604a;
  --focus:#5b8def;
  --topbar-h:56px;
  --bottombar-h:76px;
  --tap:48px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color:var(--ink);
  background:var(--paper-bg);
  font-size:16px;
  -webkit-user-select:none;
  user-select:none;
  overflow:hidden;
  touch-action:manipulation;
}
button{font-family:inherit;font-size:inherit;color:inherit;}
input[type=text],input[type=number]{font-family:inherit;font-size:16px;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;}
[hidden]{display:none!important;}

/* ---------- ボタン共通 ---------- */
.btn{
  min-height:var(--tap);
  min-width:var(--tap);
  padding:8px 14px;
  border:none;
  border-radius:14px;
  background:var(--panel-bg);
  box-shadow:0 1px 0 var(--line);
  display:inline-flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.btn-flat{background:transparent;box-shadow:none;}
.btn-primary{background:var(--mint);color:#fff;font-weight:700;}
.btn-primary:active{background:var(--mint-dark);}
.btn-danger{background:var(--danger);color:#fff;font-weight:700;}
.btn-lg{padding:12px 20px;font-size:18px;}
.btn-icon-only{padding:0;justify-content:center;font-size:20px;}
.btn[aria-disabled=true],.btn:disabled{opacity:.35;pointer-events:none;}
.btn-icon{font-size:18px;}

/* ---------- ふりがな ---------- */
[data-ruby]{position:relative;}
body.furigana-on [data-ruby]::before{
  content:attr(data-ruby);
  display:block;
  font-size:.55em;
  line-height:1.1;
  color:var(--ink-soft);
  white-space:nowrap;
}

/* ================= 作品一覧 ================= */
.gallery-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:var(--panel-bg);border-bottom:1px solid var(--line);
}
.app-title{font-size:20px;margin:0;}
.gallery-toolbar{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.storage-hint{color:var(--ink-soft);font-size:13px;}
.gallery-grid{
  flex:1;overflow-y:auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;padding:0 16px 24px;
}
.gallery-empty{text-align:center;color:var(--ink-soft);margin-top:40px;line-height:1.8;}
.work-card{
  background:var(--panel-bg);border-radius:16px;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;
  display:flex;flex-direction:column;
}
.work-card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f2efe6;display:block;}
.work-card .work-name{padding:8px 10px;font-size:14px;flex:1;}
.work-card .work-menu-row{display:flex;border-top:1px solid var(--line);}
.work-card .work-menu-row button{
  flex:1;min-height:44px;border:none;background:none;font-size:16px;cursor:pointer;
}
.work-card .work-menu-row button:active{background:var(--line);}

/* ================= モーダル ================= */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
}
.modal-box{
  background:var(--panel-bg);border-radius:20px;padding:20px;
  width:min(480px,100%);max-height:90vh;overflow-y:auto;
}
.modal-box h2{margin-top:0;font-size:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.preset-grid-3{grid-template-columns:repeat(3,1fr);}
.preset-card{
  border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;
  background:none;cursor:pointer;min-height:var(--tap);
}
.preset-card[aria-pressed=true]{border-color:var(--mint);background:#eafaf4;}
.preset-shape{margin:0 auto 6px;background:#fff;border:1px solid var(--line);}
.custom-size-row{margin:10px 0;}
.custom-size-toggle{display:flex;align-items:center;gap:8px;min-height:var(--tap);}
.custom-size-inputs{display:flex;gap:14px;margin-top:8px;}
.custom-size-inputs input{width:80px;padding:6px;border:1px solid var(--line);border-radius:8px;}
.title-row{display:block;margin-top:14px;font-size:14px;color:var(--ink-soft);}
.title-row input{width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:10px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;min-height:var(--tap);gap:12px;}
.settings-row input[type=checkbox]{width:24px;height:24px;}
.settings-row input[type=range]{flex:1;}

/* ================= 編集画面 ================= */
.editor-topbar{
  height:var(--topbar-h);flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:0 8px;background:var(--panel-bg);border-bottom:1px solid var(--line);
}
.editor-title-input{
  border:none;background:none;font-size:16px;font-weight:700;color:var(--ink);
  width:auto;flex:0 1 220px;padding:6px 8px;border-radius:8px;
}
.editor-title-input:focus{background:#f2efe6;outline:none;}
.topbar-spacer{flex:1;}

.canvas-viewport{
  position:relative;flex:1;overflow:hidden;background:#ddd8cb;
  touch-action:none;
}
.canvas-stage{
  position:absolute;left:0;top:0;transform-origin:0 0;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}
.canvas-stage canvas{position:absolute;left:0;top:0;image-rendering:pixelated;}
.canvas-stage canvas.smooth{image-rendering:auto;}

.layers-fab,.fit-fab{
  position:absolute;right:12px;width:48px;height:48px;border-radius:50%;
  background:var(--panel-bg);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:20px;
  display:flex;align-items:center;justify-content:center;z-index:5;
}
.layers-fab{top:calc(var(--topbar-h) + 12px);}
.fit-fab{bottom:calc(var(--bottombar-h) + 12px);}

.layer-panel{
  position:absolute;right:12px;top:calc(var(--topbar-h) + 64px);width:272px;max-height:60vh;overflow-y:auto;overflow-x:hidden;
  background:var(--panel-bg);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);
  z-index:6;padding:8px;
}
.layer-panel-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 8px;font-weight:700;}
.layer-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.layer-item{
  display:flex;align-items:center;gap:6px;padding:6px;border-radius:10px;background:#f8f6f0;
}
.layer-item.active{outline:2px solid var(--mint);}
.layer-item .layer-thumb{width:36px;height:28px;background:#fff;border:1px solid var(--line);object-fit:cover;}
.layer-item .layer-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layer-item button{background:none;border:none;font-size:14px;min-width:26px;min-height:28px;cursor:pointer;padding:0;}
.layer-item .opacity-toggle{font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:28px;}
.layer-item .exclude-chk{display:flex;align-items:center;gap:2px;font-size:10px;color:var(--ink-soft);}

.editor-bottombar{
  min-height:var(--bottombar-h);flex:0 0 auto;background:var(--panel-bg);border-top:1px solid var(--line);
  display:flex;flex-direction:row;align-items:center;padding:6px 10px;gap:12px;overflow-x:auto;
}
.tool-list{display:flex;gap:6px;flex:0 0 auto;}
.tool-btn{
  flex:0 0 auto;min-width:56px;min-height:44px;border:none;border-radius:12px;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer;
}
.tool-btn .tool-icon{font-size:20px;}
.tool-btn[aria-selected=true]{background:#eafaf4;color:var(--mint-dark);font-weight:700;}
.tool-options{display:flex;align-items:center;gap:10px;padding:2px 2px;flex:0 0 auto;}
.tool-option-btn{font-size:11px;flex-direction:column;padding:4px 10px;min-height:44px;}
.color-swatch{
  width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);
  background:var(--swatch-color);cursor:pointer;
}
.size-btn{width:44px;height:44px;border-radius:50%;background:#f2efe6;justify-content:center;}
.size-preview-dot{width:16px;height:16px;border-radius:50%;background:var(--ink);}

/* ---------- ポップオーバー ---------- */
.popover{
  position:fixed;background:var(--panel-bg);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.3);
  padding:14px;z-index:40;width:260px;
}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px;}
.color-grid button{
  width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);
  cursor:pointer;background:var(--c);
}
.color-grid button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink);}
.popover-subtitle{font-size:12px;color:var(--ink-soft);margin:6px 0 4px;}
.color-advanced{display:flex;gap:10px;justify-content:center;margin-top:8px;}
.slider-row{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-bottom:10px;}
.slider-row input{width:100%;}
.brush-preview-wrap{display:flex;justify-content:center;padding-top:4px;}
#brush-preview{background:#faf7ee;border-radius:8px;}

/* ---------- 左利きレイアウト ---------- */
body.left-handed .layers-fab,
body.left-handed .layer-panel{ right:auto; left:12px; }
body.left-handed .fit-fab{ right:auto; left:12px; }

/* ---------- 印刷 ---------- */
#print-area{display:none;}
@media print{
  body > *:not(#print-area){display:none!important;}
  #print-area{display:block!important;}
  #print-area canvas{width:100%;height:auto;display:block;}
}

@media (prefers-color-scheme: dark){
  :root{
    --ink:#eee9dd; --ink-soft:#b9b4a6; --paper-bg:#242220; --panel-bg:#2f2c28; --line:#45413a;
  }
  .canvas-viewport{background:#151412;}
  .work-card img{background:#3a362f;}
}

</style>
</head>
<body>

<!-- ==================== 作品一覧 画面 ==================== -->
<section id="screen-gallery" class="screen" aria-label="作品一覧の画面">
  <header class="gallery-header">
    <h1 class="app-title">アイデアスケッチノート</h1>
    <div class="header-actions">
      <button id="btn-furigana" class="btn btn-flat" aria-pressed="false">
        <span class="btn-icon" aria-hidden="true">振</span><span class="btn-label" data-ruby="ふりがな">ふりがな</span>
      </button>
    </div>
  </header>
  <div class="gallery-toolbar">
    <button id="btn-new-work" class="btn btn-primary btn-lg">
      <span class="btn-icon" aria-hidden="true">＋</span><span class="btn-label" data-ruby="あたらしい さくひん">あたらしい さくひん</span>
    </button>
    <span id="storage-hint" class="storage-hint" role="status"></span>
  </div>
  <div id="gallery-grid" class="gallery-grid" role="list"></div>
  <p id="gallery-empty" class="gallery-empty" hidden>まだ さくひんが ありません。<br>「あたらしい さくひん」から はじめよう。</p>
</section>

<!-- ==================== 新規作成 モーダル ==================== -->
<div id="modal-new-work" class="modal-overlay" hidden>
  <div class="modal-box" role="dialog" aria-label="あたらしい さくひん" aria-modal="true">
    <h2 data-ruby="ようし を えらぶ">用紙をえらぶ</h2>
    <div id="paper-preset-list" class="preset-grid"></div>
    <p class="popover-subtitle" data-ruby="かみ の しゅるい">紙のしゅるい</p>
    <div id="paper-type-list" class="preset-grid preset-grid-3"></div>
    <div class="custom-size-row">
      <label class="custom-size-toggle">
        <input type="checkbox" id="chk-custom-size">
        <span data-ruby="じぶんで さいず を きめる">じぶんでサイズを決める</span>
      </label>
      <div id="custom-size-inputs" class="custom-size-inputs" hidden>
        <label>幅(mm) <input type="number" id="input-w-mm" min="50" max="600" value="297"></label>
        <label>高さ(mm) <input type="number" id="input-h-mm" min="50" max="600" value="210"></label>
      </div>
    </div>
    <label class="title-row">
      さくひんの名前
      <input type="text" id="input-new-title" maxlength="40" placeholder="むだい">
    </label>
    <div class="modal-actions">
      <button id="btn-cancel-new" class="btn btn-flat">やめる</button>
      <button id="btn-confirm-new" class="btn btn-primary">つくる</button>
    </div>
  </div>
</div>

<!-- ==================== キャンバス（編集）画面 ==================== -->
<section id="screen-editor" class="screen" hidden aria-label="お絵かきの画面">
  <header class="editor-topbar">
    <button id="btn-back-gallery" class="btn btn-flat btn-icon-only" aria-label="作品一覧へもどる">←</button>
    <input id="input-title" class="editor-title-input" maxlength="40" aria-label="さくひんの名前">
    <div class="topbar-spacer"></div>
    <button id="btn-undo" class="btn btn-flat btn-icon-only" aria-label="もどす" disabled>↺</button>
    <button id="btn-redo" class="btn btn-flat btn-icon-only" aria-label="すすむ" disabled>↻</button>
    <button id="btn-settings" class="btn btn-flat btn-icon-only" aria-label="せってい">⚙</button>

  <div id="canvas-viewport" class="canvas-viewport">

  </div>

  <button id="btn-layers-toggle" class="btn layers-fab" aria-label="かさねる紙パネルを開く">
    <span aria-hidden="true">▤</span>

  <aside id="layer-panel" class="layer-panel" hidden aria-label="かさねる紙(レイヤー)パネル">
    <div class="layer-panel-head">
      <span data-ruby="かさねる かみ">かさねる紙</span>
      <button id="btn-layer-add" class="btn btn-flat btn-icon-only" aria-label="紙をふやす">＋</button>
    </div>
    <ul id="layer-list" class="layer-list"></ul>

  <button id="btn-fit" class="btn fit-fab" aria-label="ぴったり表示にもどす">⤢</button>

  <footer class="editor-bottombar">
    <div id="tool-list" class="tool-list" role="tablist" aria-label="どうぐ"></div>
    <div class="tool-options">
      <button id="btn-dry" class="btn btn-flat tool-option-btn" hidden>
        <span aria-hidden="true">🌬</span><span data-ruby="かわかす">かわかす</span>
      </button>
      <button id="btn-color-swatch" class="color-swatch" aria-label="いろをえらぶ" style="--swatch-color:#3a3a3a"></button>
      <button id="btn-size-popover" class="btn btn-flat size-btn" aria-label="ふとさをえらぶ">
        <span id="size-preview-dot" class="size-preview-dot"></span>
      </button>
    </div>

</section>

<!-- ==================== 色えらび ポップオーバー ==================== -->
<div id="popover-color" class="popover" hidden>
  <div class="popover-arrow"></div>
  <div class="color-grid" id="color-grid-base"></div>
  <p class="popover-subtitle" data-ruby="さいきん つかった いろ">さいきん使った色</p>
  <div class="color-grid" id="color-grid-recent"></div>
  <button id="btn-more-color" class="btn btn-flat" data-ruby="もっと いろを えらぶ">もっと色をえらぶ</button>
  <div id="color-advanced" class="color-advanced" hidden>
    <canvas id="hue-ring" width="180" height="180"></canvas>
    <canvas id="sv-square" width="120" height="120"></canvas>
  </div>
</div>

<!-- ==================== 太さ ポップオーバー ==================== -->
<div id="popover-size" class="popover" hidden>
  <div class="popover-arrow"></div>
  <label class="slider-row">
    <span data-ruby="ふとさ">ふとさ</span>
    <input type="range" id="range-size" min="1" max="100" value="20">
  </label>
  <label class="slider-row" id="row-strength">
    <span id="strength-label" data-ruby="のうど">のうど</span>
    <input type="range" id="range-strength" min="0" max="100" value="70">
  </label>
  <div class="brush-preview-wrap"><canvas id="brush-preview" width="80" height="80"></canvas></div>
</div>

<!-- ==================== せってい モーダル ==================== -->
<div id="modal-settings" class="modal-overlay" hidden>
  <div class="modal-box" role="dialog" aria-label="せってい" aria-modal="true">
    <h2>せってい</h2>
    <label class="settings-row">
      <span data-ruby="ひんしつ を おとして はやくする">品質を落として速くする</span>
      <input type="checkbox" id="chk-low-quality">
    </label>
    <label class="settings-row">
      <span data-ruby="ひだりきき レイアウト">左利きレイアウト</span>
      <input type="checkbox" id="chk-left-handed">
    </label>
    <label class="settings-row">
      <span data-ruby="てぶれ を おさえる">手ぶれをおさえる</span>
      <input type="range" id="range-stabilize" min="0" max="3" value="1">
    </label>
    <div class="modal-actions">
      <button id="btn-export-png" class="btn btn-flat" data-ruby="PNGで ほぞん">PNGで保存</button>
      <button id="btn-print" class="btn btn-flat" data-ruby="いんさつ">印刷</button>
    </div>
    <div class="modal-actions">
      <button id="btn-close-settings" class="btn btn-primary">とじる</button>
    </div>
  </div>
</div>

<div id="confirm-dialog" class="modal-overlay" hidden>
  <div class="modal-box" role="alertdialog" aria-modal="true">
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button id="btn-confirm-no" class="btn btn-flat">やめる</button>
      <button id="btn-confirm-yes" class="btn btn-danger">けす</button>
    </div>
  </div>
</div>

<script>
// ---- paper-texture.js ----
// 紙の高さマップ（粒状感のもと）を作る。
// 実寸解像度ではなく小さめのテクスチャを1回だけ生成し、キャンバス座標を
// テクスチャ座標へ折り返して参照する（毎フレームの生成コストを避けるため）。

const PAPER_PARAMS = {
  gayoshi:    { texW: 512, texH: 384, octaves: [ [8, 0.55], [24, 0.30], [70, 0.15] ], contrast: 1.35, tint: null },
  kent:       { texW: 512, texH: 384, octaves: [ [10, 0.7], [40, 0.3] ],             contrast: 0.55, tint: null },
  warabanshi: { texW: 512, texH: 384, octaves: [ [6, 0.5], [20, 0.35], [55, 0.15] ], contrast: 1.15, tint: "#f3e9c9" },
};

// セルの格子点をランダムに決め、あまり(モジュロ)を使ったバイリニア補間で
// 拡大する。補間の参照先が両端で必ずグリッドの反対側へ折り返すため、
// CanvasPatternで敷き詰めても継ぎ目ができない（真にタイル可能なノイズ）。
function makeOctave(cells, w, h) {
  const cw = Math.max(2, Math.round(w / cells));
  const ch = Math.max(2, Math.round(h / cells));
  const grid = new Float32Array(cw * ch);
  for (let i = 0; i < grid.length; i++) grid[i] = Math.random();

  const out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const gy = (y / h) * ch;
    const y0 = Math.floor(gy) % ch;
    const y1 = (y0 + 1) % ch;
    const fy = gy - Math.floor(gy);
    for (let x = 0; x < w; x++) {
      const gx = (x / w) * cw;
      const x0 = Math.floor(gx) % cw;
      const x1 = (x0 + 1) % cw;
      const fx = gx - Math.floor(gx);
      const v00 = grid[y0 * cw + x0];
      const v10 = grid[y0 * cw + x1];
      const v01 = grid[y1 * cw + x0];
      const v11 = grid[y1 * cw + x1];
      const top = v00 + (v10 - v00) * fx;
      const bot = v01 + (v11 - v01) * fx;
      out[y * w + x] = top + (bot - top) * fy;
    }
  }
  return out;
}

function generatePaperTexture(paperType) {
  const params = PAPER_PARAMS[paperType] || PAPER_PARAMS.gayoshi;
  const { texW, texH, octaves, contrast } = params;
  const combined = new Float32Array(texW * texH);
  let totalWeight = 0;
  for (const [cells, weight] of octaves) {
    const layer = makeOctave(cells, texW, texH);
    for (let p = 0; p < texW * texH; p++) {
      combined[p] += layer[p] * weight;
    }
    totalWeight += weight;
  }

  let min = Infinity, max = -Infinity;
  for (let p = 0; p < combined.length; p++) {
    combined[p] /= totalWeight;
    if (combined[p] < min) min = combined[p];
    if (combined[p] > max) max = combined[p];
  }
  const range = Math.max(1e-4, max - min);
  const data = new Uint8ClampedArray(texW * texH);
  for (let p = 0; p < combined.length; p++) {
    let v = (combined[p] - min) / range;
    v = 0.5 + (v - 0.5) * contrast;
    data[p] = Math.max(0, Math.min(255, Math.round(v * 255)));
  }

  const texCanvas = document.createElement("canvas");
  texCanvas.width = texW;
  texCanvas.height = texH;
  const tctx = texCanvas.getContext("2d");
  const timg = tctx.createImageData(texW, texH);
  for (let p = 0; p < data.length; p++) {
    timg.data[p * 4] = data[p];
    timg.data[p * 4 + 1] = data[p];
    timg.data[p * 4 + 2] = data[p];
    timg.data[p * 4 + 3] = 255;
  }
  tctx.putImageData(timg, 0, 0);

  // destination-out で使う「抜き量」パターン。凹(値が低い)ほど不透明=強く抜く。
  const grainMaskCanvas = document.createElement("canvas");
  grainMaskCanvas.width = texW;
  grainMaskCanvas.height = texH;
  const gctx = grainMaskCanvas.getContext("2d");
  const gimg = gctx.createImageData(texW, texH);
  for (let p = 0; p < data.length; p++) {
    gimg.data[p * 4 + 3] = 255 - data[p];
  }
  gctx.putImageData(gimg, 0, 0);

  return {
    width: texW,
    height: texH,
    data,
    texCanvas,
    grainMaskCanvas,
    tint: params.tint,
    // canvas座標(px,py)における0..1の高さ（凸=1, 凹=0）を返す。紙の実寸に対して
    // テクスチャを敷き詰めるので、原点はキャンバス左上に固定される（ズームしても紙目は動かない）。
    heightAt(px, py) {
      const x = ((Math.floor(px) % texW) + texW) % texW;
      const y = ((Math.floor(py) % texH) + texH) % texH;
      return data[y * texW + x] / 255;
    },
  };
}


// ---- canvas-engine.js ----

let uidCounter = 0;
function nextId(prefix = "id") {
  uidCounter += 1;
  return `${prefix}_${uidCounter}_${Date.now().toString(36)}`;
}

const OPACITY_LEVELS = [0.4, 0.7, 1.0];

class Layer {
  constructor(width, height, name, opts = {}) {
    this.id = opts.id || nextId("layer");
    this.name = name;
    this.width = width;
    this.height = height;
    this.visible = true;
    this.opacityLevel = opts.opacityLevel ?? 2;
    this.isSketch = !!opts.isSketch;
    this.excludeFromExport = opts.excludeFromExport ?? this.isSketch;

    this.canvas = document.createElement("canvas");
    this.canvas.width = width;
    this.canvas.height = height;
    this.canvas.style.pointerEvents = "none";
    this.ctx = this.canvas.getContext("2d");

    this.wetCanvas = document.createElement("canvas");
    this.wetCanvas.width = width;
    this.wetCanvas.height = height;
    this.wetCanvas.style.pointerEvents = "none";
    this.wetCtx = this.wetCanvas.getContext("2d");
    this.wetSince = 0;
  }

  opacityValue() {
    return OPACITY_LEVELS[this.opacityLevel];
  }

  applyOpacityToDom() {
    const v = this.visible ? this.opacityValue() : 0;
    this.canvas.style.opacity = String(v);
    this.wetCanvas.style.opacity = String(v);
  }

  isWet() {
    return this.wetSince !== 0;
  }

  markWet(now) {
    this.wetSince = now;
  }

  mergeWetToDry() {
    if (!this.isWet()) return;
    this.ctx.globalAlpha = 1;
    this.ctx.globalCompositeOperation = "source-over";
    this.ctx.drawImage(this.wetCanvas, 0, 0);
    this.wetCtx.clearRect(0, 0, this.width, this.height);
    this.wetSince = 0;
  }

  clear() {
    this.ctx.clearRect(0, 0, this.width, this.height);
    this.wetCtx.clearRect(0, 0, this.width, this.height);
    this.wetSince = 0;
  }

  snapshotClone() {
    const c = document.createElement("canvas");
    c.width = this.width;
    c.height = this.height;
    c.getContext("2d").drawImage(this.canvas, 0, 0);
    return c;
  }

  restoreFrom(canvasClone) {
    this.ctx.clearRect(0, 0, this.width, this.height);
    this.ctx.drawImage(canvasClone, 0, 0);
    this.wetCtx.clearRect(0, 0, this.width, this.height);
    this.wetSince = 0;
  }

  toBlob() {
    return new Promise((resolve) => this.canvas.toBlob(resolve, "image/png"));
  }
}

class SketchDocument {
  constructor({ id, title, width, height, paperType }) {
    this.id = id || nextId("work");
    this.title = title || "むだい";
    this.width = width;
    this.height = height;
    this.paperType = paperType || "gayoshi";
    this.paperTexture = generatePaperTexture(this.paperType);
    this.paperCanvas = renderPaperBackground(width, height, this.paperTexture);
    this.layers = [];
    this.activeLayerIndex = 0;
    this.createdAt = Date.now();
    this.updatedAt = Date.now();
  }

  static createDefault(opts) {
    const doc = new SketchDocument(opts);
    doc.addLayer("したがき", { isSketch: true, opacityLevel: 0 });
    doc.addLayer("いろ");
    doc.addLayer("かきこみ");
    doc.activeLayerIndex = doc.layers.length - 1;
    return doc;
  }

  addLayer(name, opts = {}) {
    if (this.layers.length >= 4) return null;
    const layer = new Layer(this.width, this.height, name || `かみ${this.layers.length + 1}`, opts);
    this.layers.push(layer);
    return layer;
  }

  removeLayer(id) {
    if (this.layers.length <= 1) return false;
    const idx = this.layers.findIndex((l) => l.id === id);
    if (idx < 0) return false;
    this.layers.splice(idx, 1);
    if (this.activeLayerIndex >= this.layers.length) this.activeLayerIndex = this.layers.length - 1;
    return true;
  }

  duplicateLayer(id) {
    if (this.layers.length >= 4) return null;
    const idx = this.layers.findIndex((l) => l.id === id);
    if (idx < 0) return null;
    const src = this.layers[idx];
    const copy = new Layer(this.width, this.height, `${src.name}のコピー`, {
      opacityLevel: src.opacityLevel,
      excludeFromExport: src.excludeFromExport,
    });
    copy.ctx.drawImage(src.canvas, 0, 0);
    this.layers.splice(idx + 1, 0, copy);
    return copy;
  }

  moveLayer(id, dir) {
    const idx = this.layers.findIndex((l) => l.id === id);
    const j = idx + dir;
    if (idx < 0 || j < 0 || j >= this.layers.length) return false;
    [this.layers[idx], this.layers[j]] = [this.layers[j], this.layers[idx]];
    return true;
  }

  getActiveLayer() {
    return this.layers[this.activeLayerIndex];
  }

  flatten({ forExport = false, maxSize = null } = {}) {
    const out = document.createElement("canvas");
    let w = this.width;
    let h = this.height;
    if (maxSize && Math.max(w, h) > maxSize) {
      const scale = maxSize / Math.max(w, h);
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
    }
    out.width = w;
    out.height = h;
    const octx = out.getContext("2d");
    octx.fillStyle = "#ffffff";
    octx.fillRect(0, 0, w, h);
    if (!forExport) octx.drawImage(this.paperCanvas, 0, 0, w, h);
    for (const layer of this.layers) {
      if (!layer.visible) continue;
      if (forExport && layer.excludeFromExport) continue;
      octx.globalAlpha = layer.opacityValue();
      octx.drawImage(layer.canvas, 0, 0, w, h);
      if (layer.isWet()) octx.drawImage(layer.wetCanvas, 0, 0, w, h);
    }
    octx.globalAlpha = 1;
    return out;
  }
}

function renderPaperBackground(width, height, texture) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = texture.tint || "#ffffff";
  ctx.fillRect(0, 0, width, height);
  const pattern = ctx.createPattern(texture.texCanvas, "repeat");
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = pattern;
  ctx.fillRect(0, 0, width, height);
  ctx.restore();
  return canvas;
}

// レイヤー配列の中身をDOM(#canvas-stage)へ反映する。
// 追加・削除・並べ替え・表示/不透明度変更のたびに呼ぶ。
function syncStageDom(doc, stageEl) {
  stageEl.style.width = `${doc.width}px`;
  stageEl.style.height = `${doc.height}px`;

  if (doc.paperCanvas.parentNode !== stageEl) {
    stageEl.innerHTML = "";
    stageEl.appendChild(doc.paperCanvas);
  } else {
    stageEl.appendChild(doc.paperCanvas);
  }

  for (const layer of doc.layers) {
    stageEl.appendChild(layer.canvas);
    stageEl.appendChild(layer.wetCanvas);
    layer.applyOpacityToDom();
  }
}

  { id: "postcard-h", label: "はがき(横)", w: 148, h: 100 },

  { id: "square", label: "せいほうけい", w: 200, h: 200 },
];

const PAPER_TYPES = [
  { id: "gayoshi", label: "画用紙" },
  { id: "kent", label: "ケント紙" },
  { id: "warabanshi", label: "わら半紙" },

const PX_PER_MM = 5.6;
function mmToPx(mm) {

// ---- viewport.js ----
// キャンバスの表示だけを拡大・移動する（内部の描画解像度は変えない）。
class Viewport {
  constructor(viewportEl, stageEl, docWidth, docHeight) {
    this.viewportEl = viewportEl;
    this.stageEl = stageEl;
    this.docWidth = docWidth;
    this.docHeight = docHeight;
    this.scale = 1;
    this.x = 0;
    this.y = 0;
    this.minScale = 0.2;
    this.maxScale = 8;
  }

  setDocSize(w, h) {
    this.docWidth = w;
    this.docHeight = h;
  }

  fit() {
    const vw = this.viewportEl.clientWidth;
    const vh = this.viewportEl.clientHeight;
    const pad = 20;
    const scale = Math.min((vw - pad * 2) / this.docWidth, (vh - pad * 2) / this.docHeight);
    this.scale = Math.max(this.minScale, Math.min(this.maxScale, scale));
    this.x = (vw - this.docWidth * this.scale) / 2;
    this.y = (vh - this.docHeight * this.scale) / 2;
    this.apply();
  }

  apply() {
    this.stageEl.style.transform = `translate(${this.x}px, ${this.y}px) scale(${this.scale})`;
  }

  panBy(dx, dy) {
    this.x += dx;
    this.y += dy;
    this.apply();
  }

  zoomAt(clientX, clientY, factor) {
    const newScale = Math.max(this.minScale, Math.min(this.maxScale, this.scale * factor));
    const rect = this.viewportEl.getBoundingClientRect();
    const localX = clientX - rect.left;
    const localY = clientY - rect.top;
    const docX = (localX - this.x) / this.scale;
    const docY = (localY - this.y) / this.scale;
    this.scale = newScale;
    this.x = localX - docX * this.scale;
    this.y = localY - docY * this.scale;
    this.apply();
  }

  screenToDoc(clientX, clientY) {
    const rect = this.viewportEl.getBoundingClientRect();
    const localX = clientX - rect.left;
    const localY = clientY - rect.top;
    return { x: (localX - this.x) / this.scale, y: (localY - this.y) / this.scale };
  }
}


// ---- history.js ----
// もどす/すすむ。ストローク単位で「変更のあったレイヤー」の描画前後を
// まるごと複製して保持する（MVPでは1手=1レイヤーのスナップショット）。
// レイヤーの追加・削除・並べ替えは対象外（現状復帰が難しいため）。

const HISTORY_LIMIT = 20;

class History {
  constructor() {
    this.undoStack = [];
    this.redoStack = [];
    this.onChange = null;
    this._pendingLayer = null;
    this._pendingSnapshot = null;
  }

  beginAction(layer) {
    this._pendingLayer = layer;
    this._pendingSnapshot = layer.snapshotClone();
  }

  commitAction() {
    if (!this._pendingLayer) return;
    this.undoStack.push({ layerId: this._pendingLayer.id, snapshot: this._pendingSnapshot });
    if (this.undoStack.length > HISTORY_LIMIT) this.undoStack.shift();
    this.redoStack = [];
    this._pendingLayer = null;
    this._pendingSnapshot = null;
    this._notify();
  }

  canUndo() {
    return this.undoStack.length > 0;
  }

  canRedo() {
    return this.redoStack.length > 0;
  }

  undo(doc) {
    const entry = this.undoStack.pop();
    if (!entry) return false;
    const layer = doc.layers.find((l) => l.id === entry.layerId);
    if (!layer) {
      this._notify();
      return false;
    }
    const afterSnapshot = layer.snapshotClone();
    layer.restoreFrom(entry.snapshot);
    this.redoStack.push({ layerId: entry.layerId, snapshot: afterSnapshot });
    this._notify();
    return true;
  }

  redo(doc) {
    const entry = this.redoStack.pop();
    if (!entry) return false;
    const layer = doc.layers.find((l) => l.id === entry.layerId);
    if (!layer) {
      this._notify();
      return false;
    }
    const beforeSnapshot = layer.snapshotClone();
    layer.restoreFrom(entry.snapshot);
    this.undoStack.push({ layerId: entry.layerId, snapshot: beforeSnapshot });
    this._notify();
    return true;
  }

  reset() {
    this.undoStack = [];
    this.redoStack = [];
    this._notify();
  }

  _notify() {
    this.onChange?.(this.canUndo(), this.canRedo());
  }
}


// ---- brushes.js ----
// ブラシエンジン（Canvas2D）。
// 端末に筆圧ペンが無い前提のため、速度からの筆圧推定を標準の入力として使う。
// 水彩は「§6.3 フォールバック層」を既定実装とし、紙目は§6.0のとおり
// キャンバス固定のCanvasPattern（destination-out）で表現する。

const TOOLS = [
  { id: "pencil", label: "えんぴつ", icon: "✏️", sizeRange: [2, 26], strengthLabel: "しん の こさ" },
  { id: "crayon", label: "クレパス", icon: "🖍️", sizeRange: [10, 70], strengthLabel: "ちから の いれぐあい" },
  { id: "watercolor", label: "すいさい", icon: "🖌️", sizeRange: [12, 90], strengthLabel: "みず の りょう" },
  { id: "waterbrush", label: "みずふで", icon: "💧", sizeRange: [15, 100], strengthLabel: "みず の りょう" },
  { id: "eraser", label: "けしゴム", icon: "🧹", sizeRange: [10, 100], strengthLabel: "けす つよさ" },
];

const DRY_TIMEOUT_MS = 6000;
const STABILIZE_FACTORS = [1, 0.55, 0.32, 0.18];

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if (!m) return { r: 58, g: 58, b: 58 };
  return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
}

class BrushEngine {
  constructor() {
    this.tool = "pencil";
    this.color = "#3a3a3a";
    this.settings = {};
    for (const t of TOOLS) this.settings[t.id] = { size: 45, strength: 60 };
    this.stabilizeLevel = 1;
    this._active = false;
  }

  setTool(id) {
    this.tool = id;
  }

  currentToolDef() {
    return TOOLS.find((t) => t.id === this.tool);
  }

  setColor(hex) {
    this.color = hex;
  }

  setSize(pct) {
    this.settings[this.tool].size = pct;
  }

  getSize() {
    return this.settings[this.tool].size;
  }

  setStrength(pct) {
    this.settings[this.tool].strength = pct;
  }

  getStrength() {
    return this.settings[this.tool].strength;
  }

  sizePx() {
    const def = this.currentToolDef();
    const pct = this.settings[this.tool].size / 100;
    return lerp(def.sizeRange[0], def.sizeRange[1], pct);
  }

  strengthUnit() {
    return this.settings[this.tool].strength / 100;
  }

  // --- 速度からの筆圧推定 ---
  _estimatePressure(dx, dy, dtMs) {
    if (dtMs <= 0) return 0.75;
    const speed = Math.hypot(dx, dy) / dtMs;
    const t = Math.max(0, Math.min(1, speed / 2.4));
    return lerp(1.0, 0.28, t);
  }

  beginStroke(doc, layer, point, now) {
    this._active = true;
    this._layer = layer;
    this._smoothX = point.x;
    this._smoothY = point.y;
    this._lastRawX = point.x;
    this._lastRawY = point.y;
    this._lastTime = now;
    this._leftover = 0;
    this._strokePoints = [];

    if (this.tool === "watercolor" || this.tool === "waterbrush") {
      layer.markWet(now);
    }

    this._stampAt(doc, layer, point.x, point.y, this._resolvePressure(point, 0));
  }

  _resolvePressure(point, estimated) {
    const raw = point.pressure;
    if (raw && raw > 0 && Math.abs(raw - 0.5) > 0.03) {
      return raw * 0.55 + estimated * 0.45;
    }
    return estimated;
  }

  extendStroke(doc, layer, points, now) {
    if (!this._active) return;
    for (const p of points) {
      const factor = STABILIZE_FACTORS[this.stabilizeLevel] ?? 0.32;
      this._smoothX = lerp(this._smoothX, p.x, factor);
      this._smoothY = lerp(this._smoothY, p.y, factor);

      const dt = Math.max(1, (p.t ?? now) - this._lastTime);
      const dx = p.x - this._lastRawX;
      const dy = p.y - this._lastRawY;
      const estimated = this._estimatePressure(dx, dy, dt);
      const pressure = this._resolvePressure(p, estimated);

      const dist = Math.hypot(this._smoothX - this._lastStampX, this._smoothY - this._lastStampY);
      this._walkAndStamp(doc, layer, this._smoothX, this._smoothY, pressure);

      this._lastRawX = p.x;
      this._lastRawY = p.y;
      this._lastTime = p.t ?? now;
    }
  }

  _walkAndStamp(doc, layer, x, y, pressure) {
    const spacingPx = Math.max(1.2, this.sizePx() * 0.16);
    let dist = Math.hypot(x - this._lastStampX, y - this._lastStampY);
    let steps = Math.floor((this._leftover + dist) / spacingPx);
    if (steps <= 0) {
      this._leftover += dist;
      return;
    }
    const startX = this._lastStampX;
    const startY = this._lastStampY;
    for (let i = 1; i <= steps; i++) {
      const t = (spacingPx * i - this._leftover) / dist;
      const sx = lerp(startX, x, t);
      const sy = lerp(startY, y, t);
      this._stampAt(doc, layer, sx, sy, pressure);
    }
    this._leftover = this._leftover + dist - steps * spacingPx;
  }

  _stampAt(doc, layer, x, y, pressure) {
    this._lastStampX = x;
    this._lastStampY = y;
    const angle = Math.atan2(y - (this._prevStampY ?? y), x - (this._prevStampX ?? x));
    this._prevStampX = x;
    this._prevStampY = y;

    switch (this.tool) {
      case "pencil":
        stampPencil(layer.ctx, doc, x, y, pressure, this);
        break;
      case "crayon":
        stampCrayon(layer.ctx, doc, x, y, pressure, angle, this);
        break;
      case "watercolor":
        stampWatercolor(layer.wetCtx, x, y, pressure, this, 1);
        this._strokePoints.push({ x, y, pressure });
        break;
      case "waterbrush":
        stampWatercolor(layer.wetCtx, x, y, pressure, this, 0.3);
        this._strokePoints.push({ x, y, pressure: pressure * 0.5 });
        break;
      case "eraser":
        stampEraser(layer, x, y, pressure, this);
        break;
      default:
        break;
    }
  }

  endStroke(doc, layer, now) {
    if (!this._active) return;
    this._active = false;
    if (this.tool === "watercolor" || this.tool === "waterbrush") {
      const blurPx = 4 + this.strengthUnit() * 7;
      diffuseWetLayer(layer, blurPx);
      redepositEdges(layer.wetCtx, this._strokePoints, this.color);
      layer.markWet(now);
    }
    this._strokePoints = [];
  }

  checkDrying(doc, now) {
    for (const layer of doc.layers) {
      if (layer.isWet() && now - layer.wetSince > DRY_TIMEOUT_MS) {
        layer.mergeWetToDry();
      }
    }
  }

  forceDry(layer, now) {
    layer.mergeWetToDry();
  }
}

// ---- 紙目（凹凸）パターン。destination-out の抜き量をアルファで表す ----
const grainPatternCache = new WeakMap();
function getGrainPattern(ctx, doc) {
  let p = grainPatternCache.get(doc.paperTexture);
  if (!p) {
    p = ctx.createPattern(doc.paperTexture.grainMaskCanvas, "repeat");
    grainPatternCache.set(doc.paperTexture, p);
  }
  return p;
}

function punchGrain(ctx, doc, x, y, radius, strength) {
  if (strength <= 0) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.clip();
  ctx.globalCompositeOperation = "destination-out";
  ctx.globalAlpha = strength;
  ctx.fillStyle = getGrainPattern(ctx, doc);
  ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
  ctx.restore();
}

function stampPencil(ctx, doc, x, y, pressure, brush) {
  const hardness = brush.strengthUnit();
  const radius = brush.sizePx() * (0.35 + pressure * 0.3);
  const alphaBase = lerp(0.18, 0.8, hardness) * lerp(0.5, 1, pressure);
  const grainStrength = lerp(0.75, 0.2, hardness);
  const { r, g, b } = hexToRgb(brush.color);

  ctx.save();
  ctx.globalCompositeOperation = "lighten";
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${r},${g},${b},${alphaBase})`;
  ctx.fill();
  ctx.restore();

  punchGrain(ctx, doc, x, y, radius, grainStrength);
}

function stampCrayon(ctx, doc, x, y, pressure, angle, brush) {
  const force = brush.strengthUnit();
  const radius = brush.sizePx() * (0.4 + pressure * 0.25);
  const alpha = lerp(0.35, 0.9, force) * lerp(0.6, 1, pressure);
  const { r, g, b } = hexToRgb(brush.color);
  const wobble = (Math.random() - 0.5) * radius * 0.18;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.ellipse(wobble, 0, radius, radius * 0.62, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
  ctx.fill();
  ctx.restore();

  punchGrain(ctx, doc, x, y, radius, 0.5);
}

function stampWatercolor(ctx, x, y, pressure, brush, amountScale) {
  const radius = brush.sizePx() * (0.5 + pressure * 0.35);
  const strengthUnit = brush.strengthUnit();
  const alpha = lerp(0.08, 0.4, strengthUnit) * lerp(0.5, 1, pressure) * amountScale;
  const { r, g, b } = hexToRgb(brush.color);

  const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
  grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
  grad.addColorStop(0.7, `rgba(${r},${g},${b},${alpha * 0.7})`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function redepositEdges(ctx, points, color) {
  if (points.length < 2) return;
  const { r, g, b } = hexToRgb(color);
  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  ctx.strokeStyle = `rgba(${r},${g},${b},0.14)`;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.lineWidth = Math.max(1, points[0].pressure * 3);
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (const p of points) ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.restore();
}

function stampEraser(layer, x, y, pressure, brush) {
  const radius = brush.sizePx() * (0.4 + pressure * 0.3);
  const strength = brush.strengthUnit();
  const alpha = lerp(0.18, 1, strength) * lerp(0.6, 1, pressure);

  for (const ctx of [layer.ctx, layer.wetCtx]) {
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
    grad.addColorStop(0, `rgba(0,0,0,${alpha})`);
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function diffuseWetLayer(layer, blurPx) {
  const w = layer.width;
  const h = layer.height;
  const dw = Math.max(1, Math.round(w / 2));
  const dh = Math.max(1, Math.round(h / 2));

  const a = document.createElement("canvas");
  a.width = dw;
  a.height = dh;
  a.getContext("2d").drawImage(layer.wetCanvas, 0, 0, dw, dh);

  const b = document.createElement("canvas");
  b.width = dw;
  b.height = dh;
  const bctx = b.getContext("2d");
  try {
    bctx.filter = `blur(${blurPx / 2}px)`;
  } catch (e) {
    /* filter未対応ブラウザはぼかし無しで続行 */
  }
  bctx.drawImage(a, 0, 0);

  layer.wetCtx.clearRect(0, 0, w, h);
  layer.wetCtx.imageSmoothingEnabled = true;
  layer.wetCtx.drawImage(b, 0, 0, w, h);
}

function brushPreview(canvas, brush) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#faf7ee";
  ctx.fillRect(0, 0, w, h);
  const radius = Math.min(w, h) * 0.32 * (0.4 + brush.settings[brush.tool].size / 100 * 0.6);
  const { r, g, b } = hexToRgb(brush.color);
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
  const alpha = brush.tool === "eraser" ? 0.5 : lerp(0.3, 0.9, brush.strengthUnit());
  ctx.fillStyle = brush.tool === "eraser" ? "rgba(200,200,200,0.6)" : `rgba(${r},${g},${b},${alpha})`;
  ctx.fill();
}

function show(el) {
  el.hidden = false;
}

function hide(el) {
  el.hidden = true;
}

function confirmDialog(message, confirmLabel = "けす") {
  const overlay = document.getElementById("confirm-dialog");
  const msgEl = document.getElementById("confirm-message");
  const yesBtn = document.getElementById("btn-confirm-yes");
  const noBtn = document.getElementById("btn-confirm-no");
  msgEl.textContent = message;
  yesBtn.textContent = confirmLabel;
  show(overlay);
  return new Promise((resolve) => {
    const cleanup = (result) => {
      hide(overlay);
      yesBtn.removeEventListener("click", onYes);
      noBtn.removeEventListener("click", onNo);
      resolve(result);
    };
    const onYes = () => cleanup(true);
    const onNo = () => cleanup(false);
    yesBtn.addEventListener("click", onYes);
    noBtn.addEventListener("click", onNo);
  });
}

function positionPopover(popoverEl, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const popRect = popoverEl.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - popRect.width / 2;
  left = Math.max(8, Math.min(window.innerWidth - popRect.width - 8, left));
  const top = rect.top - popRect.height - 12;
  popoverEl.style.left = `${left}px`;
  popoverEl.style.top = `${Math.max(8, top)}px`;
  const arrow = popoverEl.querySelector(".popover-arrow");
  if (arrow) arrow.style.left = `${rect.left + rect.width / 2 - left - 8}px`;
}

const KEY = "sketchnote_furigana";

function readPref() {
  try {
    return localStorage.getItem(KEY) === "1";
  } catch (e) {
    return false;
  }
}

function writePref(on) {
  try {
    localStorage.setItem(KEY, on ? "1" : "0");
  } catch (e) {
    /* ストレージが使えない場合は保存しないだけで動作は続ける */
  }
}

function initFurigana(toggleBtn) {
  const on = readPref();
  document.body.classList.toggle("furigana-on", on);
  toggleBtn.setAttribute("aria-pressed", String(on));
  toggleBtn.addEventListener("click", () => {
    const next = !document.body.classList.contains("furigana-on");
    document.body.classList.toggle("furigana-on", next);
    toggleBtn.setAttribute("aria-pressed", String(next));
    writePref(next);
  });
}
