const BASE_COLORS = [
  "#2b2b2b", "#7a5230", "#e0503c", "#f2924a",
  "#f4d35e", "#9bc53d", "#3fa987", "#2ea3ac",
  "#3b6fd4", "#5b4bcf", "#d65fa8", "#ffffff",
];
const RECENT_KEY = "sketchnote_recent_colors";

function loadRecent() {
  try {
    return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
  } catch (e) {
    return [];
  }
}
function saveRecent(list) {
  try {
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
  } catch (e) {
    /* 保存できなくても致命的ではない */
  }
}

function hsvToHex(h, s, v) {
  const c = v * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  const R = Math.round((r + m) * 255);
  const G = Math.round((g + m) * 255);
  const B = Math.round((b + m) * 255);
  return `#${[R, G, B].map((n) => n.toString(16).padStart(2, "0")).join("")}`;
}

function drawHueRing(canvas) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const outer = Math.min(w, h) / 2 - 2;
  const inner = outer * 0.68;
  ctx.clearRect(0, 0, w, h);
  for (let a = 0; a < 360; a += 2) {
    const r0 = ((a - 1.2) * Math.PI) / 180;
    const r1 = ((a + 1.2) * Math.PI) / 180;
    ctx.beginPath();
    ctx.arc(cx, cy, outer, r0, r1);
    ctx.arc(cx, cy, inner, r1, r0, true);
    ctx.closePath();
    ctx.fillStyle = `hsl(${a},85%,55%)`;
    ctx.fill();
  }
}

function drawSVSquare(canvas, hue) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;
  ctx.fillStyle = `hsl(${hue},100%,50%)`;
  ctx.fillRect(0, 0, w, h);
  const whiteGrad = ctx.createLinearGradient(0, 0, w, 0);
  whiteGrad.addColorStop(0, "rgba(255,255,255,1)");
  whiteGrad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = whiteGrad;
  ctx.fillRect(0, 0, w, h);
  const blackGrad = ctx.createLinearGradient(0, 0, 0, h);
  blackGrad.addColorStop(0, "rgba(0,0,0,0)");
  blackGrad.addColorStop(1, "rgba(0,0,0,1)");
  ctx.fillStyle = blackGrad;
  ctx.fillRect(0, 0, w, h);
}

class ColorPicker {
  constructor(brush, onChange) {
    this.brush = brush;
    this.onChange = onChange;
    this.recent = loadRecent();
    this.currentHue = 0;

    this.popover = document.getElementById("popover-color");
    this.swatchBtn = document.getElementById("btn-color-swatch");
    this.baseGrid = document.getElementById("color-grid-base");
    this.recentGrid = document.getElementById("color-grid-recent");
    this.moreBtn = document.getElementById("btn-more-color");
    this.advanced = document.getElementById("color-advanced");
    this.hueRing = document.getElementById("hue-ring");
    this.svSquare = document.getElementById("sv-square");

    this._buildBaseGrid();
    this._renderRecent();
    this._bindOpen();
    this._bindAdvanced();
    this.updateSwatch();
  }

  _buildBaseGrid() {
    this.baseGrid.innerHTML = "";
    for (const hex of BASE_COLORS) {
      const b = document.createElement("button");
      b.style.setProperty("--c", hex);
      b.setAttribute("aria-label", `いろ ${hex}`);
      b.addEventListener("click", () => this.selectColor(hex));
      this.baseGrid.appendChild(b);
    }
  }

  _renderRecent() {
    this.recentGrid.innerHTML = "";
    for (const hex of this.recent) {
      const b = document.createElement("button");
      b.style.setProperty("--c", hex);
      b.setAttribute("aria-label", `さいきん つかった いろ ${hex}`);
      b.addEventListener("click", () => this.selectColor(hex));
      this.recentGrid.appendChild(b);
    }
  }

  selectColor(hex) {
    this.brush.setColor(hex);
    this._pushRecent(hex);
    this.updateSwatch();
    this.onChange?.(hex);
    hide(this.popover);
  }

  _liveColor(hex) {
    this.brush.setColor(hex);
    this.updateSwatch();
    this.onChange?.(hex);
  }

  _pushRecent(hex) {
    this.recent = [hex, ...this.recent.filter((c) => c !== hex)].slice(0, 8);
    saveRecent(this.recent);
    this._renderRecent();
  }

  updateSwatch() {
    this.swatchBtn.style.setProperty("--swatch-color", this.brush.color);
  }

  _bindOpen() {
    this.swatchBtn.addEventListener("click", () => {
      if (!this.popover.hidden) {
        hide(this.popover);
        return;
      }
      show(this.popover);
      positionPopover(this.popover, this.swatchBtn);
    });
    document.addEventListener("pointerdown", (e) => {
      if (this.popover.hidden) return;
      if (this.popover.contains(e.target) || this.swatchBtn.contains(e.target)) return;
      hide(this.popover);
    });
  }

  _bindAdvanced() {
    this.moreBtn.addEventListener("click", () => {
      const willShow = this.advanced.hidden;
      this.advanced.hidden = !willShow;
      if (willShow) {
        drawHueRing(this.hueRing);
        drawSVSquare(this.svSquare, this.currentHue);
      }
    });

    const pickHue = (e) => {
      const rect = this.hueRing.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const x = e.clientX - rect.left - cx;
      const y = e.clientY - rect.top - cy;
      let deg = (Math.atan2(y, x) * 180) / Math.PI;
      if (deg < 0) deg += 360;
      this.currentHue = deg;
      drawSVSquare(this.svSquare, this.currentHue);
      this._liveColor(hsvToHex(this.currentHue, 0.85, 0.9));
    };
    this.hueRing.addEventListener("pointerdown", (e) => {
      this._hueDown = true;
      this.hueRing.setPointerCapture(e.pointerId);
      pickHue(e);
    });
    this.hueRing.addEventListener("pointermove", (e) => {
      if (this._hueDown) pickHue(e);
    });
    this.hueRing.addEventListener("pointerup", () => {
      this._hueDown = false;
      this._pushRecent(this.brush.color);
    });

    const pickSV = (e) => {
      const rect = this.svSquare.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
      const s = x / rect.width;
      const v = 1 - y / rect.height;
      this._liveColor(hsvToHex(this.currentHue, s, v));
    };
    this.svSquare.addEventListener("pointerdown", (e) => {
      this._svDown = true;
      this.svSquare.setPointerCapture(e.pointerId);
      pickSV(e);
    });
    this.svSquare.addEventListener("pointermove", (e) => {
      if (this._svDown) pickSV(e);
    });
    this.svSquare.addEventListener("pointerup", () => {
      this._svDown = false;
      this._pushRecent(this.brush.color);
    });
  }
}


// ---- storage.js ----
// IndexedDBへの保存・読み込み。作品はすべて端末内のみに保存し、外部へは送らない。

const DB_NAME = "sketchnote-db";
const DB_VERSION = 1;
const STORE = "works";
const WORK_COUNT_WARNING = 20;

function reqP(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function saveWork(doc) {
  const thumbCanvas = doc.flatten({ maxSize: 320 });
  const thumb = await new Promise((r) => thumbCanvas.toBlob(r, "image/png"));
  const layers = [];
  for (const layer of doc.layers) {
    layer.mergeWetToDry();
    const blob = await layer.toBlob();
    layers.push({
      id: layer.id,
      name: layer.name,
      opacityLevel: layer.opacityLevel,
      visible: layer.visible,
      excludeFromExport: layer.excludeFromExport,
      isSketch: layer.isSketch,
      blob,
    });
  }
  doc.updatedAt = Date.now();
  const record = {
    id: doc.id,
    title: doc.title,
    paperType: doc.paperType,
    width: doc.width,
    height: doc.height,
    createdAt: doc.createdAt,
    updatedAt: doc.updatedAt,
    activeLayerIndex: doc.activeLayerIndex,
    thumb,
    layers,
  };
  const db = await openDB();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  return record;
}

async function loadWorkList() {
  const db = await openDB();
  const tx = db.transaction(STORE, "readonly");
  const all = await reqP(tx.objectStore(STORE).getAll());
  return all
    .map((r) => ({ id: r.id, title: r.title, updatedAt: r.updatedAt, thumb: r.thumb, width: r.width, height: r.height }))
    .sort((a, b) => b.updatedAt - a.updatedAt);
}

async function loadWorkRecord(id) {
  const db = await openDB();
  const tx = db.transaction(STORE, "readonly");
  return reqP(tx.objectStore(STORE).get(id));
}

async function deleteWork(id) {
  const db = await openDB();
  const tx = db.transaction(STORE, "readwrite");
  tx.objectStore(STORE).delete(id);
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function renameWork(id, title) {
  const record = await loadWorkRecord(id);
  if (!record) return;
  record.title = title;
  const db = await openDB();
  const tx = db.transaction(STORE, "readwrite");
  tx.objectStore(STORE).put(record);
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function duplicateWork(id) {
  const record = await loadWorkRecord(id);
  if (!record) return null;
  const copy = { ...record, id: `${record.id}_copy_${Date.now().toString(36)}`, title: `${record.title}のコピー`, updatedAt: Date.now(), createdAt: Date.now() };
  const db = await openDB();
  const tx = db.transaction(STORE, "readwrite");
  tx.objectStore(STORE).put(copy);
  await new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  return copy.id;
}

async function hydrateDocument(record) {
  const doc = new SketchDocument({
    id: record.id,
    title: record.title,
    width: record.width,
    height: record.height,
    paperType: record.paperType,
  });
  doc.createdAt = record.createdAt;
  doc.updatedAt = record.updatedAt;
  doc.layers = [];
  for (const ld of record.layers) {
    const layer = new Layer(record.width, record.height, ld.name, {
      id: ld.id,
      opacityLevel: ld.opacityLevel,
      isSketch: ld.isSketch,
      excludeFromExport: ld.excludeFromExport,
    });
    layer.visible = ld.visible;
    if (ld.blob) {
      const bitmap = await createImageBitmap(ld.blob);
      layer.ctx.drawImage(bitmap, 0, 0);
    }
    doc.layers.push(layer);
  }
  doc.activeLayerIndex = Math.min(record.activeLayerIndex ?? doc.layers.length - 1, doc.layers.length - 1);
  return doc;
}

async function estimateStorage() {
  if (navigator.storage?.estimate) {
    try {
      return await navigator.storage.estimate();
    } catch (e) {
      return null;
    }
  }
  return null;
}


// ---- input.js ----
// ペン・タッチ・マウスの入力をまとめて扱う。
// - ペン優先（手のひら誤描画防止）: ペンが押されている間はタッチを無視する
// - 2本指=パン/ピンチ/タップでもどす、3本指タップ=すすむ
// - スペース+ドラッグ / ホイールでのパン・ズーム（トラックパッド・マウス機用）

function centroid(list) {
  let x = 0;
  let y = 0;
  for (const p of list) {
    x += p.x;
    y += p.y;
  }
  return { x: x / list.length, y: y / list.length };
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

class InputController {
  constructor({ viewportEl, getViewport, getDoc, getActiveLayer, brush, history, onStrokeStart, onStrokeCommit, onRequestUndo, onRequestRedo }) {
    this.viewportEl = viewportEl;
    this.getViewport = getViewport;
    this.getDoc = getDoc;
    this.getActiveLayer = getActiveLayer;
    this.brush = brush;
    this.history = history;
    this.onStrokeStart = onStrokeStart;
    this.onStrokeCommit = onStrokeCommit;
    this.onRequestUndo = onRequestUndo;
    this.onRequestRedo = onRequestRedo;

    this.touches = new Map();
    this.penActive = false;
    this.drawing = false;
    this.drawingPointerId = null;
    this.gestureMode = false;
    this.spaceHeld = false;
    this.mousePanning = false;
    this.enabled = true;

    this._onPointerDown = this._onPointerDown.bind(this);
    this._onPointerMove = this._onPointerMove.bind(this);
    this._onPointerUp = this._onPointerUp.bind(this);
    this._onWheel = this._onWheel.bind(this);
    this._onKeyDown = this._onKeyDown.bind(this);
    this._onKeyUp = this._onKeyUp.bind(this);

    viewportEl.addEventListener("pointerdown", this._onPointerDown);
    viewportEl.addEventListener("pointermove", this._onPointerMove);
    window.addEventListener("pointerup", this._onPointerUp);
    window.addEventListener("pointercancel", this._onPointerUp);
    viewportEl.addEventListener("wheel", this._onWheel, { passive: false });
    window.addEventListener("keydown", this._onKeyDown);
    window.addEventListener("keyup", this._onKeyUp);
  }

  dispose() {
    this.viewportEl.removeEventListener("pointerdown", this._onPointerDown);
    this.viewportEl.removeEventListener("pointermove", this._onPointerMove);
    window.removeEventListener("pointerup", this._onPointerUp);
    window.removeEventListener("pointercancel", this._onPointerUp);
    this.viewportEl.removeEventListener("wheel", this._onWheel);
    window.removeEventListener("keydown", this._onKeyDown);
    window.removeEventListener("keyup", this._onKeyUp);
  }

  _onPointerDown(e) {
    if (!this.enabled) return;
    this.viewportEl.setPointerCapture?.(e.pointerId);

    if (e.pointerType === "touch") {
      if (this.penActive) {
        e.preventDefault();
        return;
      }
      this.touches.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY });

      if (this.touches.size === 1 && !this.gestureMode) {
        this._beginDraw(e);
        return;
      }
      if (this.touches.size >= 2) {
        if (this.drawing) this._endDraw();
        if (!this.gestureMode) {
          this.gestureMode = true;
          this._gestureStartTime = performance.now();
          this._gestureMoved = false;
          this._gestureMaxTouches = 0;
        }
        this._gestureMaxTouches = Math.max(this._gestureMaxTouches, this.touches.size);
        this._captureGestureBase();
      }
      return;
    }

    if (e.pointerType === "pen") {
      this.penActive = true;
      e.preventDefault();
      this._beginDraw(e);
      return;
    }

    if (e.button === 1 || this.spaceHeld) {
      this.mousePanning = true;
      this._panLast = { x: e.clientX, y: e.clientY };
      e.preventDefault();
      return;
    }
    if (e.button === 0) this._beginDraw(e);
  }

  _onPointerMove(e) {
    if (!this.enabled) return;

    if (e.pointerType === "touch" && this.touches.has(e.pointerId)) {
      const info = this.touches.get(e.pointerId);
      info.x = e.clientX;
      info.y = e.clientY;
      if (this.gestureMode) {
        this._applyGesture();
        return;
      }
    }

    if (this.mousePanning) {
      const dx = e.clientX - this._panLast.x;
      const dy = e.clientY - this._panLast.y;
      this._panLast = { x: e.clientX, y: e.clientY };
      this.getViewport().panBy(dx, dy);
      return;
    }

    if (!this.drawing) return;
    if (e.pointerType === "touch" && e.pointerId !== this.drawingPointerId) return;

    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const vp = this.getViewport();
    const pts = events.map((ev) => {
      const d = vp.screenToDoc(ev.clientX, ev.clientY);
      return { x: d.x, y: d.y, pressure: ev.pressure, t: ev.timeStamp };
    });
    this.brush.extendStroke(this.getDoc(), this.getActiveLayer(), pts, performance.now());
  }

  _onPointerUp(e) {
    if (e.pointerType === "touch") {
      const wasTracked = this.touches.has(e.pointerId);
      this.touches.delete(e.pointerId);

      if (this.gestureMode) {
        if (this.touches.size === 0) {
          const dt = performance.now() - this._gestureStartTime;
          if (!this._gestureMoved && dt < 350) {
            if (this._gestureMaxTouches === 2) this.onRequestUndo?.();
            else if (this._gestureMaxTouches >= 3) this.onRequestRedo?.();
          }
          this.gestureMode = false;
          this._gestureMaxTouches = 0;
        }
        return;
      }
      if (wasTracked && e.pointerId === this.drawingPointerId) this._endDraw();
      return;
    }

    if (e.pointerType === "pen") this.penActive = false;
    if (this.mousePanning) {
      this.mousePanning = false;
      return;
    }
    if (this.drawing) this._endDraw();
  }

  _captureGestureBase() {
    const arr = [...this.touches.values()];
    if (arr.length >= 2) {
      this._gestureCentroid = centroid(arr);
      this._gestureDist = dist(arr[0], arr[1]);
    }
  }

  _applyGesture() {
    const arr = [...this.touches.values()];
    for (const t of arr) {
      if (Math.hypot(t.x - t.startX, t.y - t.startY) > 14) this._gestureMoved = true;
    }
    if (arr.length === 2) {
      const c = centroid(arr);
      const d = dist(arr[0], arr[1]);
      const vp = this.getViewport();
      vp.panBy(c.x - this._gestureCentroid.x, c.y - this._gestureCentroid.y);
      const factor = d / (this._gestureDist || d);
      if (Math.abs(factor - 1) > 0.001) vp.zoomAt(c.x, c.y, factor);
      this._gestureCentroid = c;
      this._gestureDist = d;
    }
  }

  _beginDraw(e) {
    this.drawing = true;
    if (e.pointerType === "touch") this.drawingPointerId = e.pointerId;
    const vp = this.getViewport();
    const d = vp.screenToDoc(e.clientX, e.clientY);
    const layer = this.getActiveLayer();
    this.history.beginAction(layer);
    this.onStrokeStart?.();
    this.brush.beginStroke(this.getDoc(), layer, { x: d.x, y: d.y, pressure: e.pressure }, performance.now());
  }

  _endDraw() {
    this.drawing = false;
    this.drawingPointerId = null;
    const layer = this.getActiveLayer();
    this.brush.endStroke(this.getDoc(), layer, performance.now());
    this.history.commitAction(layer);
    this.onStrokeCommit?.();
  }

  _onWheel(e) {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.93;
    this.getViewport().zoomAt(e.clientX, e.clientY, factor);
  }

  _onKeyDown(e) {
    if (e.code === "Space") {
      this.spaceHeld = true;
    }
    const meta = e.ctrlKey || e.metaKey;
    if (meta && e.key.toLowerCase() === "z" && !e.shiftKey) {
      e.preventDefault();
      this.onRequestUndo?.();
    } else if ((meta && e.key.toLowerCase() === "z" && e.shiftKey) || (meta && e.key.toLowerCase() === "y")) {
      e.preventDefault();
      this.onRequestRedo?.();
    }
  }

  _onKeyUp(e) {
    if (e.code === "Space") this.spaceHeld = false;
  }
}


// ---- gallery.js ----

let onOpenWork = null;
let onCreateWork = null;
let objectUrls = [];

const grid = document.getElementById("gallery-grid");
const emptyMsg = document.getElementById("gallery-empty");
const storageHint = document.getElementById("storage-hint");
const btnNewWork = document.getElementById("btn-new-work");

const modal = document.getElementById("modal-new-work");
const presetList = document.getElementById("paper-preset-list");
const paperTypeList = document.getElementById("paper-type-list");
const chkCustom = document.getElementById("chk-custom-size");
const customInputs = document.getElementById("custom-size-inputs");
const inputWmm = document.getElementById("input-w-mm");
const inputHmm = document.getElementById("input-h-mm");
const inputTitle = document.getElementById("input-new-title");
const btnCancelNew = document.getElementById("btn-cancel-new");
const btnConfirmNew = document.getElementById("btn-confirm-new");

let selectedPresetId = "a4-h";
let selectedPaperType = "gayoshi";

function initGallery({ onOpenWork: openCb, onCreateWork: createCb }) {
  onOpenWork = openCb;
  onCreateWork = createCb;

  buildPresetList();
  buildPaperTypeList();

  btnNewWork.addEventListener("click", () => {
    inputTitle.value = "";
    show(modal);
  });
  btnCancelNew.addEventListener("click", () => hide(modal));
  chkCustom.addEventListener("change", () => {
    customInputs.hidden = !chkCustom.checked;
  });
  btnConfirmNew.addEventListener("click", onConfirmNew);

  refreshGallery();
}

async function showGallery() {
  showGalleryScreen();
  await refreshGallery();
}

function buildPresetList() {
  presetList.innerHTML = "";
  for (const preset of PAPER_PRESETS) {
    const btn = document.createElement("button");
    btn.className = "preset-card";
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(preset.id === selectedPresetId));
    const shape = document.createElement("div");
    shape.className = "preset-shape";
    const scale = 60 / Math.max(preset.w, preset.h);
    shape.style.width = `${Math.round(preset.w * scale)}px`;
    shape.style.height = `${Math.round(preset.h * scale)}px`;
    btn.appendChild(shape);
    btn.appendChild(document.createTextNode(preset.label));
    btn.addEventListener("click", () => {
      selectedPresetId = preset.id;
      chkCustom.checked = false;
      customInputs.hidden = true;
      [...presetList.children].forEach((c) => c.setAttribute("aria-pressed", String(c === btn)));
    });
    presetList.appendChild(btn);
  }
}

function buildPaperTypeList() {
  paperTypeList.innerHTML = "";
  for (const type of PAPER_TYPES) {
    const btn = document.createElement("button");
    btn.className = "preset-card";
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(type.id === selectedPaperType));
    btn.textContent = type.label;
    btn.addEventListener("click", () => {
      selectedPaperType = type.id;
      [...paperTypeList.children].forEach((c) => c.setAttribute("aria-pressed", String(c === btn)));
    });
    paperTypeList.appendChild(btn);
  }
}

function onConfirmNew() {
  let width;
  let height;
  if (chkCustom.checked) {
    width = mmToPx(Math.max(50, Math.min(600, Number(inputWmm.value) || 297)));
    height = mmToPx(Math.max(50, Math.min(600, Number(inputHmm.value) || 210)));
  } else {
    const preset = PAPER_PRESETS.find((p) => p.id === selectedPresetId) || PAPER_PRESETS[3];
    width = mmToPx(preset.w);
    height = mmToPx(preset.h);
  }
  const title = inputTitle.value.trim() || "むだい";
  hide(modal);
  onCreateWork?.({ width, height, paperType: selectedPaperType, title });
}

async function refreshGallery() {
  objectUrls.forEach((u) => URL.revokeObjectURL(u));
  objectUrls = [];

  const list = await loadWorkList();
  grid.innerHTML = "";
  emptyMsg.hidden = list.length > 0;

  for (const work of list) {
    grid.appendChild(buildCard(work));
  }

  const est = await estimateStorage();
  let hint = "";
  if (list.length >= WORK_COUNT_WARNING) {
    hint = `さくひんが ${list.length}こ あります。いらないものを けしましょう。`;
  } else if (est && est.quota) {
    const pct = Math.round((est.usage / est.quota) * 100);
    hint = `たんまつの ようりょう を ${pct}% つかっています`;
  }
  storageHint.textContent = hint;
}

function buildCard(work) {
  const card = document.createElement("div");
  card.className = "work-card";
  card.setAttribute("role", "listitem");

  const img = document.createElement("img");
  if (work.thumb) {
    const url = URL.createObjectURL(work.thumb);
    objectUrls.push(url);
    img.src = url;
  }
  img.alt = `${work.title} のプレビュー`;
  img.addEventListener("click", () => onOpenWork?.(work.id));
  card.appendChild(img);

  const name = document.createElement("div");
  name.className = "work-name";
  name.textContent = work.title;
  name.addEventListener("click", () => onOpenWork?.(work.id));
  card.appendChild(name);

  const menuRow = document.createElement("div");
  menuRow.className = "work-menu-row";

  const renameBtn = document.createElement("button");
  renameBtn.textContent = "✎";
  renameBtn.setAttribute("aria-label", "名前をかえる");
  renameBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    const next = prompt("あたらしい 名前", work.title);
    if (next && next.trim()) {
      await renameWork(work.id, next.trim().slice(0, 40));
      refreshGallery();
    }
  });

  const dupBtn = document.createElement("button");
  dupBtn.textContent = "⧉";
  dupBtn.setAttribute("aria-label", "コピーする");
  dupBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    await duplicateWork(work.id);
    refreshGallery();
  });

  const delBtn = document.createElement("button");
  delBtn.textContent = "🗑";
  delBtn.setAttribute("aria-label", "けす");
  delBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    const ok = await confirmDialog(`「${work.title}」を けしますか？\nもとに もどせません。`);
    if (ok) {
      await deleteWork(work.id);
      refreshGallery();
    }
  });

  menuRow.appendChild(renameBtn);
  menuRow.appendChild(dupBtn);
  menuRow.appendChild(delBtn);
  card.appendChild(menuRow);
  return card;
}


// ---- editor.js ----

const stageEl = document.getElementById("canvas-stage");
const viewportEl = document.getElementById("canvas-viewport");
const titleInput = document.getElementById("input-title");
const btnBack = document.getElementById("btn-back-gallery");
const btnUndo = document.getElementById("btn-undo");
const btnRedo = document.getElementById("btn-redo");
const btnSettings = document.getElementById("btn-settings");
const btnFit = document.getElementById("btn-fit");

const btnLayersToggle = document.getElementById("btn-layers-toggle");
const layerPanel = document.getElementById("layer-panel");
const layerList = document.getElementById("layer-list");
const btnLayerAdd = document.getElementById("btn-layer-add");

const toolListEl = document.getElementById("tool-list");
const btnDry = document.getElementById("btn-dry");
const btnSizePopover = document.getElementById("btn-size-popover");
const sizePreviewDot = document.getElementById("size-preview-dot");

const popoverSize = document.getElementById("popover-size");
const rangeSize = document.getElementById("range-size");
const rangeStrength = document.getElementById("range-strength");
const strengthLabel = document.getElementById("strength-label");
const rowStrength = document.getElementById("row-strength");
const brushPreviewCanvas = document.getElementById("brush-preview");

const modalSettings = document.getElementById("modal-settings");
const chkLowQuality = document.getElementById("chk-low-quality");
const chkLeftHanded = document.getElementById("chk-left-handed");
const rangeStabilize = document.getElementById("range-stabilize");
const btnExportPng = document.getElementById("btn-export-png");
const btnPrint = document.getElementById("btn-print");
const btnCloseSettings = document.getElementById("btn-close-settings");

const SETTINGS_KEY = "sketchnote_settings";

function loadSettings() {
  try {
    return { lowQuality: false, leftHanded: false, stabilize: 1, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") };
  } catch (e) {
    return { lowQuality: false, leftHanded: false, stabilize: 1 };
  }
}
function saveSettings(s) {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  } catch (e) {
    /* 保存できなくても動作は続ける */
  }
}

let doc = null;
let viewport = null;
let inputController = null;
const brush = new BrushEngine();
const history = new History();
let colorPicker = null;
let settings = loadSettings();
let autosaveTimer = null;
let dryIntervalStarted = false;
let layerRowRefs = new Map();

function initEditor() {
  brush.stabilizeLevel = settings.stabilize;
  document.body.classList.toggle("left-handed", settings.leftHanded);

  colorPicker = new ColorPicker(brush, () => {});

  history.onChange = (canUndo, canRedo) => {
    btnUndo.disabled = !canUndo;
    btnRedo.disabled = !canRedo;
  };

  buildToolList();
  selectTool("pencil");

  btnBack.addEventListener("click", async () => {
    await saveNow();
    showGallery();
  });
  titleInput.addEventListener("change", () => {
    if (!doc) return;
    doc.title = titleInput.value.trim() || "むだい";
    scheduleAutosave();
  });

  btnUndo.addEventListener("click", () => {
    if (!doc) return;
    history.undo(doc);
    renderLayerPanel();
    scheduleAutosave();
  });
  btnRedo.addEventListener("click", () => {
    if (!doc) return;
    history.redo(doc);
    renderLayerPanel();
    scheduleAutosave();
  });

  btnFit.addEventListener("click", () => viewport?.fit());

  btnLayersToggle.addEventListener("click", () => {
    layerPanel.hidden = !layerPanel.hidden;
  });
  btnLayerAdd.addEventListener("click", () => {
    if (!doc || doc.layers.length >= 4) return;
    const layer = doc.addLayer(`かみ${doc.layers.length + 1}`);
    doc.activeLayerIndex = doc.layers.length - 1;
    syncStageDom(doc, stageEl);
    renderLayerPanel();
    scheduleAutosave();
  });

  btnDry.addEventListener("click", () => {
    if (!doc) return;
    const layer = doc.getActiveLayer();
    history.beginAction(layer);
    brush.forceDry(layer, performance.now());
    history.commitAction();
    scheduleAutosave();
  });

  btnSizePopover.addEventListener("click", () => {
    if (!popoverSize.hidden) {
      hide(popoverSize);
      return;
    }
    show(popoverSize);
    positionPopover(popoverSize, btnSizePopover);
    updateSizePopoverValues();
  });
  document.addEventListener("pointerdown", (e) => {
    if (popoverSize.hidden) return;
    if (popoverSize.contains(e.target) || btnSizePopover.contains(e.target)) return;
    hide(popoverSize);
  });
  rangeSize.addEventListener("input", () => {
    brush.setSize(Number(rangeSize.value));
    updateSizePreviewDot();
    brushPreview(brushPreviewCanvas, brush);
  });
  rangeStrength.addEventListener("input", () => {
    brush.setStrength(Number(rangeStrength.value));
    brushPreview(brushPreviewCanvas, brush);
  });

  btnSettings.addEventListener("click", () => {
    chkLowQuality.checked = settings.lowQuality;
    chkLeftHanded.checked = settings.leftHanded;
    rangeStabilize.value = String(settings.stabilize);
    show(modalSettings);
  });
  chkLowQuality.addEventListener("change", () => {
    settings.lowQuality = chkLowQuality.checked;
    saveSettings(settings);
  });
  chkLeftHanded.addEventListener("change", () => {
    settings.leftHanded = chkLeftHanded.checked;
    document.body.classList.toggle("left-handed", settings.leftHanded);
    saveSettings(settings);
  });
  rangeStabilize.addEventListener("input", () => {
    settings.stabilize = Number(rangeStabilize.value);
    brush.stabilizeLevel = settings.stabilize;
    saveSettings(settings);
  });
  btnCloseSettings.addEventListener("click", () => hide(modalSettings));
  btnExportPng.addEventListener("click", exportPng);
  btnPrint.addEventListener("click", printWork);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) saveNow();
  });

  setInterval(() => {
    if (doc) brush.checkDrying(doc, performance.now());
  }, 500);
}

function isLowQuality() {
  return settings.lowQuality;
}

function buildToolList() {
  toolListEl.innerHTML = "";
  for (const t of TOOLS) {
    const btn = document.createElement("button");
    btn.className = "tool-btn";
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", "false");
    btn.dataset.tool = t.id;
    btn.innerHTML = `<span class="tool-icon" aria-hidden="true">${t.icon}</span><span>${t.label}</span>`;
    btn.addEventListener("click", () => selectTool(t.id));
    toolListEl.appendChild(btn);
  }
}

function selectTool(id) {
  brush.setTool(id);
  [...toolListEl.children].forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tool === id)));
  btnDry.hidden = id !== "watercolor" && id !== "waterbrush";
  colorPicker.swatchBtn.parentElement.style.visibility = id === "eraser" ? "hidden" : "visible";
  const def = TOOLS.find((t) => t.id === id);
  strengthLabel.textContent = def.strengthLabel;
  rowStrength.hidden = false;
  updateSizePreviewDot();
}

function updateSizePopoverValues() {
  rangeSize.value = String(brush.getSize());
  rangeStrength.value = String(brush.getStrength());
  brushPreview(brushPreviewCanvas, brush);
}

function updateSizePreviewDot() {
  const px = Math.max(6, Math.min(32, brush.sizePx() * 0.5));
  sizePreviewDot.style.width = `${px}px`;
  sizePreviewDot.style.height = `${px}px`;
  sizePreviewDot.style.background = brush.tool === "eraser" ? "#c9c4b6" : brush.color;
}

async function openNewWork({ width, height, paperType, title }) {
  let w = width;
  let h = height;
  if (settings.lowQuality) {
    w = Math.round(w * 0.8);
    h = Math.round(h * 0.8);
  }
  const newDoc = SketchDocument.createDefault({ width: w, height: h, paperType, title });
  await setupDocument(newDoc);
  await saveNow();
}

async function openWork(id) {
  const record = await loadWorkRecord(id);
  if (!record) return;
  const hydrated = await hydrateDocument(record);
  await setupDocument(hydrated);
}

async function setupDocument(newDoc) {
  doc = newDoc;
  history.reset();
  titleInput.value = doc.title;
  syncStageDom(doc, stageEl);

  if (inputController) inputController.dispose();
  viewport = new Viewport(viewportEl, stageEl, doc.width, doc.height);
  inputController = new InputController({
    viewportEl,
    getViewport: () => viewport,
    getDoc: () => doc,
    getActiveLayer: () => doc.getActiveLayer(),
    brush,
    history,
    onStrokeStart: () => {},
    onStrokeCommit: () => {
      updateLayerThumbnails();
      scheduleAutosave();
    },
    onRequestUndo: () => {
      history.undo(doc);
      renderLayerPanel();
      scheduleAutosave();
    },
    onRequestRedo: () => {
      history.redo(doc);
      renderLayerPanel();
      scheduleAutosave();
    },
  });

  renderLayerPanel();
  showEditorScreen();
  requestAnimationFrame(() => viewport.fit());
}

function renderLayerPanel() {
  layerList.innerHTML = "";
  layerRowRefs = new Map();
  if (!doc) return;
  const orderTopFirst = [...doc.layers].reverse();
  btnLayerAdd.disabled = doc.layers.length >= 4;

  for (const layer of orderTopFirst) {
    const idx = doc.layers.indexOf(layer);
    const li = document.createElement("li");
    li.className = "layer-item" + (idx === doc.activeLayerIndex ? " active" : "");

    const thumb = document.createElement("canvas");
    thumb.className = "layer-thumb";
    thumb.width = 72;
    thumb.height = 56;
    drawThumb(thumb, layer);

    const nameSpan = document.createElement("span");
    nameSpan.className = "layer-name";
    nameSpan.textContent = layer.name + (layer.isSketch ? "(したがき)" : "");

    const clickArea = document.createElement("div");
    clickArea.style.display = "flex";
    clickArea.style.alignItems = "center";
    clickArea.style.gap = "6px";
    clickArea.style.flex = "1";
    clickArea.style.cursor = "pointer";
    clickArea.appendChild(thumb);
    clickArea.appendChild(nameSpan);
    clickArea.addEventListener("click", () => {
      doc.activeLayerIndex = idx;
      renderLayerPanel();
    });

    const visBtn = document.createElement("button");
    visBtn.textContent = layer.visible ? "👁" : "🚫";
    visBtn.setAttribute("aria-label", "見える/見えない");
    visBtn.addEventListener("click", () => {
      layer.visible = !layer.visible;
      layer.applyOpacityToDom();
      visBtn.textContent = layer.visible ? "👁" : "🚫";
      scheduleAutosave();
    });

    const opacityBtn = document.createElement("button");
    opacityBtn.className = "opacity-toggle";
    const opacityLabels = ["うすい", "ふつう", "こい"];
    opacityBtn.textContent = opacityLabels[layer.opacityLevel];
    opacityBtn.addEventListener("click", () => {
      layer.opacityLevel = (layer.opacityLevel + 1) % 3;
      layer.applyOpacityToDom();
      opacityBtn.textContent = opacityLabels[layer.opacityLevel];
      scheduleAutosave();
    });

    const upBtn = document.createElement("button");
    upBtn.textContent = "▲";
    upBtn.setAttribute("aria-label", "上へ");
    upBtn.disabled = idx === doc.layers.length - 1;
    upBtn.addEventListener("click", () => {
      doc.moveLayer(layer.id, 1);
      syncStageDom(doc, stageEl);
      renderLayerPanel();
      scheduleAutosave();
    });

    const downBtn = document.createElement("button");
    downBtn.textContent = "▼";
    downBtn.setAttribute("aria-label", "下へ");
    downBtn.disabled = idx === 0;
    downBtn.addEventListener("click", () => {
      doc.moveLayer(layer.id, -1);
      syncStageDom(doc, stageEl);
      renderLayerPanel();
      scheduleAutosave();
    });

    const dupBtn = document.createElement("button");
    dupBtn.textContent = "⧉";
    dupBtn.setAttribute("aria-label", "コピー");
    dupBtn.disabled = doc.layers.length >= 4;
    dupBtn.addEventListener("click", () => {
      doc.duplicateLayer(layer.id);
      syncStageDom(doc, stageEl);
      renderLayerPanel();
      scheduleAutosave();
    });

    const delBtn = document.createElement("button");
    delBtn.textContent = "🗑";
    delBtn.setAttribute("aria-label", "けす");
    delBtn.disabled = doc.layers.length <= 1;
    delBtn.addEventListener("click", async () => {
      const ok = await confirmDialog(`「${layer.name}」を けしますか？`);
      if (!ok) return;
      doc.removeLayer(layer.id);
      syncStageDom(doc, stageEl);
      renderLayerPanel();
      scheduleAutosave();
    });

    const excludeLabel = document.createElement("label");
    excludeLabel.className = "exclude-chk";
    const excludeChk = document.createElement("input");
    excludeChk.type = "checkbox";
    excludeChk.checked = layer.excludeFromExport;
    excludeChk.addEventListener("change", () => {
      layer.excludeFromExport = excludeChk.checked;
      scheduleAutosave();
    });
    excludeLabel.appendChild(excludeChk);
    excludeLabel.appendChild(document.createTextNode("除外"));

    const row2 = document.createElement("div");
    row2.style.display = "flex";
    row2.style.flexWrap = "wrap";
    row2.style.gap = "3px";
    row2.style.alignItems = "center";
    row2.appendChild(visBtn);
    row2.appendChild(opacityBtn);
    row2.appendChild(upBtn);
    row2.appendChild(downBtn);
    row2.appendChild(dupBtn);
    row2.appendChild(delBtn);
    row2.appendChild(excludeLabel);

    const wrap = document.createElement("div");
    wrap.style.display = "flex";
    wrap.style.flexDirection = "column";
    wrap.style.flex = "1";
    wrap.appendChild(clickArea);
    wrap.appendChild(row2);

    li.appendChild(wrap);
    layerList.appendChild(li);
    layerRowRefs.set(layer.id, thumb);
  }
}

function drawThumb(canvas, layer) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(layer.canvas, 0, 0, canvas.width, canvas.height);
  if (layer.isWet()) ctx.drawImage(layer.wetCanvas, 0, 0, canvas.width, canvas.height);
}

function updateLayerThumbnails() {
  if (!doc) return;
  for (const layer of doc.layers) {
    const thumb = layerRowRefs.get(layer.id);
    if (thumb) drawThumb(thumb, layer);
  }
}

function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveNow, 3000);
}

async function saveNow() {
  if (!doc) return;
  try {
    await saveWork(doc);
  } catch (e) {
    console.warn("保存に失敗しました", e);
  }
}

function exportPng() {
  if (!doc) return;
  const canvas = doc.flatten({ forExport: true });
  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `${doc.title}_${date}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, "image/png");
}

function printWork() {
  if (!doc) return;
  let printArea = document.getElementById("print-area");
  if (!printArea) {
    printArea = document.createElement("div");
    printArea.id = "print-area";
    document.body.appendChild(printArea);
  }
  printArea.innerHTML = "";
  const canvas = doc.flatten({ forExport: true });
  printArea.appendChild(canvas);
  window.print();
}
