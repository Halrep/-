<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>アイデアスケッチノート</title>
<meta name="theme-color" content="#5ec8a8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- ==================== 作品一覧 画面 ==================== -->
<section id="screen-gallery" class="screen" aria-label="作品一覧の画面">
  <header class="gallery-header">
    <h1 class="app-title">アイデアスケッチノート</h1>
    <div class="header-actions">
      <button id="btn-furigana" class="btn btn-flat" aria-pressed="false">
        <span class="btn-icon" aria-hidden="true">振</span><span class="btn-label" data-ruby="ふりがな">ふりがな</span>
      </button>
    </div>
  </header>
  <div class="gallery-toolbar">
    <button id="btn-new-work" class="btn btn-primary btn-lg">
      <span class="btn-icon" aria-hidden="true">＋</span><span class="btn-label" data-ruby="あたらしい さくひん">あたらしい さくひん</span>
    </button>
    <span id="storage-hint" class="storage-hint" role="status"></span>
  </div>
  <div id="gallery-grid" class="gallery-grid" role="list"></div>
  <p id="gallery-empty" class="gallery-empty" hidden>まだ さくひんが ありません。<br>「あたらしい さくひん」から はじめよう。</p>
</section>

<!-- ==================== 新規作成 モーダル ==================== -->
<div id="modal-new-work" class="modal-overlay" hidden>
  <div class="modal-box" role="dialog" aria-label="あたらしい さくひん" aria-modal="true">
    <h2 data-ruby="ようし を えらぶ">用紙をえらぶ</h2>
    <div id="paper-preset-list" class="preset-grid"></div>
    <p class="popover-subtitle" data-ruby="かみ の しゅるい">紙のしゅるい</p>
    <div id="paper-type-list" class="preset-grid preset-grid-3"></div>
    <div class="custom-size-row">
      <label class="custom-size-toggle">
        <input type="checkbox" id="chk-custom-size">
        <span data-ruby="じぶんで さいず を きめる">じぶんでサイズを決める</span>
      </label>
      <div id="custom-size-inputs" class="custom-size-inputs" hidden>
        <label>幅(mm) <input type="number" id="input-w-mm" min="50" max="600" value="297"></label>
        <label>高さ(mm) <input type="number" id="input-h-mm" min="50" max="600" value="210"></label>
      </div>
    </div>
    <label class="title-row">
      さくひんの名前
      <input type="text" id="input-new-title" maxlength="40" placeholder="むだい">
    </label>
    <div class="modal-actions">
      <button id="btn-cancel-new" class="btn btn-flat">やめる</button>
      <button id="btn-confirm-new" class="btn btn-primary">つくる</button>
    </div>
  </div>
</div>

<!-- ==================== キャンバス（編集）画面 ==================== -->
<section id="screen-editor" class="screen" hidden aria-label="お絵かきの画面">
  <header class="editor-topbar">
    <button id="btn-back-gallery" class="btn btn-flat btn-icon-only" aria-label="作品一覧へもどる">←</button>
    <input id="input-title" class="editor-title-input" maxlength="40" aria-label="さくひんの名前">
    <div class="topbar-spacer"></div>
    <button id="btn-undo" class="btn btn-flat btn-icon-only" aria-label="もどす" disabled>↺</button>
    <button id="btn-redo" class="btn btn-flat btn-icon-only" aria-label="すすむ" disabled>↻</button>
    <button id="btn-settings" class="btn btn-flat btn-icon-only" aria-label="せってい">⚙</button>
  </header>

  <div id="canvas-viewport" class="canvas-viewport">
    <div id="canvas-stage" class="canvas-stage"></div>
  </div>

  <button id="btn-layers-toggle" class="btn layers-fab" aria-label="かさねる紙パネルを開く">
    <span aria-hidden="true">▤</span>
  </button>
  <aside id="layer-panel" class="layer-panel" hidden aria-label="かさねる紙(レイヤー)パネル">
    <div class="layer-panel-head">
      <span data-ruby="かさねる かみ">かさねる紙</span>
      <button id="btn-layer-add" class="btn btn-flat btn-icon-only" aria-label="紙をふやす">＋</button>
    </div>
    <ul id="layer-list" class="layer-list"></ul>
  </aside>

  <button id="btn-fit" class="btn fit-fab" aria-label="ぴったり表示にもどす">⤢</button>

  <footer class="editor-bottombar">
    <div id="tool-list" class="tool-list" role="tablist" aria-label="どうぐ"></div>
    <div class="tool-options">
      <button id="btn-dry" class="btn btn-flat tool-option-btn" hidden>
        <span aria-hidden="true">🌬</span><span data-ruby="かわかす">かわかす</span>
      </button>
      <button id="btn-color-swatch" class="color-swatch" aria-label="いろをえらぶ" style="--swatch-color:#3a3a3a"></button>
      <button id="btn-size-popover" class="btn btn-flat size-btn" aria-label="ふとさをえらぶ">
        <span id="size-preview-dot" class="size-preview-dot"></span>
      </button>
    </div>
  </footer>
</section>

<!-- ==================== 色えらび ポップオーバー ==================== -->
<div id="popover-color" class="popover" hidden>
  <div class="popover-arrow"></div>
  <div class="color-grid" id="color-grid-base"></div>
  <p class="popover-subtitle" data-ruby="さいきん つかった いろ">さいきん使った色</p>
  <div class="color-grid" id="color-grid-recent"></div>
  <button id="btn-more-color" class="btn btn-flat" data-ruby="もっと いろを えらぶ">もっと色をえらぶ</button>
  <div id="color-advanced" class="color-advanced" hidden>
    <canvas id="hue-ring" width="180" height="180"></canvas>
    <canvas id="sv-square" width="120" height="120"></canvas>
  </div>
</div>

<!-- ==================== 太さ ポップオーバー ==================== -->
<div id="popover-size" class="popover" hidden>
  <div class="popover-arrow"></div>
  <label class="slider-row">
    <span data-ruby="ふとさ">ふとさ</span>
    <input type="range" id="range-size" min="1" max="100" value="20">
  </label>
  <label class="slider-row" id="row-strength">
    <span id="strength-label" data-ruby="のうど">のうど</span>
    <input type="range" id="range-strength" min="0" max="100" value="70">
  </label>
  <div class="brush-preview-wrap"><canvas id="brush-preview" width="80" height="80"></canvas></div>
</div>

<!-- ==================== せってい モーダル ==================== -->
<div id="modal-settings" class="modal-overlay" hidden>
  <div class="modal-box" role="dialog" aria-label="せってい" aria-modal="true">
    <h2>せってい</h2>
    <label class="settings-row">
      <span data-ruby="ひんしつ を おとして はやくする">品質を落として速くする</span>
      <input type="checkbox" id="chk-low-quality">
    </label>
    <label class="settings-row">
      <span data-ruby="ひだりきき レイアウト">左利きレイアウト</span>
      <input type="checkbox" id="chk-left-handed">
    </label>
    <label class="settings-row">
      <span data-ruby="てぶれ を おさえる">手ぶれをおさえる</span>
      <input type="range" id="range-stabilize" min="0" max="3" value="1">
    </label>
    <div class="modal-actions">
      <button id="btn-export-png" class="btn btn-flat" data-ruby="PNGで ほぞん">PNGで保存</button>
      <button id="btn-print" class="btn btn-flat" data-ruby="いんさつ">印刷</button>
    </div>
    <div class="modal-actions">
      <button id="btn-close-settings" class="btn btn-primary">とじる</button>
    </div>
  </div>
</div>

<div id="confirm-dialog" class="modal-overlay" hidden>
  <div class="modal-box" role="alertdialog" aria-modal="true">
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button id="btn-confirm-no" class="btn btn-flat">やめる</button>
      <button id="btn-confirm-yes" class="btn btn-danger">けす</button>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
