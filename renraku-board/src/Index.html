<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    /* ライトは本文をAAA（7:1以上）まで引き上げている。AA（4.5:1）ぎりぎりだと
       ノートPCの画面や明るい職員室では白っぽく沈んで読みにくいため。 */
    --paper:#eef0ec; --card:#fff; --ink:#1a2027; --ink-soft:#48535e; --ink-faint:#5c666f;
    --line:#b6c0b9; --neutral-soft:#e4e8e5; --accent:#2a4489; --accent-soft:#dde5f6;
    --good:#1f6640; --good-soft:#d8ebe0; --warn:#7d500a; --warn-soft:#f5e6cc;
    --danger:#9c2f25; --danger-soft:#f7dcd8; --important-soft:#fdf0ee;
    --on-danger:#fff; --shadow:0 1px 3px rgba(26,32,39,.12);
    --ctrl-h:40px; /* 絞り込みバーの入力・プルダウン・ボタン・概況カードの共通の高さ（テーマ共通） */
  }
  @media (prefers-color-scheme: dark){ :root{
    --paper:#171b20; --card:#21262d; --ink:#e8ebee; --ink-soft:#a8b2bc; --ink-faint:#858f9a;
    --line:#3d4650; --neutral-soft:#333b44; --accent:#8aa3e8; --accent-soft:#2a3450;
    --good:#6dbd8f; --good-soft:#23392c; --warn:#d9a44a; --warn-soft:#3d321f;
    --danger:#e08074; --danger-soft:#452622; --important-soft:#2e1c1a;
    /* ダークの --danger は明るいサーモン。白文字だと 2.8:1 で読めないので暗い文字を乗せる */
    --on-danger:#171b20; --shadow:0 1px 3px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --paper:#171b20; --card:#21262d; --ink:#e8ebee; --ink-soft:#a8b2bc; --ink-faint:#858f9a;
    --line:#3d4650; --neutral-soft:#333b44; --accent:#8aa3e8; --accent-soft:#2a3450;
    --good:#6dbd8f; --good-soft:#23392c; --warn:#d9a44a; --warn-soft:#3d321f;
    --danger:#e08074; --danger-soft:#452622; --important-soft:#2e1c1a;
    /* ダークの --danger は明るいサーモン。白文字だと 2.8:1 で読めないので暗い文字を乗せる */
    --on-danger:#171b20; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    /* ライトは本文をAAA（7:1以上）まで引き上げている。AA（4.5:1）ぎりぎりだと
       ノートPCの画面や明るい職員室では白っぽく沈んで読みにくいため。 */
    --paper:#eef0ec; --card:#fff; --ink:#1a2027; --ink-soft:#48535e; --ink-faint:#5c666f;
    --line:#b6c0b9; --neutral-soft:#e4e8e5; --accent:#2a4489; --accent-soft:#dde5f6;
    --good:#1f6640; --good-soft:#d8ebe0; --warn:#7d500a; --warn-soft:#f5e6cc;
    --danger:#9c2f25; --danger-soft:#f7dcd8; --important-soft:#fdf0ee;
    --on-danger:#fff; --shadow:0 1px 3px rgba(26,32,39,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif}
  /* 全体シェル: 1行目はヘッダー（左カラムのみ）、2行目が本文＋右サイドバー。
     これでサイドバーの上端が絞り込みバーの上端と自動的に揃う（高さを数値で固定しない）。 */
  .app-shell{max-width:1500px;margin:0 auto;padding:0 28px 72px;
    display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:28px;align-items:start}
  .appbar{grid-column:1;grid-row:1}
  .app{grid-column:1;grid-row:2;min-width:0}
  /* margin-top は絞り込みバーの margin と同じ値。これで両者の上端がぴったり揃う */
  .sidebar{grid-column:2;grid-row:2;margin-top:12px;position:sticky;top:20px;
    display:flex;flex-direction:column;gap:20px;min-width:0;
    max-height:calc(100vh - 40px);overflow-y:auto}
  @media (max-width:1100px){
    .app-shell{grid-template-columns:1fr;padding:0 16px 72px}
    .appbar,.app,.sidebar{grid-column:1}
    .sidebar{grid-row:auto;position:static;max-height:none;overflow-y:visible;margin-top:20px}
  }
  a{color:var(--accent)}

  header.appbar{padding:20px 4px 0}
  .appbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .app-title{font-size:1.25rem;font-weight:700;margin:0}
  .app-title small{font-weight:500;color:var(--ink-soft);font-size:.78rem;margin-left:8px}
  .appbar-right{display:flex;align-items:center;gap:14px}
  .today-date{color:var(--ink-soft);font-size:.85rem;font-variant-numeric:tabular-nums}
  .me{color:var(--ink-soft);font-size:.8rem}

  .refresh-btn{appearance:none;cursor:pointer;font:inherit;font-size:.8rem;font-weight:600;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
  .refresh-btn:hover{color:var(--accent);border-color:var(--accent)}
  .refresh-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .refresh-btn .spin-icon{display:inline-block;width:11px;height:11px;line-height:11px;position:relative;
    vertical-align:-1px}
  .refresh-btn.spinning{color:var(--accent)}
  /* 回転中は「⟳」の文字を隠し、代わりに円形のリング（一部だけ透明な枠）を回す。
     文字の非対称な形をそのまま回すとガタついて見えるため、円で描く */
  .refresh-btn.spinning .spin-icon{color:transparent}
  .refresh-btn.spinning .spin-icon::before{
    content:'';position:absolute;inset:0;border-radius:50%;
    border:1.5px solid var(--accent);border-top-color:transparent;
    animation:spin .7s linear infinite}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.refresh-btn.spinning .spin-icon::before{animation:none}}
  @media (prefers-reduced-motion: reduce){.card.flash{animation:none;box-shadow:0 0 0 3px var(--accent)}}
  .theme-switch{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
  .theme-switch button{appearance:none;border:none;background:none;cursor:pointer;font:inherit;font-size:.75rem;
    font-weight:600;color:var(--ink-soft);border-radius:999px;padding:3px 12px;white-space:nowrap}
  .theme-switch button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .theme-switch button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  nav.tabs{display:flex;gap:4px;margin:16px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{appearance:none;background:none;border:none;font:inherit;color:var(--ink-soft);padding:10px 14px 8px;
    border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:.95rem}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
  .tab .badge{background:var(--danger);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;
    padding:0 7px;line-height:1.5;font-variant-numeric:tabular-nums}
  .tab .badge:empty{display:none}

  /* 概況カード。1枚のカードの中を3分割し、各区画はボタンにして
     クリックで絞り込める（押すとその条件だけに絞り込み、もう一度押すと解除）。
     ホバーで下線が出ることで「押せる」と伝わるようにしている。 */
  .summary{display:flex;align-items:stretch;height:var(--ctrl-h);background:var(--card);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
  .stat-seg{appearance:none;border:none;background:none;cursor:pointer;font:inherit;
    display:flex;align-items:center;gap:5px;padding:0 13px;height:100%;
    border-right:1px solid var(--line);color:var(--ink-soft);font-size:.75rem;white-space:nowrap}
  .stat-seg:last-child{border-right:none}
  .stat-seg:hover{background:var(--paper)}
  .stat-seg:hover b{text-decoration:underline}
  .stat-seg b{font-size:.92rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .stat-seg i{font-style:normal}
  .stat-seg.alert b{color:var(--danger)} .stat-seg.warn b{color:var(--warn)}
  .stat-seg[aria-pressed="true"]{background:var(--accent-soft)}
  .stat-seg[aria-pressed="true"] b,.stat-seg[aria-pressed="true"] i{color:var(--accent)}
  .stat-seg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  section.view{display:none} section.view.active{display:block}
  h2.section-label{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--ink-faint);margin:24px 4px 10px}

  /* 絞り込みバー。1段目＝概況＋検索（見る）、2段目＝絞り込みの条件（選ぶ）で役割を分け、
     全部を1行に詰め込んで窮屈にならないようにしている。
     入力・プルダウン・ボタン・概況カードの高さを --ctrl-h に統一して段ごとに揃える。 */
  .filterbar{display:flex;flex-direction:column;gap:10px;margin:12px 0 0}
  .filterbar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filterbar input[type=search]{flex:0 1 220px;height:var(--ctrl-h);box-sizing:border-box;
    font:inherit;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:0 12px}
  .filterbar select{height:var(--ctrl-h);box-sizing:border-box;font:inherit;background:var(--card);
    color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 10px;max-width:180px}
  .filterbar .btn{height:var(--ctrl-h);box-sizing:border-box;padding:0 14px;font-size:.82rem}

  /* 自分の済みを折りたたむトグル */
  .fold-toggle{appearance:none;cursor:pointer;font:inherit;font-size:.82rem;font-weight:600;color:var(--ink-soft);
    background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:9px 14px;width:100%;text-align:left;margin-bottom:12px}
  .fold-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .fold-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* 月の区切り。連絡Noは月ごとに1へ戻るため、2か月以上またぐときだけ挟む。
     開閉ボタンではなく細い罫線＋ラベルにして、縦の占有を最小限にしている */
  .month-divider{display:flex;align-items:center;gap:10px;margin:6px 2px 12px;
    font-size:.76rem;font-weight:700;color:var(--ink-faint);white-space:nowrap}
  .month-divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .month-divider:first-child{margin-top:0}

  /* 連絡の月番号バッジ（打合せで「n番」と言うための目印） */
  .no-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;
    padding:0 7px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;
    font-size:.78rem;font-variant-numeric:tabular-nums;flex-shrink:0}

  /* ---- サイドバー共通 ---- */
  .side-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:14px 16px}
  .side-panel h2{font-size:.8rem;font-weight:700;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 10px;
    display:flex;align-items:center;gap:6px}
  .side-panel h2 span{font-weight:700;color:var(--warn)}
  .side-empty{font-size:.82rem;color:var(--ink-faint)}

  /* ---- ミニカレンダー ---- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-nav{appearance:none;border:1px solid var(--line);background:var(--paper);cursor:pointer;
    border-radius:8px;width:26px;height:26px;font-size:1rem;color:var(--ink-soft);line-height:1;padding:0}
  .cal-nav:hover{border-color:var(--accent);color:var(--accent)}
  .cal-nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cal-title{font-size:.9rem;font-weight:700}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
    font-size:.66rem;color:var(--ink-faint);margin-bottom:3px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;border-radius:8px;font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--ink);
    appearance:none;-webkit-appearance:none;border:none;background:none;font-family:inherit;margin:0;width:100%}
  .cal-day.pad{visibility:hidden}
  .cal-day.clickable{cursor:pointer}
  .cal-day.clickable:hover{background:var(--accent-soft)}
  .cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .cal-day.today{background:var(--accent);color:#fff;font-weight:700}
  .cal-dots{display:flex;gap:3px;margin-top:2px;height:6px}
  .cal-dot{width:6px;height:6px;border-radius:999px;flex-shrink:0}
  .cal-dot.green{background:var(--good)}
  .cal-dot.red{background:var(--danger)}
  .cal-day.today .cal-dot.green{background:#fff}
  .cal-day.today .cal-dot.red{background:#ffd9d4}
  .cal-legend{display:flex;gap:14px;align-items:center;font-size:.7rem;color:var(--ink-soft);margin:10px 0 0}
  .cal-legend .dot{display:inline-block;width:7px;height:7px;border-radius:999px;margin-right:4px}
  .cal-legend .dot.green{background:var(--good)}
  .cal-legend .dot.red{background:var(--danger);margin-left:2px}
  /* ホバーで表示するその日の共有カレンダー予定（データが無い日は何も出ない）。
     サイドバーは縦スクロール（overflow-y:auto）を持つため、CSSの仕様上 横方向も
     自動的に「はみ出し禁止」になる。中央揃え固定だと右端・左端の日で見切れるので、
     列の位置（.tip-left/.tip-center/.tip-right、cal-dayに付与）で寄せ方を変える。 */
  .cal-tooltip{position:absolute;z-index:20;bottom:100%;margin-bottom:6px;
    background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 10px;font-size:.72rem;
    line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;
    opacity:0;transition:opacity .15s;width:184px;text-align:left}
  .cal-day.tip-center .cal-tooltip{left:50%;transform:translateX(-50%)}
  .cal-day.tip-left .cal-tooltip{left:0}
  .cal-day.tip-right .cal-tooltip{right:0}
  .cal-day:hover .cal-tooltip,.cal-day:focus-visible .cal-tooltip{opacity:1}

  /* ---- サイドバーの自分の未対応リスト ---- */
  .side-todo-item{display:block;width:100%;appearance:none;background:none;border:none;cursor:pointer;
    text-align:left;font:inherit;padding:8px 4px;border-bottom:1px solid var(--line)}
  .side-todo-item:last-child{border-bottom:none}
  .side-todo-item:hover .side-todo-title{color:var(--accent)}
  .side-todo-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .side-todo-title{display:block;font-size:.85rem;font-weight:600;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-todo-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:.72rem}
  .side-todo-due{font-weight:700;font-variant-numeric:tabular-nums}
  .side-todo-due.today{color:var(--danger)}
  .side-todo-due.near{color:var(--warn)}
  .side-todo-due.far{color:var(--ink-soft)}
  .side-todo-due.none{color:var(--ink-faint);font-weight:400}

  /* ---- ピン留め ---- */
  #side-pin-panel h2 span{color:var(--accent)}
  /* カード内の★（コメントボタンの隣）。留めているときだけ色を付ける */
  .pin-btn{appearance:none;border:none;background:none;font:inherit;cursor:pointer;padding:0;
    font-size:.78rem;color:var(--ink-faint);white-space:nowrap}
  .pin-btn:hover{color:var(--accent)}
  .pin-btn.on{color:var(--accent);font-weight:700}
  .pin-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  /* 絞り込みバーのトグル。押されている間は選択中と分かるよう塗る */
  .btn.pin-filter[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .btn.pin-filter:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* カレンダー・サイドバーからジャンプした先の一時ハイライト */
  @keyframes flash-highlight{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
  .card.flash{animation:flash-highlight 1.8s ease-out}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:14px 20px;margin-bottom:12px;transition:opacity .25s}
  .card.done{opacity:.62}
  /* 重要な連絡。左の太い赤帯＋淡い赤の下地で、ひと目で他と区別できるようにする
     （下地は濃くしすぎると本文が読みにくくなるので、色味だけ乗せる程度に留める） */
  .card.important{border-color:var(--danger);border-left:5px solid var(--danger);
    background:var(--important-soft);padding-left:16px}
  .chip.important{background:var(--danger);color:var(--on-danger)}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .chip{font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 8px;letter-spacing:.03em;white-space:nowrap}
  .chip.kind{background:var(--accent-soft);color:var(--accent)}
  .chip.action{background:var(--warn-soft);color:var(--warn)}
  /* 下地は --line と分けている（--line は境界線用に濃くしたいが、
     その上に文字を乗せるとコントラストが落ちるため） */
  .chip.readonly{background:var(--neutral-soft);color:var(--ink-soft)}
  .chip.due{font-variant-numeric:tabular-nums}
  .chip.due.far{background:var(--good-soft);color:var(--good)}
  .chip.due.near{background:var(--warn-soft);color:var(--warn)}
  .chip.due.today{background:var(--danger-soft);color:var(--danger)}
  .chip.target,.chip.speaker{background:none;border:1px solid var(--line);color:var(--ink-soft);font-weight:500}

  /* 本文（左）と資料（右）の2カラム */
  .card-mid{display:flex;gap:18px;align-items:flex-start}
  .card-text{flex:1;min-width:0}
  /* 資料は常に横一列（3件でも折り返さない）。1件でも同じ小さめの固定サイズ・左詰め */
  .card-media{flex:0 0 auto;align-self:flex-start;
    display:flex;flex-direction:row;flex-wrap:nowrap;align-items:flex-start;justify-content:flex-start;gap:8px}
  .card-media a.thumb{display:block;width:100px;flex:0 0 100px;border:1px solid var(--line);
    border-radius:10px;overflow:hidden;background:var(--paper);text-decoration:none}
  .card-media a.thumb img{display:block;width:100%;height:76px;object-fit:cover}
  .card-media a.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .thumb-label{display:block;text-align:center;font-size:.7rem;font-weight:600;color:var(--ink-soft);
    padding:2px 4px;background:var(--paper);border-top:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-media a.doc{font-size:.82rem;color:var(--accent);text-decoration:none}
  .card-media a.doc:hover{text-decoration:underline}
  .card-media a.doc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:700px){
    /* 狭い画面では資料を本文の下に回し、幅いっぱいに3等分（それでも折り返さない） */
    .card-mid{flex-direction:column}
    .card-media{width:100%}
    .card-media a.thumb{flex:1 1 0;width:auto}
  }

  /* 下線リンク風ボタン（未対応者を見る など） */
  .linklike{appearance:none;border:none;background:none;font:inherit;color:var(--accent);cursor:pointer;
    padding:0;font-size:.78rem;text-decoration:underline;white-space:nowrap}
  .linklike.muted{color:var(--ink-soft)}
  .linklike:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* カード上部の小さな丸ボタン（編集） */
  .icon-btn{appearance:none;cursor:pointer;font:inherit;font-size:.78rem;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px;
    margin-left:auto}
  .icon-btn:hover{color:var(--accent);border-color:var(--accent)}
  .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* コメント */
  .comment-list{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
  .comment-item{font-size:.86rem}
  .comment-item .cmeta{font-size:.72rem;color:var(--ink-faint);margin-bottom:2px}
  .comment-item .ctext{white-space:pre-line;overflow-wrap:anywhere}
  .comment-empty{color:var(--ink-faint);font-size:.85rem}
  #comment-text{min-height:64px}

  /* 未対応者・未確認者一覧 */
  .names-list{list-style:none;margin:0 0 12px;padding:0;max-height:40vh;overflow-y:auto;
    border:1px solid var(--line);border-radius:10px}
  .names-list li{padding:8px 12px;font-size:.86rem;border-bottom:1px solid var(--line)}
  .names-list li:last-child{border-bottom:none}
  .names-empty{color:var(--ink-faint);font-size:.85rem;margin:0 0 12px}

  /* アジェンダ表内の編集・コメントミニツールバー */
  .row-tools{display:flex;gap:10px;margin-top:4px}
  .row-tools button{font-size:.74rem}
  .row-tools .icon-btn{margin-left:0}
  .card h3{margin:2px 0 4px;font-size:1.02rem;line-height:1.45;overflow-wrap:anywhere}
  .card .body{font-size:.88rem;color:var(--ink-soft);margin:0 0 10px;white-space:pre-line;max-width:76ch;overflow-wrap:anywhere}
  .card .meta{font-size:.75rem;color:var(--ink-faint);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .card .meta a{font-size:.82rem;text-decoration:none} .card .meta a:hover{text-decoration:underline}
  .card .meta button.link{appearance:none;border:none;background:none;font:inherit;color:var(--accent);
    cursor:pointer;padding:0;font-size:.8rem;text-decoration:underline}

  .card-foot{display:flex;align-items:center;gap:20px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .progress{flex:1;min-width:0;max-width:420px}
  .progress .bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
  .progress .fill{height:100%;border-radius:999px;background:var(--good);transition:width .3s;width:0}
  .progress .txt{font-size:.72rem;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}
  button.check{appearance:none;font:inherit;cursor:pointer;border-radius:999px;padding:8px 18px;
    border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-weight:700;font-size:.88rem;
    white-space:nowrap;margin-left:auto;transition:background .2s,color .2s}
  button.check:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  button.check.checked{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}
  button.check:disabled{opacity:.5;cursor:progress}
  button.check.ghost{background:none;color:var(--accent)}
  button.check.ghost.checked{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}
  .check-btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .check-btns .check{margin-left:0}

  .meet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 4px}
  select,input,textarea{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  .time-chip{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;border-radius:8px;
    padding:5px 12px;font-variant-numeric:tabular-nums}
  .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  table.agenda{border-collapse:collapse;width:100%;min-width:640px;font-size:.87rem}
  table.agenda th{text-align:left;font-size:.72rem;letter-spacing:.05em;color:var(--ink-faint);padding:10px 14px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  table.agenda td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
  table.agenda tr:last-child td{border-bottom:none}
  table.agenda td.no{color:var(--ink-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  table.agenda td.min{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.agenda td .sub{color:var(--ink-soft);font-size:.8rem;display:block;margin-top:2px}

  .staff-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
  .staff-chips .s{background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600}
  .staff-chips .s.ok{background:var(--good-soft);color:var(--good)}
  button.remind{appearance:none;font:inherit;cursor:pointer;border:1.5px solid var(--accent);background:none;
    color:var(--accent);border-radius:8px;padding:7px 16px;font-weight:700;font-size:.85rem}
  button.remind:hover{background:var(--accent-soft)}
  button.remind:disabled{opacity:.55;cursor:default}
  button.remind:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .empty{color:var(--ink-faint);font-size:.9rem;padding:24px 4px}
  .empty .linklike{margin-left:8px;font-size:.85rem}
  .loading{color:var(--ink-faint);font-size:.9rem;padding:40px 4px;text-align:center}

  .fab{position:fixed;right:24px;bottom:24px;appearance:none;border:none;cursor:pointer;
    background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:.9rem;border-radius:999px;
    padding:13px 22px;box-shadow:0 4px 14px rgba(35,43,51,.25)}
  .fab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);
    color:var(--paper);border-radius:999px;padding:9px 20px;font-size:.85rem;font-weight:600;opacity:0;
    pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .overlay{position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;align-items:flex-start;
    justify-content:center;padding:40px 16px;overflow:auto;z-index:40}
  .overlay.show{display:flex}
  .modal{background:var(--card);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:100%;max-width:560px;padding:22px 24px}
  .modal h2{margin:0 0 16px;font-size:1.05rem}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .field label{font-size:.78rem;font-weight:700;color:var(--ink-soft)}
  .field .row{display:flex;gap:10px;flex-wrap:wrap}
  .field input[type=text],.field textarea,.field select{width:100%}
  .field textarea{min-height:80px;resize:vertical}
  .checkline{display:flex;align-items:center;gap:8px;font-size:.88rem}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .btn{appearance:none;font:inherit;cursor:pointer;border-radius:8px;padding:9px 18px;font-weight:700;font-size:.88rem;border:1.5px solid var(--line);background:none;color:var(--ink-soft)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .form-hint{font-size:.75rem;color:var(--ink-faint);margin:4px 0 0}
  .staff-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 10px;
    max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:4px}
  .staff-pick label{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:400;color:var(--ink)}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app-shell">
  <header class="appbar">
    <div class="appbar-row">
      <h1 class="app-title">職員連絡ボード<small>令和8年度</small></h1>
      <div class="appbar-right">

        <div class="theme-switch" role="group" aria-label="カラーテーマ">
          <button type="button" data-mode="auto" aria-pressed="true">自動</button>
          <button type="button" data-mode="light" aria-pressed="false">ライト</button>

    <nav class="tabs" role="tablist">

    </nav>
  </header>

<div class="app">
  <!-- 絞り込みバーは本文側に置く。タブによって使わない場合も、サイドバーの上端が
       ずれないよう visibility で隠して高さは確保する（display:none にしない） -->
  <div class="filterbar" id="filterbar">
    <div class="filterbar-row">
      <div class="summary" id="board-summary"></div>
      <input type="search" id="filter-kw" placeholder="🔍 キーワードで絞り込み（議題・内容）">
    </div>
    <div class="filterbar-row">
      <select id="filter-status" aria-label="対応状況で絞り込み">
        <option value="undone">未完了のみ</option>
        <option value="all">すべて</option>
        <option value="done">完了のみ</option>
      </select>
      <select id="filter-ym" aria-label="月で絞り込み"><option value="">すべての月</option></select>
      <select id="filter-speaker" aria-label="発信者で絞り込み"><option value="">すべての発信者</option></select>
      <button type="button" class="btn pin-filter" id="filter-pin" aria-pressed="false"
        title="自分がピン留めした連絡だけを表示">★ ピン留めのみ</button>
      <button type="button" class="btn" id="filter-clear">クリア</button>
    </div>
  </div>

  <section class="view active" id="view-board"><div class="loading">読み込み中…</div></section>
  <section class="view" id="view-meeting"></section>
  <section class="view" id="view-admin"></section>
</div>

<aside class="sidebar">
  <!-- ピン留めは絞り込みの影響を受けず常に出す（完了済みをピン留めしても消えないように） -->

    <h2>★ ピン留め <span id="side-pin-count"></span></h2>
    <div id="side-pin-list"></div>
  </div>
  <div class="side-panel cal-panel">
    <div class="cal-head">
      <button type="button" class="cal-nav" id="cal-prev" aria-label="前の月">‹</button>
      <span class="cal-title" id="cal-title"></span>
      <button type="button" class="cal-nav" id="cal-next" aria-label="次の月">›</button>
    </div>
    <div class="cal-weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
    <div class="cal-grid" id="cal-grid"></div>
    <p class="cal-legend"><span class="dot green"></span>追加日<span class="dot red"></span>期限日</p>
  </div>
  <div class="side-panel">
    <h2>自分の未対応 <span id="side-todo-count"></span></h2>
    <div id="side-todo-list"></div>
  </div>
</aside>
</div>

<button class="fab" id="fab">＋ 連絡を追加</button>
<div class="toast" id="toast"></div>

<!-- 初回アクセス時の名前登録 -->

  <form class="modal" id="reg-form">

<!-- 起票フォーム -->
<div class="overlay" id="overlay">
  <form class="modal" id="item-form">
    <h2 id="form-title">連絡を追加</h2>
    <div class="field" id="f-meeting-field">
      <label>会議（任意）</label>
      <select id="f-meeting"></select>

        <div style="flex:1"><label>種別</label>
          <select id="f-nm-kind"><option value="職員会議">職員会議</option><option value="打合せ">打合せ</option></select>

    </div>

        <div id="f-staff" class="staff-pick"></div>

    <div class="field">

        style="align-self:flex-start;padding:5px 12px;font-size:.8rem;margin-top:6px">＋ リンクを追加</button>

      <button type="button" class="btn" id="names-copy">名前をコピー</button>
      <button type="button" class="btn primary" id="names-close">閉じる</button>

<script>
/* ====== 状態 ====== */
var DATA = null;

/* ====== テーマ ====== */
var themeBtns = document.querySelectorAll('.theme-switch button');
function applyTheme(mode){
  if(mode==='auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
  themeBtns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode===mode)); });
  try{ localStorage.setItem('renraku-theme', mode); }catch(e){}
}
themeBtns.forEach(function(b){ b.addEventListener('click', function(){ applyTheme(b.dataset.mode); }); });
(function(){ var s='auto'; try{ s=localStorage.getItem('renraku-theme')||'auto'; }catch(e){} applyTheme(s); })();

/* ====== ユーティリティ ====== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
var toast=document.getElementById('toast'), toastTimer;
function showToast(m){ toast.textContent=m; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toast.classList.remove('show'); },2400); }

/* ====== タブ ====== */
var tabs=document.querySelectorAll('.tab'), views=document.querySelectorAll('.view');
var currentView='board';
function switchView(name){
  currentView=name;
  tabs.forEach(function(t){ t.setAttribute('aria-selected', String(t.dataset.view===name)); });
  views.forEach(function(v){ v.classList.toggle('active', v.id==='view-'+name); });
  // 絞り込みバーは「連絡ボード」でのみ使う。
  // 使わないタブでも高さは保ち（visibility）、右サイドバーの上端がずれないようにする
  document.getElementById('filterbar').style.visibility=(name==='board')?'':'hidden';
  if(name==='board') renderBoard();
  if(name==='meeting') renderMeeting();
  if(name==='admin') renderAdmin();
}
tabs.forEach(function(t){ t.addEventListener('click', function(){ switchView(t.dataset.view); }); });

/* ====== 絞り込み（対応状況・月・発信者・キーワード） ====== */
// 月は初期表示だけ「現在の月」を選んでおく（データが無ければ populateMonthFilter が
// 自動的に「すべての月」へフォールバックする）。クリア操作は他の絞り込みと同様に
// 常に「すべての月」へ戻す（現在の月が0件のとき、クリアが何も変えない事態を避けるため）
var filterYM=currentActualYM(), filterKW='', filterSpeaker='';
var filterStatus='undone'; // undone=未完了のみ（既定） / all=すべて / done=完了のみ
var filterPinned=false;    // ★ピン留めのみ表示するか
// 概況カードの「期限」「未対応」をクリックしたときの一発絞り込み（toggleQuickFilter 参照）
var filterDueOnly=false, filterMineOnly=false;
function fullyDone(it){ return it.targetCount>0 && it.doneCount>=it.targetCount; } // 対象全員が済み
/** 対応状況の絞り込み。ここだけ他の条件と分けているのは、選択肢の件数を数える母集団になるため */
function matchesStatus(it){
  if(filterStatus==='undone') return !fullyDone(it);
  if(filterStatus==='done') return fullyDone(it);
  return true; // all
}
function matchesFilter(it){
  // クイック絞り込み中は他の条件を無視し、その条件だけで決める
  // （toggleQuickFilter が有効化と同時に他の絞り込みを解除しているため、通常は結果は同じだが
  //   念のため明示しておく）
  if(filterDueOnly) return it.action && it.dueClass==='today' && !fullyDone(it);
  if(filterMineOnly) return it.action && it.myTarget && !it.myDone;
  if(filterPinned && !it.pinned) return false;
  if(filterYM && it.ym!==filterYM) return false;
  if(filterSpeaker && (it.speaker||'')!==filterSpeaker) return false;
  if(filterKW){
    var hay=((it.title||'')+' '+(it.body||'')+' '+(it.speaker||'')).toLowerCase();
    if(hay.indexOf(filterKW)<0) return false;
  }
  return true;
}
/**
 * 年月の選択肢を作る（新しい月が上）。
 * pool を渡すと、その配列だけを数える（いま実際に表示されうる件数に合わせるため。
 * 例えば「未完了のみ」表示中は、完了済みを除いた配列を渡す）。
 * pool を省略すると DATA.items 全体を数える。
 */
function populateMonthFilter(pool){
  var sel=document.getElementById('filter-ym');
  var set={};
  (pool||DATA.items).forEach(function(it){ if(it.ym) set[it.ym]=true; });
  var yms=Object.keys(set).sort().reverse();
  sel.innerHTML='<option value="">すべての月</option>'+yms.map(function(ym){
    var parts=ym.split('-');
    return '<option value="'+ym+'">'+parts[0]+'年'+Number(parts[1])+'月</option>';
  }).join('');
  // 状態変数 filterYM を正とする（DOMのvalueではなく）。初期表示で「現在の月」を
  // 選ぶのはこの仕組み経由。現在の月にまだ何も無ければ「すべての月」のままにする
  if(filterYM && yms.indexOf(filterYM)>=0) sel.value=filterYM;
  else if(filterYM) filterYM=''; // 選択していた月が消えた（0件になった）ら解除
}
/** 発信者の選択肢を作る（件数付き・五十音順）。pool の意味は populateMonthFilter と同じ */
function populateSpeakerFilter(pool){
  var sel=document.getElementById('filter-speaker');
  var counts={};
  (pool||DATA.items).forEach(function(it){
    var s=it.speaker||''; if(!s) return;
    counts[s]=(counts[s]||0)+1;
  });
  var names=Object.keys(counts).sort(function(a,b){ return a.localeCompare(b,'ja'); });
  var cur=sel.value;
  sel.innerHTML='<option value="">すべての発信者</option>'+names.map(function(n){
    return '<option value="'+esc(n)+'">'+esc(n)+'（'+counts[n]+'）</option>';
  }).join('');
  // 選択中の発信者が今も存在すれば保持。消えていれば絞り込みも解除する
  if(cur && names.indexOf(cur)>=0) sel.value=cur;
  else if(cur) filterSpeaker='';
}
function onFilterChange(){
  filterStatus=document.getElementById('filter-status').value;
  filterYM=document.getElementById('filter-ym').value;
  filterSpeaker=document.getElementById('filter-speaker').value;
  filterKW=document.getElementById('filter-kw').value.trim().toLowerCase();
  if(currentView==='board') renderBoard();
}
document.getElementById('filter-status').addEventListener('change', onFilterChange);
document.getElementById('filter-ym').addEventListener('change', onFilterChange);
document.getElementById('filter-speaker').addEventListener('change', onFilterChange);
var kwTimer;
document.getElementById('filter-kw').addEventListener('input', function(){
  clearTimeout(kwTimer); kwTimer=setTimeout(onFilterChange, 200); // 入力が落ち着いてから絞り込む
});
/**
 * 絞り込みを解除する（クリアボタン／カレンダー等からのジャンプ時に使う）。
 * @param {string} [status] 解除後の対応状況。省略時は既定の「未完了のみ」に戻す。
 *   ジャンプ先が完了済みの連絡のときは 'all' を渡して見えるようにする。
 */
function clearFilters(status){
  document.getElementById('filter-kw').value='';
  document.getElementById('filter-ym').value='';
  document.getElementById('filter-speaker').value='';
  filterYM=''; filterKW=''; filterSpeaker='';
  filterDueOnly=false; filterMineOnly=false;
  setPinFilter(false);
  filterStatus=status||'undone';
  document.getElementById('filter-status').value=filterStatus;
}
document.getElementById('filter-clear').addEventListener('click', function(){
  clearFilters();
  if(currentView==='board') renderBoard();
});

/**
 * 概況カードの「期限が今日／超過」「あなたの未対応」をクリックしたときの一発絞り込み。
 * 他の絞り込み（検索・月・発信者・ピン留め）と組み合わせると0件になりがちなので、
 * 押すとまず全部解除してから、対応状況を「すべて」に広げてこの条件だけを適用する
 * （この条件自体が「未完了」を含意するので「すべて」にしても実質は未完了だけが残る）。
 * もう一度押すと解除して「掲載中」と同じ全解除状態に戻る。
 */
function toggleQuickFilter(which){
  var turningOn = which==='due' ? !filterDueOnly : !filterMineOnly;
  clearFilters();
  if(turningOn){
    filterStatus='all';
    document.getElementById('filter-status').value='all';
    if(which==='due') filterDueOnly=true; else filterMineOnly=true;
  }
  renderBoard();
}

/** ★ピン留めのみ の ON/OFF（見た目と状態をまとめて切り替える） */
function setPinFilter(on){
  filterPinned=!!on;
  document.getElementById('filter-pin').setAttribute('aria-pressed', String(filterPinned));
}
document.getElementById('filter-pin').addEventListener('click', function(){
  setPinFilter(!filterPinned);
  // ピン留めは完了済みの連絡にも付けられる。既定の「未完了のみ」のままだと
  // 留めたはずの連絡が出てこないので、ONにするときは対応状況を「すべて」に広げる
  if(filterPinned){
    filterStatus='all';
    document.getElementById('filter-status').value='all';
  }
  onFilterChange();
});

// サーバー側の並び順（重要が先、次に要対応、期限が近い順・期限なしは最後）と同じロジック
function itemSortComparator(a,b){
  if(!!a.important!==!!b.important) return a.important?-1:1;
  if(a.action!==b.action) return a.action?-1:1;
  var da=a.dueSort, db=b.dueSort;
  if(da===db) return 0;
  if(da===null) return 1;
  if(db===null) return -1;
  return da-db;
}

/* ====== 初期ロード ====== */
function load(){
  google.script.run.withSuccessHandler(function(d){

    document.getElementById('today').textContent=d.today;

  }).getInitialData();
}

/* ====== 他の職員による更新の反映（自動ポーリング＋手動更新） ====== */
var POLL_INTERVAL_MS=60000;   // 60秒ごとに新着を確認
var pendingSaves=0;           // 自分の保存が進行中の間は上書きしない
var pollTimer=null;

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(pollForUpdates, POLL_INTERVAL_MS);
}

/** フォームや登録画面が開いている間はポーリングで邪魔しない */
function formsAreOpen(){
  return overlay.classList.contains('show') || regOverlay.classList.contains('show');
}

var refreshBtn=document.getElementById('refresh-btn');
function pollForUpdates(manual){
  if(!DATA || pendingSaves>0){
    if(manual) showToast('保存が完了してからもう一度お試しください');
    return;
  }
  if(!manual && document.hidden) return; // タブが背面の間は自動ポーリングを休止（クォータ節約）
  if(!manual && formsAreOpen()) return; // 自動ポーリングのみ入力中は遠慮する
  if(manual) refreshBtn.classList.add('spinning');
  google.script.run.withSuccessHandler(function(d){
    if(manual) refreshBtn.classList.remove('spinning');
    if(!DATA || !d.me.email || !d.me.registered) return; // 想定外の状態は無視
    var added=mergeFreshData(d);
    if(manual) showToast(added>0?added+'件の新しい連絡が届きました':'最新の状態です');
    else if(added>0) showToast(added+'件の新しい連絡が届きました');
  }).withFailureHandler(function(){
    if(manual){ refreshBtn.classList.remove('spinning'); showToast('更新に失敗しました。もう一度お試しください'); }
    // 自動ポーリングの失敗は静かに無視し、次回の周期で再試行する
  }).getInitialData();
}
refreshBtn.addEventListener('click', function(){ pollForUpdates(true); });
// タブを離れて戻ってきたときは、次の周期を待たずにすぐ確認する
document.addEventListener('visibilitychange', function(){ if(!document.hidden) pollForUpdates(false); });

/** サーバーの最新状態をDATAへ反映し、今表示している画面だけを再描画する */
function mergeFreshData(d){
  var oldIds={};
  DATA.items.forEach(function(it){ oldIds[it.id]=true; });
  var added=0;
  d.items.forEach(function(it){ if(!oldIds[it.id]) added++; });

  var keepMeeting=null;
  var pick=document.getElementById('m-pick');
  if(pick) keepMeeting=pick.value;

  DATA.items=d.items;
  DATA.meetings=d.meetings;
  DATA.staffList=d.staffList;
  DATA.today=d.today;
  document.getElementById('today').textContent=d.today;

  if(currentView==='board') renderBoard();
  else if(currentView==='admin') renderAdmin();
  else if(currentView==='meeting') renderMeeting(keepMeeting);
  refreshMineCounters(); // renderSideTodo() / renderSidePins() もここで実行される
  renderCalendar();
  return added;
}

/* ====== 連絡ボード ====== */
function myOpenItems(){
  return DATA.items.filter(function(it){ return it.action && it.myTarget && !it.myDone; });
}
/**
 * 連絡を1本の連続リストとしてコンテナに描画する。
 * 並び順は 重要 → 要対応 → 期限が近い順（itemSortComparator。サーバー側と同じ）。
 * 未対応（自分がまだ）を上に、自分が済ませたものは末尾に折りたたむ。
 *
 * 月ごとの見出しは、表示中の連絡が2か月以上にまたがるときだけ細い区切りとして挟む。
 * 連絡No.は月ごとに1へリセットされるため、月をまたいで並べると「何月の5番か」が
 * 分からなくなる。1か月しか出ていないときは曖昧さが無いので区切りも出さない。
 */
function renderList(container, items){
  var multiMonth=false, seen={};
  items.forEach(function(it){ seen[it.ym||'']=true; });
  multiMonth=Object.keys(seen).length>1;

  var lastYm=null;
  function put(it){
    if(multiMonth && (it.ym||'')!==lastYm){
      lastYm=it.ym||'';
      container.appendChild(el('<div class="month-divider"><span>'+esc(ymLabel(it.ym))+'</span></div>'));
    }
    container.appendChild(cardEl(it));
  }

  // 折りたたみは「未完了のみ」表示のときだけ。完了を含む表示では、自分の済みを畳むと
  // ほぼ全件が隠れて空に見えてしまうため、そのまま並べる
  if(filterStatus!=='undone'){ items.forEach(put); return; }

  var open=items.filter(function(it){ return !it.myDone; });
  var mineDone=items.filter(function(it){ return it.myDone; });
  open.forEach(put);
  if(mineDone.length){
    var toggle=el('<button type="button" class="fold-toggle">'
      +(foldDoneOpen?'▼ 自分が済ませた連絡（'+mineDone.length+'件）を隠す':'▶ 自分が済ませた連絡（'+mineDone.length+'件）を表示')
      +'</button>');
    toggle.addEventListener('click', function(){ foldDoneOpen=!foldDoneOpen; renderBoard(); });
    container.appendChild(toggle);
    if(foldDoneOpen){ lastYm=null; mineDone.forEach(put); }
  }
}

var foldDoneOpen=false; // 「自分が済ませた連絡」の折りたたみを開いているか

function currentActualYM(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function ymLabel(ym){
  if(!ym) return '日付不明';
  var p=ym.split('-');
  return p[0]+'年'+Number(p[1])+'月';
}
function isoDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ====== サイドバー: ミニカレンダー ====== */
var calViewYM=currentActualYM();          // 現在表示中の月
var calEventsCache={};                    // ym -> {dateISO:[{title,time,allDay}]}（共有カレンダーの取得結果）

function calAddMonths(ym, delta){
  var p=ym.split('-'); var y=Number(p[0]), m=Number(p[1])+delta;
  while(m<1){ m+=12; y--; } while(m>12){ m-=12; y++; }
  return y+'-'+String(m).padStart(2,'0');
}

/** カレンダーの再描画（ドットはDATA.itemsから即座に算出。予定ホバーはキャッシュがあれば併せて表示） */
function renderCalendar(){
  if(!DATA) return;
  document.getElementById('cal-title').textContent=ymLabel(calViewYM);
  var p=calViewYM.split('-'); var year=Number(p[0]), month=Number(p[1]);
  var startDow=new Date(year, month-1, 1).getDay(); // 0=日曜
  var daysInMonth=new Date(year, month, 0).getDate();
  var todayISO=isoDate(new Date());

  var addSet={}, dueSet={};
  DATA.items.forEach(function(it){
    if(it.dateISO && it.dateISO.slice(0,7)===calViewYM) addSet[it.dateISO]=true;
    if(it.dueISO && it.dueISO.slice(0,7)===calViewYM) dueSet[it.dueISO]=true;
  });
  var evByDate=calEventsCache[calViewYM]||{};

  var html='';
  for(var i=0;i<startDow;i++) html+='<div class="cal-day pad"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var dateISO=calViewYM+'-'+String(d).padStart(2,'0');
    var hasAdd=!!addSet[dateISO], hasDue=!!dueSet[dateISO];
    var events=evByDate[dateISO]||[];
    // ドットは状態を示す印。操作対象はマス目そのもの（6pxのドットは狙いにくく、
    // ボタンを入れ子にできないため。押すとその日に関わる連絡へまとめて移動する）
    var dots='';
    if(hasAdd) dots+='<span class="cal-dot green"></span>';
    if(hasDue) dots+='<span class="cal-dot red"></span>';
    var tooltip='';
    if(events.length){
      tooltip='<span class="cal-tooltip">'+events.map(function(e){
        return esc((e.allDay?'終日':e.time)+' '+e.title);
      }).join('<br>')+'</span>';
    }
    // 列の位置でツールチップの寄せ方を変える（右端/左端の日でサイドバー外にはみ出て
    // 切れないように）。日曜(0)・月曜(1)は左揃え、金曜(5)・土曜(6)は右揃え、それ以外は中央
    var dow=(startDow+d-1)%7;
    var tipCls=dow<=1 ? 'tip-left' : (dow>=5 ? 'tip-right' : 'tip-center');
    var clickable=hasAdd||hasDue;
    // 読み上げ・ホバー用の説明文
    var label=Number(calViewYM.split('-')[1])+'月'+d+'日';
    var parts=[];
    if(hasAdd) parts.push('追加された連絡あり');
    if(hasDue) parts.push('期限の連絡あり');
    if(events.length) parts.push('予定'+events.length+'件');
    var titleAttr=label+(parts.length?'：'+parts.join('・'):'');

    // キーボードでも辿れるよう、日付は button にする（クリックできない日は div のまま）
    if(clickable){
      html+='<button type="button" class="cal-day '+tipCls+(dateISO===todayISO?' today':'')+' clickable"'
        +' data-date="'+dateISO+'" title="'+esc(titleAttr)+'" aria-label="'+esc(titleAttr+' の連絡を見る')+'">';
    }else{
      html+='<div class="cal-day '+tipCls+(dateISO===todayISO?' today':'')+'"'
        +(events.length?' tabindex="0"':'')+' title="'+esc(titleAttr)+'">';
    }
    html+='<span class="cal-num">'+d+'</span>'
      +'<span class="cal-dots">'+dots+'</span>'
      +tooltip
      +(clickable?'</button>':'</div>');
  }
  var grid=document.getElementById('cal-grid');
  grid.innerHTML=html;

  grid.querySelectorAll('.cal-day.clickable').forEach(function(dayEl){
    dayEl.addEventListener('click', function(){ jumpToDate(dayEl.dataset.date); });
  });
}

/** 表示月を切り替え、必要なら共有カレンダーの予定を取得する（月ごとに1回だけ） */
function loadCalendarMonth(){
  renderCalendar(); // ドットは即座に出す
  var requestedYM=calViewYM;
  if(calEventsCache[requestedYM]) return; // 取得済み
  google.script.run.withSuccessHandler(function(byDate){
    calEventsCache[requestedYM]=byDate||{};
    if(calViewYM===requestedYM) renderCalendar(); // 取得中に月を切り替えていなければ反映
  }).withFailureHandler(function(){
    calEventsCache[requestedYM]={}; // 失敗（未共有・IDミス等）はホバー予定が出ないだけにする
  }).getCalendarEventsForMonth(requestedYM);
}
document.getElementById('cal-prev').addEventListener('click', function(){ calViewYM=calAddMonths(calViewYM,-1); loadCalendarMonth(); });
document.getElementById('cal-next').addEventListener('click', function(){ calViewYM=calAddMonths(calViewYM,1); loadCalendarMonth(); });

/**
 * カレンダーの日付マス（ボタン）から、該当する連絡までジャンプする。
 * その日に「追加された」連絡と「期限」の連絡の両方をまとめて対象にする
 * （マス目そのものが唯一の操作対象で、緑・赤ドットは状態を示す印にすぎないため）。
 * 絞り込みは解除し、必要なら月セクション・自分の済みの折りたたみを開いてスクロール＋一瞬ハイライト。
 * 対象がすべて完了済みなら、対応状況フィルタを「すべて」に切り替えて見えるようにする。
 * @param {string} dateISO
 */
function jumpToDate(dateISO){
  var matches=DATA.items.filter(function(it){
    return it.dateISO===dateISO || it.dueISO===dateISO;
  });
  if(!matches.length){ showToast('この日の連絡は見つかりませんでした'); return; }

  // 未完了があればそれを優先。すべて完了済みなら状態フィルタを「すべて」にして見せる
  var openMatches=matches.filter(function(it){ return !fullyDone(it); });
  var target=openMatches.length?openMatches[0]:matches[0];
  clearFilters(openMatches.length?'undone':'all');

  // 自分が済ませた連絡は末尾に畳まれているので、飛び先がそれなら開いておく
  if(target.myDone) foldDoneOpen=true;
  switchView('board');
  setTimeout(function(){
    var card=document.querySelector('[data-item-id="'+target.id+'"]');
    if(!card) return;
    card.scrollIntoView({behavior:'smooth', block:'center'});
    card.classList.add('flash');
    setTimeout(function(){ card.classList.remove('flash'); }, 1800);
  }, 60);
}

/** サイドバー下部：自分が対象で未対応の連絡を、期限が近い順に表示 */
function renderSideTodo(){
  if(!DATA) return;
  var list=myOpenItems().slice().sort(function(a,b){
    if(a.dueSort===b.dueSort) return 0;
    if(a.dueSort===null) return 1;
    if(b.dueSort===null) return -1;
    return a.dueSort-b.dueSort;
  });
  document.getElementById('side-todo-count').textContent=list.length?'('+list.length+')':'';
  var box=document.getElementById('side-todo-list');
  if(!list.length){ box.innerHTML='<p class="side-empty">未対応の連絡はありません。お疲れさまです。</p>'; return; }
  box.innerHTML='';
  list.forEach(function(it){
    var dueText=it.dueLabel ? it.dueLabel : '期限なし';
    var dueCls=it.dueLabel ? it.dueClass : 'none';
    var btn=el('<button type="button" class="side-todo-item">'
      +'<span class="side-todo-title">'+(it.monthNo?'No.'+esc(it.monthNo)+' ':'')+esc(it.title)+'</span>'
      +'<span class="side-todo-meta"><span class="side-todo-due '+dueCls+'">'+esc(dueText)+'</span></span>'
      +'</button>');
    btn.addEventListener('click', function(){ jumpToItem(it.id); });
    box.appendChild(btn);
  });
}

/**
 * サイドバーのピン留めリスト。絞り込みとは無関係に、常に自分のピン全件を出す
 * （完了済みをピン留めしたときに「未完了のみ」表示で消えてしまわないように）。
 * ピンが1件も無いときはパネルごと隠す（使っていない人の邪魔をしない）。
 */
function renderSidePins(){
  if(!DATA) return;
  var list=DATA.items.filter(function(it){ return it.pinned; });
  var panel=document.getElementById('side-pin-panel');
  panel.hidden=!list.length;
  if(!list.length) return;
  document.getElementById('side-pin-count').textContent='('+list.length+')';
  var box=document.getElementById('side-pin-list');
  box.innerHTML='';
  list.forEach(function(it){
    var btn=el('<button type="button" class="side-todo-item">'
      +'<span class="side-todo-title">'+(it.monthNo?'No.'+esc(it.monthNo)+' ':'')+esc(it.title)+'</span>'
      +'<span class="side-todo-meta"><span class="side-todo-due '+(it.dueLabel?it.dueClass:'none')+'">'
      +esc(it.dueLabel||'期限なし')+'</span></span>'
      +'</button>');
    btn.addEventListener('click', function(){ jumpToItem(it.id); });
    box.appendChild(btn);
  });
}

/** 特定の連絡IDへジャンプ（サイドバーの自分の未対応・ピン留めリストから使用） */
function jumpToItem(itemId){
  var it=DATA.items.find(function(x){ return x.id===itemId; });
  if(!it){ showToast('連絡が見つかりませんでした'); return; }
  // 完了済みの連絡は「未完了のみ」表示では見えないので、状態フィルタを「すべて」にする
  clearFilters(fullyDone(it)?'all':'undone');
  // 自分が済ませた連絡は末尾に畳まれているので、飛び先がそれなら開いておく
  if(it.myDone) foldDoneOpen=true;
  switchView('board');
  setTimeout(function(){
    var card=document.querySelector('[data-item-id="'+itemId+'"]');
    if(!card) return;
    card.scrollIntoView({behavior:'smooth', block:'center'});
    card.classList.add('flash');
    setTimeout(function(){ card.classList.remove('flash'); }, 1800);
  }, 60);
}

/**
 * 「連絡ボード」タブ：連絡を月ごとに区切って表示する。
 * 対応状況（未完了のみ／すべて／完了のみ）はプルダウンで切り替える。既定は未完了のみ。
 * 月・発信者のプルダウンの件数は、いま表示されうる母集団だけで数える
 * （そうしないと「発信者（n）」のnが表示対象外まで含み、選んでも0件になってしまう）。
 */
function renderBoard(){
  var v=document.getElementById('view-board');
  var pool=DATA.items.filter(matchesStatus);
  populateMonthFilter(pool);
  populateSpeakerFilter(pool);
  var board=pool.filter(matchesFilter);
  var mine=myOpenItems().length;
  updateBadge(mine);

  // 上部の3つの数字は、キーワード・月・発信者・対応状況の絞り込みに影響されない
  // 「盤面全体の概況」として固定で数える。検索するたびにここが動くと、
  // 何を数えているのか分かりにくくなるため（以前は期限の件数だけ絞り込み後の値を使っていた）
  var dueToday=DATA.items.filter(function(it){ return it.action && it.dueClass==='today' && !fullyDone(it); }).length;

  // 概況は1枚のカードに統合し、各区画をクリックで絞り込めるようにする（toggleQuickFilter）。
  // 「掲載中」は絞り込みの全解除、「期限」「未対応」はその条件だけへの一発絞り込み。
  var boardSummary=document.getElementById('board-summary');
  boardSummary.innerHTML=
      '<button type="button" class="stat-seg" id="stat-all" title="絞り込みをすべて解除して見る">'
        +'<b>'+DATA.items.length+'</b><i>掲載中</i></button>'
    +'<button type="button" class="stat-seg alert" id="stat-due" aria-pressed="'+filterDueOnly+'"'
        +' title="期限が今日または超過していて未対応の連絡だけを表示">'
        +'<b>'+dueToday+'</b><i>期限が今日／超過</i></button>'
    +'<button type="button" class="stat-seg warn" id="stat-mine-seg" aria-pressed="'+filterMineOnly+'"'
        +' title="自分が対象で未対応の連絡だけを表示">'
        +'<b id="stat-mine">'+mine+'</b><i>あなたの未対応</i></button>';
  document.getElementById('stat-all').addEventListener('click', function(){ clearFilters(); renderBoard(); });
  document.getElementById('stat-due').addEventListener('click', function(){ toggleQuickFilter('due'); });
  document.getElementById('stat-mine-seg').addEventListener('click', function(){ toggleQuickFilter('mine'); });

  if(!board.length){
    // 絞り込み（検索・月・発信者・対応状況のいずれか）が働いているときだけ解除の導線を出す
    var narrowed = filtering() || filterStatus!=='undone';
    var html= narrowed
      ? '<div class="empty">条件に合う連絡はありません。<button type="button" class="linklike" id="empty-clear">絞り込みを解除する</button></div>'
      : '<div class="empty">表示できる連絡はありません。</div>';
    v.innerHTML=html;
    var clearBtn=document.getElementById('empty-clear');
    if(clearBtn) clearBtn.addEventListener('click', function(){ clearFilters(); renderBoard(); });
    return;
  }
  // 月が新しい順にまとめてから、月の中を 重要→要対応→期限順 に並べる。
  // 月をまたいで通し番号がリセットされるので、月が飛び飛びになると
  // 区切りが何度も現れて逆に読みにくくなる（日付不明の '' は末尾）
  board=board.slice().sort(function(a,b){
    var ya=a.ym||'', yb=b.ym||'';
    if(ya!==yb) return ya<yb?1:-1;
    return itemSortComparator(a,b);
  });

  v.innerHTML='<div id="board-list"></div>';
  renderList(v.querySelector('#board-list'), board);
}

/** 状態以外の絞り込み（キーワード・月・発信者）が効いているか */
function filtering(){ return !!(filterYM||filterKW||filterSpeaker||filterPinned||filterDueOnly||filterMineOnly); }

/** DriveのURLからファイルIDを取り出す（Drive以外は null） */
function driveFileId(u){
  var m=u.match(/\/file\/d\/([-\w]{20,})/) || u.match(/[?&]id=([-\w]{20,})/) || u.match(/\/d\/([-\w]{20,})/);
  return m?m[1]:null;
}

/** 資料リンク群を右カラム用HTMLに。Driveや画像URLはサムネイル、それ以外はテキストリンク */
var CIRCLED=['①','②','③'];
function mediaHTML(links){
  return links.map(function(u,i){
    var name='資料'+(CIRCLED[i]||(i+1));
    var id=driveFileId(u);
    var thumb=id ? 'https://drive.google.com/thumbnail?id='+id+'&sz=w400'
                 : (/\.(png|jpe?g|gif|webp)([?#]|$)/i.test(u) ? u : null);
    if(thumb){
      return '<a class="thumb" href="'+esc(u)+'" target="_blank" rel="noopener" title="'+esc(name)+'を開く">'
        +'<img src="'+esc(thumb)+'" alt="'+esc(name)+'" loading="lazy">'
        +'<span class="thumb-label">'+esc(name)+'</span></a>';
    }
    return '<a class="doc" href="'+esc(u)+'" target="_blank" rel="noopener">📄 '+esc(name)+'</a>';
  }).join('');
}

/** サムネイルを読み込めない場合（権限なし等）は通常のリンク表示に切り替える */
function attachThumbFallback(root){
  root.querySelectorAll('.card-media img').forEach(function(img){
    img.addEventListener('error', function(){
      var a=img.closest('a'); if(!a) return;
      var name=img.alt||'資料', href=a.href;
      var doc=document.createElement('a');
      doc.className='doc'; doc.href=href; doc.target='_blank'; doc.rel='noopener';
      doc.textContent='📄 '+name;
      a.replaceWith(doc);
    });
  });
}

function commentLabel(n){ return n>0 ? '💬 コメント（'+n+'）' : '💬 コメントする'; }

/** カードの★ボタン。ピンは自分だけの目印なので、他の職員の画面には影響しない */
function pinBtnHtml(it){
  return '<button type="button" class="pin-btn'+(it.pinned?' on':'')+'" data-pin-btn="'+esc(it.id)+'"'
    +' aria-pressed="'+(it.pinned?'true':'false')+'"'
    +' title="'+(it.pinned?'ピン留めを外す':'自分の目印としてピン留めする（自分だけに見えます）')+'">'
    +(it.pinned?'★ ピン留め中':'☆ ピン留め')+'</button>';
}

/**
 * ピンの ON/OFF。チェックと同じくその場で反映し、保存は裏で行う（失敗したら戻す）。
 * ピンは集計に関係しないので、失敗しても他の職員には影響しない。
 */
function togglePin(it){
  var next=!it.pinned;
  it.pinned=next;
  refreshPinUI(it);
  pendingSaves++;
  google.script.run.withSuccessHandler(function(){
    pendingSaves--;
  }).withFailureHandler(function(err){
    pendingSaves--;
    it.pinned=!next; // 元に戻す
    refreshPinUI(it);
    showToast('ピンを保存できませんでした（'+err.message+'）');
  }).togglePin(it.id, next);
}

/** 同じ連絡の★ボタン（カード・アジェンダ表）とサイドバーをまとめて更新する */
function refreshPinUI(it){
  document.querySelectorAll('[data-pin-btn="'+it.id+'"]').forEach(function(btn){
    btn.classList.toggle('on', it.pinned);
    btn.setAttribute('aria-pressed', it.pinned?'true':'false');
    btn.textContent=it.pinned?'★ ピン留め中':'☆ ピン留め';
    btn.title=it.pinned?'ピン留めを外す':'自分の目印としてピン留めする（自分だけに見えます）';
  });
  renderSidePins();
}

function cardEl(it){
  var chips=it.monthNo ? '<span class="no-badge" title="打合せで「'+esc(it.monthNo)+'番」と言えば伝わります">No.'+esc(it.monthNo)+'</span>' : '';
  if(it.important) chips+='<span class="chip important">⚠️ 重要</span>';
  chips+=it.meetingLabel ? '<span class="chip kind">'+esc(it.meetingLabel)+'</span>' : '<span class="chip kind">連絡</span>';
  chips+= it.action

    : '<span class="chip readonly" title="対象者は内容を確認したらチェックするだけです">閲覧のみ</span>';
  if(it.dueLabel) chips+='<span class="chip due '+it.dueClass+'">期限 '+esc(it.dueLabel)+'</span>';
  chips+='<span class="chip target">対象: '+esc(it.targetType)+'</span>';

  if(it.canEdit) chips+='<button type="button" class="icon-btn" data-edit>✏️ 編集</button>';

  // ボタン: 要対応は「確認した」＋「対応済みにする」の2段階、閲覧のみは「確認」のみ
  var buttons='';
  if(it.action){
    buttons+='<button class="check ghost'+(it.myAck?' checked':'')+'" data-type="確認">'+(it.myAck?'✓ 確認済み':'確認した')+'</button>';
    buttons+='<button class="check'+(it.myDone?' checked':'')+'" data-type="対応">'+(it.myDone?'✓ 対応済み':'対応済みにする')+'</button>';
  }else{
    buttons+='<button class="check'+(it.myDone?' checked':'')+'" data-type="確認">'+(it.myDone?'✓ 確認済み':'確認する')+'</button>';
  }

  var media=mediaHTML(it.links||[]);

  var card=el(
    '<div class="card'+(it.myDone?' done':'')+(it.important?' important':'')+'" data-item-id="'+esc(it.id)+'">'
    +'<div class="card-top">'+chips+'</div>'
    +'<div class="card-mid">'
      +'<div class="card-text">'
        +'<h3>'+esc(it.title)+'</h3>'
        +(it.body?'<p class="body">'+esc(it.body)+'</p>':'')
      +'</div>'
      +(media?'<div class="card-media">'+media+'</div>':'')
    +'</div>'
    +'<div class="card-foot">'
      +'<div class="progress"><div class="bar"><div class="fill" style="width:'+pctOf(it)+'%"></div></div>'
        +'<div class="txt">'+progressText(it)+'</div></div>'
      +'<button class="linklike" data-names>'+(it.action?'未対応者を見る':'未確認者を見る')+'</button>'
      +'<button class="linklike muted" data-comment-btn="'+esc(it.id)+'">'+commentLabel(it.commentCount||0)+'</button>'
      +pinBtnHtml(it)
      +'<div class="check-btns">'+buttons+'</div>'
    +'</div></div>');

  attachThumbFallback(card);
  card.querySelectorAll('button.check').forEach(function(btn){

    btn.addEventListener('click', function(){ doCheck(it, card, btn, btn.dataset.type); });
  });
  card.querySelector('[data-names]').addEventListener('click', function(){ showNames(it); });
  card.querySelector('[data-comment-btn]').addEventListener('click', function(){ openComments(it.id, it.title); });
  card.querySelector('[data-pin-btn]').addEventListener('click', function(){ togglePin(it); });
  var editBtn=card.querySelector('[data-edit]');
  if(editBtn) editBtn.addEventListener('click', function(){ openEditForm(it); });

// メイン進捗（要対応=対応済み率 / 閲覧のみ=確認率）
function pctOf(it){ return it.targetCount?Math.round(it.doneCount/it.targetCount*100):0; }
function progressText(it){
  var pct=pctOf(it);
  if(it.action){
    return '対応 '+it.doneCount+'/'+it.targetCount+'名（'+pct+'%）・確認 '+(it.ackCount||0)+'/'+it.targetCount+'名';
  }
  return '確認 '+it.doneCount+'/'+it.targetCount+'名（'+pct+'%）';
}

/* チェック状態をデータに反映（人数・自分の状態・未対応者名を更新） */
function setCheckState(it, isAckBtn, next){
  if(isAckBtn){
    it.myAck=next;
    it.ackCount=(it.ackCount||0)+(next?1:-1);
  }else{
    it.myDone=next;
    it.doneCount+=(next?1:-1);
    if(!it.action) it.myAck=next;                    // 閲覧のみは確認＝メイン
    var n=DATA.me.name;                              // 未対応者リストの自分の名前を更新
    it.uncheckedNames=it.uncheckedNames||[];
    if(next) it.uncheckedNames=it.uncheckedNames.filter(function(x){return x!==n;});
    else if(it.uncheckedNames.indexOf(n)<0) it.uncheckedNames.push(n);
  }
  it.doneCount=Math.max(0,Math.min(it.doneCount,it.targetCount));
  it.ackCount=Math.max(0,Math.min(it.ackCount||0,it.targetCount));
}

/* カードの見た目を it の状態に合わせて更新 */
function updateCardUI(it, card){
  card.classList.toggle('done', it.myDone);          // 薄くなるのは対応済み（閲覧のみは確認済み）のとき
  var ack=card.querySelector('.check.ghost');
  if(ack){ ack.classList.toggle('checked', it.myAck); ack.textContent=it.myAck?'✓ 確認済み':'確認した'; }
  var main=card.querySelector('.check:not(.ghost)');
  if(main){
    main.classList.toggle('checked', it.myDone);
    main.textContent=it.myDone?('✓ '+(it.action?'対応':'確認')+'済み'):(it.action?'対応済みにする':'確認する');
  }
  var fill=card.querySelector('.fill'); if(fill) fill.style.width=pctOf(it)+'%';
  var txt=card.querySelector('.progress .txt'); if(txt) txt.textContent=progressText(it);
}

function refreshMineCounters(){
  var n=myOpenItems().length;
  updateBadge(n);
  var sm=document.getElementById('stat-mine'); if(sm) sm.textContent=n;
  renderSideTodo();
  renderSidePins(); // ピンの期限表示も一緒に更新する
}

/*
 * チェックの記録。押した瞬間に画面へ反映し、保存はバックグラウンドで行う。
 * ボタンは無効化しないので、続けて他の連絡をチェックできる。
 * 保存に失敗したときだけ元に戻してお知らせする。
 */
function doCheck(it, card, btn, type){
  var isAckBtn=(type==='確認'&&it.action);           // 要対応カードの「確認した」ボタンか
  var next=!(isAckBtn?it.myAck:it.myDone);
  setCheckState(it, isAckBtn, next);
  updateCardUI(it, card);
  refreshMineCounters();
  showToast(next?'記録しました':'取り消しました');
  pendingSaves++; // 保存が終わるまで自動ポーリングでの上書きを止める
  google.script.run.withSuccessHandler(function(){
    pendingSaves--;
  }).withFailureHandler(function(err){
    pendingSaves--;
    setCheckState(it, isAckBtn, !next);              // 失敗したら巻き戻す
    updateCardUI(it, card);
    refreshMineCounters();
    showToast('保存できませんでした。もう一度お試しください（'+err.message+'）');
  }).recordCheck(it.id, next, type);
}

function updateBadge(n){

}

/* ====== 会議ビュー ====== */
function populateMeetingSelect(){
  var opts='<option value="">会議に紐づけない（連絡ボードに表示）</option>';
  opts+=DATA.meetings.map(function(m){ return '<option value="'+esc(m.id)+'">'+esc(m.label)+'</option>'; }).join('');

/** @param {string} [keepId] 指定があれば、その会議がまだ存在する限り選択を維持する */
function renderMeeting(keepId){
  var v=document.getElementById('view-meeting');
  if(!DATA.meetings.length){ v.innerHTML='<div class="empty">会議がまだ登録されていません。</div>'; return; }

    +'<select id="m-pick">'+DATA.meetings.map(function(m){return '<option value="'+esc(m.id)+'">'+esc(m.label)+'</option>';}).join('')+'</select>'

function loadAgenda(id){
  google.script.run.withSuccessHandler(function(a){
    document.getElementById('m-total').textContent='合計 '+a.totalMinutes+'分';
    var mb=document.getElementById('m-body');
    mb.innerHTML=agendaTable('協議事項', a.giron, true)+agendaTable('連絡事項', a.renraku, false);
    wireAgendaRows(mb, a.giron.concat(a.renraku));
  }).withFailureHandler(function(err){
    document.getElementById('m-body').innerHTML='<div class="empty">'+esc(err.message)+'</div>';
  }).getMeetingAgenda(id);

function agendaTable(label, rows, showMaterial){
  var head='<h2 class="section-label">'+label+'</h2>';
  if(!rows.length) return head+'<div class="empty">項目はありません。</div>';
  var lastCol=showMaterial?'資料':'期限';
  var body=rows.map(function(it){
    var links=it.links||[];
    var last=showMaterial
      ? (links.length?links.map(function(u,i){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">📄'+(links.length>1?(CIRCLED[i]||(i+1)):'')+'</a>';}).join(' '):'—')
      : (it.due||'—');
    var tools='<div class="row-tools">';
    if(it.canEdit) tools+='<button type="button" class="icon-btn" data-edit-id="'+esc(it.id)+'">✏️ 編集</button>';
    tools+='<button type="button" class="linklike muted" data-comment-btn="'+esc(it.id)+'">'+commentLabel(it.commentCount||0)+'</button>';
    tools+='</div>';
    return '<tr><td class="no">'+esc(it.no)+'</td>'
      +'<td>'+esc(it.title)+(it.body?'<span class="sub">'+esc(it.body)+'</span>':'')+tools+'</td>'
      +'<td>'+esc(it.speaker)+'</td><td class="min">'+esc(it.minutes||'—')+'</td><td>'+last+'</td></tr>';
  }).join('');
  return head+'<div class="tablewrap"><table class="agenda"><thead><tr><th>No.</th><th>議題</th>'
    +'<th>発言者</th><th>分</th><th>'+lastCol+'</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
/** アジェンダ表は文字列組み立てなので、挿入後にIDでイベントを配線する */
function wireAgendaRows(root, items){
  var byId={}; items.forEach(function(it){ byId[it.id]=it; });
  root.querySelectorAll('[data-edit-id]').forEach(function(btn){
    var it=byId[btn.dataset.editId];
    if(it) btn.addEventListener('click', function(){ openEditForm(it); });

    var it=byId[btn.dataset.commentBtn];
    if(it) btn.addEventListener('click', function(){ openComments(it.id, it.title); });
  });
}

/* ====== 確認状況（自分が発信した連絡の回収状況） ====== */
function renderAdmin(){
  var v=document.getElementById('view-admin');
  // 自分が発信した「要対応」の連絡だけを対象にする（期限が近い順、期限なしは末尾）
  var sent=DATA.items.filter(function(it){ return it.action && it.isMine; }).sort(function(a,b){
    if(a.dueSort===b.dueSort) return 0;
    if(a.dueSort===null) return 1;
    if(b.dueSort===null) return -1;
    return a.dueSort-b.dueSort;
  });
  var html='<h2 class="section-label">あなたが発信した要対応の連絡（'+sent.length+'件）</h2>'
    +'<p style="font-size:.85rem;color:var(--ink-soft);margin:0 4px 12px">'
    +'自分が出した連絡を、誰がまだ対応していないかを確認できます。'
    +'全体の連絡を見たいときは「連絡ボード」で対応状況を「すべて」に切り替えてください。</p>';
  if(!sent.length){
    html+='<div class="empty">あなたが発信した要対応の連絡はありません。</div>';
    v.innerHTML=html; return;
  }
  html+='<div style="margin:0 4px 16px">'
    +'<button type="button" class="remind" id="remind-btn">📧 未対応者へ督促メールを送る</button>'
    +'<span style="margin-left:10px;font-size:.78rem;color:var(--ink-faint)">'
    +'期限当日〜超過で未対応の相手にだけ届きます</span></div>';
  v.innerHTML=html;
  var remindBtn=document.getElementById('remind-btn');
  var remindLabel=remindBtn.textContent;
  remindBtn.addEventListener('click', function(){
    remindBtn.disabled=true; remindBtn.textContent='送信中…';
    google.script.run.withSuccessHandler(function(res){
      remindBtn.disabled=false; remindBtn.textContent=remindLabel;
      showToast(res.staffCount
        ? res.itemCount+'件の連絡について、'+res.staffCount+'名へ督促メールを送りました'
        : '期限当日〜超過で未対応の相手はいませんでした');
    }).withFailureHandler(function(err){
      remindBtn.disabled=false; remindBtn.textContent=remindLabel;
      showToast('送信に失敗しました：'+err.message);
    }).sendRemindersMine();
  });
  sent.forEach(function(it){
    var pct=it.targetCount?Math.round(it.doneCount/it.targetCount*100):0;
    var chips=(it.uncheckedNames||[]).map(function(n){ return '<span class="s">'+esc(n)+'</span>'; }).join('');
    if(!chips) chips='<span class="s ok">全員対応済み 🎉</span>';
    var c=el('<div class="card"><div class="card-top">'
      +(it.monthNo?'<span class="no-badge">No.'+esc(it.monthNo)+'</span>':'')
      +(it.dueLabel?'<span class="chip due '+it.dueClass+'">期限 '+esc(it.dueLabel)+'</span>':'')
      +'<span class="chip target">対象: '+esc(it.targetType)+'</span></div>'
      +'<h3>'+esc(it.title)+'</h3>'
      +'<div class="progress" style="margin-top:8px;max-width:none"><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>'
      +'<div class="txt">対応 '+it.doneCount+'/'+it.targetCount+'名（'+pct+'%）・確認 '+(it.ackCount||0)+'/'+it.targetCount+'名</div></div>'
      +'<h2 class="section-label" style="margin:14px 0 0">未対応（'+(it.uncheckedNames||[]).length+'名）</h2>'
      +'<div class="staff-chips">'+chips+'</div></div>');
    v.appendChild(c);
  });
}

/* ====== 起票フォーム（新規追加／編集の共通モーダル） ====== */
var overlay=document.getElementById('overlay'), form=document.getElementById('item-form');
var linksBox=document.getElementById('f-links');
var editingId=null; // null=新規追加モード／連絡IDが入っていれば編集モード

// 資料リンク欄を1つ追加（最大3件）。value を渡すと初期値を入れる（編集時の再現用）
function addLinkField(value){
  if(linksBox.querySelectorAll('input').length>=3) return;
  var inp=document.createElement('input');
  inp.type='text'; inp.placeholder='https://…'; inp.value=value||'';
  linksBox.appendChild(inp);
  document.getElementById('f-link-add').style.display=
    linksBox.querySelectorAll('input').length>=3?'none':'';
}
function resetLinks(values){
  linksBox.innerHTML=''; document.getElementById('f-link-add').style.display='';
  if(values&&values.length) values.forEach(function(v){ addLinkField(v); });
  else addLinkField();
}
document.getElementById('f-link-add').addEventListener('click', function(){ addLinkField(); });

// 個別対象の職員チェックボックスを職員マスタから作る。selected があればチェック済みにする
function fillStaffPicker(selected){
  var box=document.getElementById('f-staff');
  var list=(DATA&&DATA.staffList)||[];
  var sel={}; (selected||[]).forEach(function(e){ sel[e.toLowerCase()]=true; });
  if(!list.length){ box.innerHTML='<span class="none">登録済みの職員がいません（各自がログインすると増えます）</span>'; return; }
  box.innerHTML=list.map(function(s){
    return '<label><input type="checkbox" value="'+esc(s.email)+'"'+(sel[s.email]?' checked':'')+'> '+esc(s.name)+'</label>';
  }).join('');
}

// 会議セレクトの変更：新規会議入力の表示、ヒントの出し分け
document.getElementById('f-meeting').addEventListener('change', function(){
  var v=this.value;
  document.getElementById('f-newmeeting').style.display=(v==='__new__')?'':'none';
  document.getElementById('f-meeting-hint').style.display=(v==='')?'':'none';
});
// 対象セレクトの変更：個別のとき職員リストを表示
document.getElementById('f-target').addEventListener('change', function(){
  var indiv=this.value==='個別';
  document.getElementById('f-staff-wrap').style.display=indiv?'':'none';
  if(indiv) fillStaffPicker();
});

/** 新規追加モードでモーダルを開く */
function openForm(){
  if(!DATA) return;
  editingId=null;
  form.reset();
  document.getElementById('form-title').textContent='連絡を追加';
  document.getElementById('f-submit').textContent='追加する';
  document.getElementById('f-meeting-field').style.display='';
  document.getElementById('f-kind-field').style.display='';
  populateMeetingSelect();
  document.getElementById('f-meeting').value=''; // 既定：会議に紐づけない
  document.getElementById('f-newmeeting').style.display='none';
  document.getElementById('f-meeting-hint').style.display='';
  document.getElementById('f-action-fields').style.display='none';
  document.getElementById('f-staff-wrap').style.display='none';
  resetLinks();
  overlay.classList.add('show');
}

/**
 * 編集モードでモーダルを開く。it は board カードの連絡（canEdit 付き）、
 * または会議アジェンダの行データ（同じく canEdit 付き）のどちらでも可。
 * 会議への紐づけと種別（協議／連絡）は編集不可のため、該当欄は隠す。
 */
function openEditForm(it){
  if(!it.canEdit){ showToast('この連絡は発信者のみ編集できます'); return; }
  editingId=it.id;
  form.reset();
  document.getElementById('form-title').textContent='編集';
  document.getElementById('f-submit').textContent='保存する';
  document.getElementById('f-meeting-field').style.display='none';
  document.getElementById('f-newmeeting').style.display='none';
  document.getElementById('f-kind-field').style.display='none';

  document.getElementById('f-title').value=it.title||'';
  document.getElementById('f-body').value=it.body||'';
  document.getElementById('f-speaker').value=it.speaker||'';
  document.getElementById('f-min').value=it.minutes||'';

  var action=!!it.action;
  document.getElementById('f-action').checked=action;
  document.getElementById('f-important').checked=!!it.important;
  document.getElementById('f-action-fields').style.display=action?'':'none';
  document.getElementById('f-due').value=it.dueISO||'';
  var targetType=it.targetType||'全員';
  document.getElementById('f-target').value=targetType;
  var indiv=targetType==='個別';
  document.getElementById('f-staff-wrap').style.display=indiv?'':'none';
  if(indiv){
    var pre=String(it.targetEmails||'').split(/[,\s]+/).filter(Boolean);
    fillStaffPicker(pre);
  }

  resetLinks(it.links||[]);
  overlay.classList.add('show');
}

document.getElementById('fab').addEventListener('click', openForm);
document.getElementById('f-cancel').addEventListener('click', function(){ overlay.classList.remove('show'); });
overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.classList.remove('show'); });
document.getElementById('f-action').addEventListener('change', function(){
  document.getElementById('f-action-fields').style.display=this.checked?'':'none';
});

form.addEventListener('submit', function(e){
  e.preventDefault();
  var btn=document.getElementById('f-submit');
  var action=document.getElementById('f-action').checked;
  var targetType=document.getElementById('f-target').value;

  // 個別対象の検証
  var targetEmails='';
  if(action && targetType==='個別'){
    var checked=[].slice.call(document.querySelectorAll('#f-staff input:checked')).map(function(c){return c.value;});
    if(!checked.length){ showToast('対象の職員を1名以上選んでください'); return; }
    targetEmails=checked.join(',');
  }
  var links=[].slice.call(linksBox.querySelectorAll('input'))
    .map(function(i){return i.value.trim();}).filter(String).slice(0,3);

  var basePayload={
    title:document.getElementById('f-title').value.trim(),
    body:document.getElementById('f-body').value.trim(),
    speaker:document.getElementById('f-speaker').value.trim(),
    minutes:document.getElementById('f-min').value.trim(),
    action:action,
    important:document.getElementById('f-important').checked,
    due:document.getElementById('f-due').value,
    targetType:targetType,
    targetEmails:targetEmails,
    links:links
  };

  if(editingId){
    btn.disabled=true;
    google.script.run.withSuccessHandler(function(res){
      btn.disabled=false; overlay.classList.remove('show');
      refreshAfterEdit(res||{});
      showToast('保存しました');
    }).withFailureHandler(function(err){ btn.disabled=false; showToast('エラー: '+err.message); }).editItem(editingId, basePayload);
    return;
  }

  var mSel=document.getElementById('f-meeting').value;
  // 新しい会議の検証
  var newMeeting=null;
  if(mSel==='__new__'){
    var d=document.getElementById('f-nm-date').value;
    if(!d){ showToast('新しい会議の日付を入力してください'); return; }
    newMeeting={date:d, kind:document.getElementById('f-nm-kind').value};
  }
  btn.disabled=true;
  var payload=Object.assign({
    meetingId: mSel==='__new__'?'':mSel,
    newMeeting: newMeeting,
    kind:document.querySelector('input[name=kind]:checked').value,
    posted:true
  }, basePayload);
  google.script.run.withSuccessHandler(function(res){
    btn.disabled=false; overlay.classList.remove('show');
    refreshAfterSubmit(res||{});
    showToast('追加しました');
  }).withFailureHandler(function(err){ btn.disabled=false; showToast('エラー: '+err.message); }).submitItem(payload);
});

/**
 * 編集の結果を、サーバーへ再読込せずその場に反映する。
 * editItem は更新後の連絡（掲載中の連絡事項のときのみ）を返すので、
 * DATA.items 内の該当IDを差し替えて再描画する。会議アジェンダ表示中は
 * そのアジェンダだけを取り直す（協議事項はボード側に写しを持たないため）。
 */
function refreshAfterEdit(res){
  if(res.item){
    var idx=DATA.items.findIndex(function(x){ return x.id===res.item.id; });
    if(idx>=0) DATA.items[idx]=res.item; else DATA.items.push(res.item);
    DATA.items.sort(itemSortComparator);
  }
  if(currentView==='board') renderBoard();
  else if(currentView==='admin') renderAdmin();
  else if(currentView==='meeting'){
    var pick=document.getElementById('m-pick');
    if(pick) loadAgenda(pick.value);
  }
  refreshMineCounters();
  renderCalendar();
}

/*
 * 起票の結果を、サーバーへ再読込せずその場に反映する。
 * submitItem は追加した連絡（掲載中の連絡事項のときのみ）と、
 * 新規作成した会議（あれば）を返すので、それをDATAへ差し込んで
 * 今表示している画面だけを再描画する。
 */
function refreshAfterSubmit(res){
  if(res.meeting && !DATA.meetings.some(function(m){return m.id===res.meeting.id;})){
    DATA.meetings.push(res.meeting);
    DATA.meetings.sort(function(a,b){return b.sortKey-a.sortKey;});
  }
  if(res.item){
    DATA.items.push(res.item);
    DATA.items.sort(itemSortComparator);
  }
  if(currentView==='board') renderBoard();
  else if(currentView==='admin') renderAdmin();
  else if(currentView==='meeting'){
    if(res.meeting) renderMeeting(); // 会議一覧に新規会議を反映しつつ選び直す
    else{ var pick=document.getElementById('m-pick'); if(pick) loadAgenda(pick.value); }
  }
  refreshMineCounters();
  renderCalendar();
}

/* ====== コメント ====== */
var commentOverlay=document.getElementById('comment-overlay');
var commentForm=document.getElementById('comment-form');
var commentListEl=document.getElementById('comment-list');
var commentTextEl=document.getElementById('comment-text');
var currentCommentItemId=null;

function openComments(itemId, title){
  currentCommentItemId=itemId;
  document.getElementById('comment-title').textContent='コメント：'+title;
  commentTextEl.value='';
  commentListEl.innerHTML='<div class="comment-empty">読み込み中…</div>';
  commentOverlay.classList.add('show');
  commentTextEl.focus();
  google.script.run.withSuccessHandler(function(res){
    if(currentCommentItemId!==itemId) return; // その間に別の連絡のコメントを開いていたら無視
    renderCommentList(res.comments);
    updateCommentBadge(itemId, res.commentCount);
  }).withFailureHandler(function(err){
    commentListEl.innerHTML='<div class="comment-empty">読み込みに失敗しました：'+esc(err.message)+'</div>';
  }).getComments(itemId);
}

function renderCommentList(list){
  if(!list.length){ commentListEl.innerHTML='<div class="comment-empty">まだコメントはありません。最初のコメントを書いてみましょう。</div>'; return; }
  commentListEl.innerHTML=list.map(function(c){
    return '<div class="comment-item"><div class="cmeta">'+esc(c.name)+' ・ '+esc(c.time)+'</div>'
      +'<div class="ctext">'+esc(c.text)+'</div></div>';
  }).join('');
  commentListEl.scrollTop=commentListEl.scrollHeight;
}

/** 件数バッジ（カード・アジェンダ表の両方にある同一連絡のボタン）を更新し、DATAにも反映する */
function updateCommentBadge(itemId, count){
  var it=DATA.items.find(function(x){ return x.id===itemId; });
  if(it) it.commentCount=count;
  document.querySelectorAll('[data-comment-btn="'+itemId+'"]').forEach(function(btn){
    btn.textContent=commentLabel(count);
  });
}

document.getElementById('comment-close').addEventListener('click', function(){ commentOverlay.classList.remove('show'); });
commentOverlay.addEventListener('click', function(e){ if(e.target===commentOverlay) commentOverlay.classList.remove('show'); });
commentForm.addEventListener('submit', function(e){
  e.preventDefault();
  var text=commentTextEl.value.trim();
  if(!text) return;
  var btn=document.getElementById('comment-submit');
  btn.disabled=true;
  google.script.run.withSuccessHandler(function(res){
    btn.disabled=false;
    commentTextEl.value='';
    renderCommentList(res.comments);
    updateCommentBadge(currentCommentItemId, res.commentCount);
  }).withFailureHandler(function(err){
    btn.disabled=false;
    showToast('エラー: '+err.message);
  }).addComment(currentCommentItemId, text);
});

/* ====== 起動 ====== */
load();
</script>
