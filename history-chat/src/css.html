<style>
/* ============================================================
   案B「藍と生成り」
   朱はひとつの意味にしか使わない ── たしかめられていない。
   推測の枠にも、肖像の「本人か論争中」にも、同じ朱が出る。
   ============================================================ */
:root{
  --ground:#E7E3D8; --paper:#F7F4EC; --paper-hi:#FDFBF5;
  --sumi:#1A2733; --muted:#6B6355; --line:#D3CCBB;
  --ai:#274B6D; --ai-soft:#E2E6EC; --ai-line:#C2CCD8;
  --shu:#B33A2B; --shu-soft:#F5E6E2;
  --gothic:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"BIZ UDMincho","Noto Serif JP",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground); color:var(--sumi);
  font-family:var(--gothic); font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; border:0; background:none}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid var(--shu); outline-offset:2px}
.hidden{display:none!important}

.shell{max-width:640px; margin:0 auto; min-height:100vh; background:var(--paper);
  border-left:1px solid var(--line); border-right:1px solid var(--line); display:flex; flex-direction:column}

/* ---------- 帯 ---------- */
.bar{display:flex; align-items:center; gap:11px; padding:10px 14px;
  background:var(--ai); color:var(--paper); position:sticky; top:0; z-index:20}
.bar-back{font-size:13px; font-weight:700; padding:5px 10px; border-radius:3px;
  border:1px solid rgba(247,244,236,.32); color:var(--paper)}
.bar-back:hover{background:rgba(247,244,236,.14)}
.bar-face{width:40px; height:40px; flex:none; border-radius:2px; overflow:hidden;
  border:1px solid rgba(247,244,236,.45)}
.bar-t{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1}
.bar-nm{font-family:var(--mincho); font-size:17px; font-weight:600; letter-spacing:.04em; line-height:1.3}
.bar-era{font-size:10.5px; letter-spacing:.12em; opacity:.78; font-weight:700}
.snd{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800;
  border:1.5px solid rgba(247,244,236,.4); border-radius:999px; padding:6px 12px; color:var(--paper); flex:none}
.snd:hover{background:rgba(247,244,236,.14)}
.snd[aria-pressed="true"]{background:var(--paper); color:var(--ai); border-color:var(--paper)}

.watch{display:flex; align-items:center; gap:8px; padding:9px 15px;
  background:var(--ai-soft); border-bottom:1px solid var(--ai-line);
  font-size:11.5px; font-weight:700; color:var(--ai)}

.view{display:none; flex-direction:column; flex:1; min-height:0}
.view.on{display:flex}

/* ---------- 肖像 ---------- */
.pt{position:relative; background:var(--paper-hi); overflow:hidden}
.pt img{display:block; width:100%; height:100%; object-fit:cover}
.pt-empty{width:100%; height:100%; display:grid; place-items:center; padding:6px;
  background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(107,99,85,.09) 6px 7px), var(--paper-hi);
  color:var(--muted); font-size:9px; font-weight:700; line-height:1.4; text-align:center}
.pt-none{width:100%; height:100%; display:grid; place-items:center; background:var(--ai-soft)}
.pt-none svg{width:62%; height:62%; opacity:.4}

.cert{display:inline-flex; align-items:center; font-size:10px; font-weight:800; letter-spacing:.05em;
  padding:3px 9px; border-radius:999px; border:1.5px solid; white-space:nowrap}
.cert.same{color:var(--ai); border-color:var(--ai-line); background:var(--ai-soft)}
.cert.den {color:var(--shu); border-color:#E0BDB6; background:var(--shu-soft)}
.cert.late{color:var(--muted); border-color:var(--line); background:var(--ground)}
.cert.none{color:var(--muted); border-color:var(--line); background:transparent; border-style:dashed}

/* ---------- 人物えらび ---------- */
.pick-h{padding:24px 18px 12px; display:flex; flex-direction:column; gap:6px}
.pick-h h1{font-family:var(--mincho); font-size:25px; font-weight:600; margin:0; letter-spacing:.03em}
.pick-h p{margin:0; font-size:13px; color:var(--muted)}
.pick{display:flex; flex-direction:column; gap:10px; padding:6px 15px 34px}
.fig{display:flex; align-items:stretch; width:100%; text-align:left;
  background:var(--paper-hi); border:1.5px solid var(--line); border-radius:4px;
  overflow:hidden; transition:border-color .15s, transform .1s}
.fig:hover{border-color:var(--ai)}
.fig:active{transform:translateY(1px)}
.fig .pt{width:78px; flex:none; border-right:1px solid var(--line)}
.fig-txt{display:flex; flex-direction:column; gap:3px; min-width:0; padding:12px 14px; justify-content:center}
.fig-nm{font-family:var(--mincho); font-size:17px; font-weight:600; letter-spacing:.04em}
.fig-nm em{font-family:var(--gothic); font-style:normal; font-size:10.5px; font-weight:700;
  color:var(--muted); margin-left:8px; letter-spacing:.06em}
.fig-sub{font-size:12px; color:var(--muted)}
.fig-cert{margin-top:3px}
.fig-shut{font-size:10px; font-weight:800; color:var(--muted); border:1px dashed var(--line);
  border-radius:999px; padding:2px 8px; margin-left:6px}

/* ---------- 肖像の詳細 ---------- */
.about{border-bottom:1px solid var(--line); background:var(--ground)}
.about-t{display:flex; align-items:center; gap:11px; width:100%; padding:10px 15px; text-align:left}
.about-t .cert{flex:none}
.about-t .lbl{font-size:11.5px; font-weight:700; color:var(--muted); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.about-t .cx{font-size:11px; font-weight:800; color:var(--ai); flex:none}
.about-b{display:none; padding:0 15px 14px; gap:13px}
.about-b.on{display:flex}
.about-b .pt{width:104px; height:130px; flex:none; border:1px solid var(--line); border-radius:2px}
.about-d{display:flex; flex-direction:column; gap:5px; min-width:0; font-size:12px; line-height:1.7}
.about-d dl{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0}
.about-d dt{color:var(--muted); font-weight:700; white-space:nowrap; font-size:11px}
.about-d dd{margin:0}
.about-d .warn{color:var(--shu); font-weight:700; font-size:11.5px; line-height:1.65; margin:3px 0 0}

/* ---------- 対話 ---------- */
.talk{flex:1; overflow-y:auto; padding:16px 15px 8px; display:flex; flex-direction:column; gap:13px}
.bub{max-width:88%; padding:13px 16px; border-radius:4px; line-height:1.85}
.bub.them{align-self:flex-start; background:var(--paper-hi); border:1px solid var(--line);
  font-family:var(--mincho); font-size:15.5px; letter-spacing:.015em}
.bub.me{align-self:flex-end; background:var(--ai); color:var(--paper);
  font-size:13.5px; font-weight:600; line-height:1.7; white-space:pre-wrap}
.bub.err{align-self:center; background:var(--shu-soft); border:1px solid #E0BDB6; color:var(--shu);
  font-size:12.5px; font-weight:700; max-width:96%; text-align:center}
.s{transition:background .18s}
.s.now{background:#EFE7CF; box-shadow:0 0 0 2px #EFE7CF}

.cite{margin-top:10px; display:inline-flex; align-items:center; gap:6px; font-family:var(--gothic);
  font-size:10.5px; font-weight:700; color:var(--ai);
  background:var(--ai-soft); border:1px solid var(--ai-line); border-radius:3px; padding:4px 10px}
.guess{margin-top:12px; padding-left:14px; border-left:2px solid var(--shu);
  display:flex; flex-direction:column; gap:6px}
.guess-tag{font-family:var(--gothic); font-size:10.5px; font-weight:800; letter-spacing:.11em;
  color:var(--shu); align-self:flex-start}
.guess p{margin:0}

.bub-act{margin-top:11px; display:flex; gap:8px}
.hear{font-family:var(--gothic); font-size:11px; font-weight:700; color:var(--ai);
  border:1.5px solid var(--ai-line); border-radius:999px; padding:4px 12px}
.hear:hover{background:var(--ai-soft)}
.hear.on{background:var(--ai); color:var(--paper); border-color:var(--ai)}

.wait{align-self:flex-start; display:flex; align-items:center; gap:9px; font-family:var(--mincho);
  font-size:14.5px; color:var(--muted); background:var(--paper-hi);
  border:1px dashed var(--line); border-radius:4px; padding:11px 16px}
.wait i{width:5px; height:5px; border-radius:50%; background:var(--muted);
  display:inline-block; animation:brush 1.3s ease-in-out infinite}
.wait i:nth-child(2){animation-delay:.18s}
.wait i:nth-child(3){animation-delay:.36s}
@keyframes brush{0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:1; transform:translateY(-3px)}}

.seeds{padding:2px 15px 0; display:flex; flex-direction:column; gap:7px}
.seeds-l{font-size:10.5px; font-weight:800; letter-spacing:.13em; color:var(--muted)}
.seeds-r{display:flex; flex-wrap:wrap; gap:7px}
.seed{font-size:12.5px; font-weight:600; background:var(--paper-hi); color:var(--ai);
  border:1.5px solid var(--ai-line); border-radius:999px; padding:6px 14px}
.seed:hover{background:var(--ai-soft)}

.compose{position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line);
  padding:10px 15px 15px; display:flex; flex-direction:column; gap:8px}
.remain{font-size:11px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
.compose-r{display:flex; gap:9px; align-items:flex-end}
textarea{flex:1; font-family:var(--gothic); font-size:14px; line-height:1.6; color:var(--sumi);
  background:var(--paper-hi); border:1.5px solid var(--line); border-radius:4px;
  padding:10px 12px; resize:none; height:48px}
textarea::placeholder{color:#9C9484}
.send{background:var(--ai); color:var(--paper); font-weight:800; font-size:14px;
  border-radius:4px; padding:12px 20px; flex:none}
.send:disabled{opacity:.4; cursor:default}

/* ---------- 最初に一度だけ出す注意書き ---------- */
.notice{position:fixed; inset:0; background:rgba(26,39,51,.72); display:none;
  align-items:center; justify-content:center; padding:20px; z-index:60}
.notice.on{display:flex}
.notice-c{background:var(--paper); border-radius:5px; max-width:460px; padding:26px 24px;
  display:flex; flex-direction:column; gap:16px; border-top:4px solid var(--shu)}
.notice-c h2{font-family:var(--mincho); font-size:20px; font-weight:600; margin:0}
.notice-c p{margin:0; font-size:14px; line-height:1.9; white-space:pre-wrap}
.notice-c .btn{align-self:flex-end; background:var(--ai); color:var(--paper);
  font-weight:800; border-radius:4px; padding:10px 24px}

/* ---------- 準備できていないとき ---------- */
.setup{margin:14px 15px; padding:14px 16px; background:var(--shu-soft);
  border:1px solid #E0BDB6; border-radius:4px; font-size:12.5px; line-height:1.8; color:var(--shu)}
.setup b{display:block; font-size:13.5px; margin-bottom:4px}

/* ============================================================
   教師画面
   ============================================================ */
.t-wrap{max-width:820px; margin:0 auto; padding:18px 16px 60px; display:flex; flex-direction:column; gap:20px}
.t-h{display:flex; flex-direction:column; gap:5px; border-bottom:2px solid var(--sumi); padding-bottom:14px}
.t-h h1{font-family:var(--mincho); font-size:24px; font-weight:600; margin:0}
.t-h p{margin:0; font-size:12.5px; color:var(--muted)}
.card{background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:18px 20px;
  display:flex; flex-direction:column; gap:13px}
.card h2{font-family:var(--mincho); font-size:17px; font-weight:600; margin:0}
.card p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.8}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.row label{font-size:12px; font-weight:700; color:var(--muted); min-width:110px}
select,input[type=number],input[type=text]{font-family:var(--gothic); font-size:13px; color:var(--sumi);
  background:var(--paper-hi); border:1.5px solid var(--line); border-radius:3px; padding:7px 10px}
select{min-width:230px}
.btn{background:var(--ai); color:var(--paper); font-weight:800; font-size:13px;
  border-radius:3px; padding:9px 18px}
.btn.ghost{background:transparent; color:var(--ai); border:1.5px solid var(--ai-line)}
.btn:disabled{opacity:.45; cursor:default}
.health{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:12.5px}
.health dt{color:var(--muted); font-weight:700}
.health dd{margin:0}
.ok{color:var(--ai); font-weight:800}
.ng{color:var(--shu); font-weight:800}
.t-figs{display:flex; flex-direction:column; gap:8px}
.t-fig{display:flex; align-items:center; gap:12px; padding:9px 12px; background:var(--paper-hi);
  border:1px solid var(--line); border-radius:3px}
.t-fig .pt{width:38px; height:46px; flex:none; border:1px solid var(--line); border-radius:2px}
.t-fig .nm{font-family:var(--mincho); font-size:15px; font-weight:600; flex:1; min-width:0}
.t-fig .nm span{font-family:var(--gothic); font-size:10.5px; font-weight:700; color:var(--muted); margin-left:8px}
.sw{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800;
  border:1.5px solid var(--line); border-radius:999px; padding:5px 13px; color:var(--muted)}
.sw[aria-pressed="true"]{background:var(--ai); color:var(--paper); border-color:var(--ai)}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,18px); background:var(--sumi);
  color:var(--paper); padding:10px 22px; border-radius:999px; font-size:13px; font-weight:700;
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:80}
.toast.on{opacity:1; transform:translate(-50%,0)}
</style>
