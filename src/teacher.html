<!-- 教師用SPA -->
<?!= include('css'); ?>
<?!= include('js_common'); ?>

<div class="app">
  <div class="lesson-head">
    <span class="subj" id="h-class">先生</span>
    <span class="t" id="h-title">読み込み中…</span>
    <span class="n" id="h-meta"></span>
  </div>

  <div class="t-tabs" role="tablist">
    <button class="t-tab" role="tab" aria-selected="true" data-tv="tv-mon">授業モニタ</button>
    <button class="t-tab" role="tab" aria-selected="false" data-tv="tv-design">本時デザイン</button>
    <button class="t-tab" role="tab" aria-selected="false" data-tv="tv-refl">ふりかえり一覧</button>
  </div>

  <!-- モニタ -->
  <div class="view on" id="tv-mon">
    <div id="mon-nolesson" class="card hidden"><div class="card-b center empty">
      公開中の授業がありません。「本時デザイン」タブで本時を公開してください。
    </div></div>
    <div id="mon-body" class="mon-wrap hidden">
      <div>
        <div class="card" style="margin-bottom:10px"><div class="card-b" style="padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap">
          <div class="legend">
            <span><i class="dot" style="background:var(--busy)"></i>取組中 <b class="num" id="c-busy">0</b></span>
            <span><i class="dot" style="background:var(--ok)"></i>完了 <b class="num" id="c-done">0</b></span>
            <span><i class="dot" style="background:var(--danger)"></i>🆘 <b class="num" id="c-help">0</b></span>
            <span><i class="dot" style="background:var(--warn)"></i>無操作 <b class="num" id="c-idle">0</b></span>
            <span><i class="dot" style="background:var(--idle)"></i>未着手 <b class="num" id="c-none">0</b></span>
          </div>
          <span style="margin-left:auto; font-size:11.5px; color:var(--muted)" id="mon-updated"></span>
        </div></div>
        <div class="mon-grid" id="mon-grid"></div>
      </div>
      <div class="card detail" id="detail">
        <div class="card-h"><span class="h-badge">👤</span><h2 id="d-name">児童をえらんでください</h2></div>
        <div class="card-b" id="d-body"><div class="empty">左のタイルをタップすると、目標・えらんだ学び方・進度がここに表示されます。</div></div>
      </div>
    </div>
  </div>

  <!-- 本時デザイン -->
  <div class="view" id="tv-design">
    <div class="card" style="margin-bottom:14px"><div class="card-b" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
      <label style="font-weight:700; font-size:13px">対象の本時：</label>
      <select id="lesson-select" style="padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink)"></select>
      <span id="lesson-state" class="rtag"></span>
      <div style="margin-left:auto; display:flex; gap:8px">
        <button class="btn ghost" id="btn-close">授業を終了</button>
        <button class="btn" id="btn-publish">この本時を公開</button>
      </div>
    </div></div>
    <div class="design-grid" id="design-grid"></div>
  </div>

  <!-- ふりかえり一覧 -->
  <div class="view" id="tv-refl">
    <div class="card"><div class="card-h"><span class="h-badge">📊</span><h2 id="refl-title">ふりかえり一覧</h2><span class="sub-h" style="margin-left:6px">☆で「みんなの工夫」に共有</span></div>
      <div class="card-b" style="overflow-x:auto" id="refl-body"></div>
    </div>
  </div>
</div>

<script>
var META = null;         // 現在公開中の本時メタ
var monTimer = null;
var selectedUser = null;

/* ---- タブ ---- */
document.addEventListener('click', function(e){
  var t = e.target.closest('.t-tab');
  if(t){
    $$('.t-tab').forEach(function(x){ x.setAttribute('aria-selected', x===t); });
    ['tv-mon','tv-design','tv-refl'].forEach(function(id){ $('#'+id).classList.toggle('on', id===t.dataset.tv); });
    if(t.dataset.tv==='tv-design') loadDesign();
    if(t.dataset.tv==='tv-refl') loadReflections();
    if(t.dataset.tv==='tv-mon') startMonitor(); else stopMonitor();
    return;
  }
});

/* ---- モニタ ---- */
function startMonitor(){ stopMonitor(); pollMonitor(); monTimer = setInterval(pollMonitor, 15000); }
function stopMonitor(){ if(monTimer){ clearInterval(monTimer); monTimer=null; } }

function pollMonitor(){
  callServer('teacher_getMonitor').then(function(res){
    if(!res.hasLesson){ $('#mon-nolesson').classList.remove('hidden'); $('#mon-body').classList.add('hidden'); return; }
    $('#mon-nolesson').classList.add('hidden'); $('#mon-body').classList.remove('hidden');
    META = res.meta;
    setHeader(res.meta);
    $('#c-busy').textContent = res.counts.busy; $('#c-done').textContent = res.counts.done;
    $('#c-help').textContent = res.counts.help; $('#c-idle').textContent = res.counts.idle; $('#c-none').textContent = res.counts.none;
    $('#mon-updated').textContent = '最終更新 ' + new Date(res.serverMs).toLocaleTimeString('ja-JP');
    renderTiles(res.tiles);
  }).catch(function(e){ /* ポーリング中の一時エラーは無視 */ });
}

var FLAG = { help:'🆘 こまった', idle:'⏳ 無操作', none:'未着手', busy:'', done:'✔ 完了' };
function renderTiles(tiles){
  $('#mon-grid').innerHTML = tiles.map(function(s){
    var flag = s.status==='idle' ? ('⏳ '+s.idleMin+'分') : (FLAG[s.status]||'');
    var pct = s.total ? (s.doneCount/s.total*100) : 0;
    return '<button class="tile'+(s.userId===selectedUser?' sel':'')+'" data-uid="'+esc(s.userId)+'" data-st="'+s.status+'">'+
      '<span class="nm"><span class="no num">'+esc(s.number)+'</span>'+esc(s.name)+
        (flag?'<span class="flag">'+flag+'</span>':'')+'</span>'+
      '<span class="meta">'+esc(s.form||'—')+'<span class="num" style="margin-left:auto">'+s.doneCount+'/'+s.total+'</span></span>'+
      '<span class="pbar"><i style="width:'+pct+'%"></i></span></button>';
  }).join('');
}

document.addEventListener('click', function(e){
  var tile = e.target.closest('.tile');
  if(tile){ openDetail(tile.dataset.uid); }
});

function openDetail(uid){
  selectedUser = uid;
  $$('.tile').forEach(function(t){ t.classList.toggle('sel', t.dataset.uid===uid); });
  callServer('teacher_getStudentDetail', uid).then(function(d){
    if(!d.hasLesson) return;
    $('#d-name').textContent = d.number + '番 ' + d.name + 'さん';
    var lbl=['未着手','取組中','完了'];
    var steps = d.checklist.map(function(c){
      var col = c.status===2?'var(--ok)':(c.status===1?'var(--busy)':'');
      var mk = c.status===2?'✔ ':(c.status===1?'▶ ':'・ ');
      return '<span class="d-chip" style="color:'+col+'">'+mk+esc(c.name)+'</span>';
    }).join('');
    var sels = Object.keys(d.selections||{}).map(function(cat){
      var v = d.selections[cat]; return esc(Array.isArray(v)?v.join('・'):v);
    }).join(' ・ ');
    $('#d-body').innerHTML =
      (d.help ? '<div style="background:var(--danger-soft); color:var(--danger); font-weight:800; border-radius:8px; padding:8px 12px">🆘 たすけてサインが出ています</div>' : '')+
      '<div class="d-row"><b>目標（BE / DO）</b>'+(d.goal? esc(d.goal.be)+'取り組む ／ '+esc(d.goal.doText) : '<span class="muted">未設定</span>')+'</div>'+
      '<div class="d-row"><b>工夫カード（REGULATE）</b><span class="d-chips">'+
        (d.regulateNames.length? d.regulateNames.map(function(r){ return '<span class="d-chip acc">'+esc(r)+'</span>'; }).join('') : '<span class="muted">未選択</span>')+'</span></div>'+
      (d.usedNames.length? '<div class="d-row"><b>使った工夫</b>'+esc(d.usedNames.join('、'))+'</div>' : '')+
      '<div class="d-row"><b>えらんだ学び方</b>'+(sels||'<span class="muted">未選択</span>')+'</div>'+
      '<div class="d-row"><b>進度</b><span class="d-chips">'+(steps||'<span class="muted">—</span>')+'</span></div>'+
      '<div class="d-row"><b>ひとことコメントを送る</b>'+
        '<div class="quick">'+
          '<button data-fb="いい工夫だね！">👍 いい工夫！</button>'+
          '<button data-fb="その調子でがんばろう">🙌 その調子</button>'+
          '<button data-fb="先生がそちらに行くね">🙋 先生が行くね</button>'+
        '</div>'+
        '<div style="display:flex; gap:6px; margin-top:8px">'+
          '<input type="text" id="fb-input" placeholder="自由に入力…" style="flex:1">'+
          '<button class="btn" style="padding:8px 14px" id="fb-send">送信</button>'+
        '</div></div>';
  });
}

document.addEventListener('click', function(e){
  var q = e.target.closest('[data-fb]');
  if(q){ sendFeedback(q.dataset.fb); return; }
  if(e.target.id==='fb-send'){ var v=$('#fb-input').value; if(v.trim()) sendFeedback(v); return; }
});
function sendFeedback(text){
  if(!selectedUser) return;
  save('teacher_sendFeedback', selectedUser, text).then(function(){ toast('コメントを送信しました'); if($('#fb-input')) $('#fb-input').value=''; });
}

/* ---- 本時デザイン ---- */
function loadDesign(lessonId){
  callServer('teacher_getDesign', lessonId||null).then(function(d){
    if(!d.hasLesson){ $('#design-grid').innerHTML = '<div class="card"><div class="card-b empty">本時がありません。スプレッドシートのメニューから初期セットアップを実行してください。</div></div>'; return; }
    // セレクタ
    $('#lesson-select').innerHTML = d.lessonList.map(function(l){
      return '<option value="'+esc(l.lessonId)+'"'+(l.lessonId===d.lesson.lessonId?' selected':'')+'>'+esc(l.period)+'時：'+esc(l.title||'')+'（'+esc(l.state)+'）</option>';
    }).join('');
    $('#lesson-state').textContent = d.lesson.state;
    renderDesign(d);
  });
}

function renderDesign(d){
  var L = d.lesson;
  var choiceRows = ['学習形態','ツール','順序','場所'].map(function(cat){
    var on = !!d.openCats[cat];
    var sub = ({'学習形態':'ひとり／ペア／グループ','ツール':'教科書／資料集／動画／白地図','順序':'調べてから／構想してから','場所':'自席／学びスペース'})[cat];
    return '<div class="sw-row"><div><div class="lb">'+cat+'</div><div class="sb2">'+sub+'</div></div>'+
      '<button class="switch" data-choice="'+cat+'" aria-pressed="'+on+'"></button></div>';
  }).join('');

  var stratChips = d.strategies.map(function(s){
    return '<button class="chip" data-strat="'+esc(s.strategyId)+'" aria-pressed="'+s.linked+'"><span class="cx">✓</span>'+esc(s.icon)+' '+esc(s.name)+'</button>';
  }).join('');

  var resList = d.resources.length ? d.resources.map(function(r){
    var tagCls = (r.kind && r.kind!=='手もと資料')?'rtag link':'rtag';
    return '<div class="res-row"><span class="ic">'+esc(r.icon)+'</span><div><div class="ti">'+esc(r.title)+'</div><div class="sub">'+esc(r.url||r.sub||'')+'</div></div><span class="'+tagCls+'">'+esc(r.kind||'')+'</span></div>';
  }).join('') : '<div class="empty">資料は未登録（スプレッドシートの「本時_資料」で追加できます）</div>';

  $('#design-grid').innerHTML =
    '<div class="card"><div class="card-h"><span class="h-badge">❓</span><h2>本時の課題とゴール</h2></div><div class="card-b stack">'+
      '<div><h3>学習課題</h3><textarea rows="2" data-lf="学習課題">'+esc(L.task)+'</textarea></div>'+
      '<div><h3>ゴール（評価基準）</h3><textarea rows="2" data-lf="ゴール">'+esc(L.goal)+'</textarea></div>'+
      '<div><h3>進度チェック項目（1行に1つ）</h3><textarea rows="4" data-lf="進度チェック項目">'+esc(L.checklist)+'</textarea></div>'+
      '<div><h3>裁量レベル</h3><div class="chips" id="discretion">'+
        [1,2,3].map(function(n){ return '<button class="chip" data-disc="'+n+'" aria-pressed="'+(String(n)===String(L.discretion))+'"><span class="cx">✓</span>'+n+'（'+({1:'指定',2:'選択',3:'自由'})[n]+'調整型）</button>'; }).join('')+
      '</div></div>'+
    '</div></div>'+
    '<div class="card"><div class="card-h"><span class="h-badge">🎛</span><h2>児童に開放する選択肢</h2></div><div class="card-b">'+choiceRows+'</div></div>'+
    '<div class="card" style="grid-column:1/-1"><div class="card-h"><span class="h-badge">📎</span><h2>本時の資料（児童の「資料コーナー」に表示）</h2></div><div class="card-b res-list">'+resList+'</div></div>'+
    '<div class="card" style="grid-column:1/-1"><div class="card-h"><span class="h-badge">🃏</span><h2>おすすめとして紐づける方略カード</h2></div><div class="card-b"><div class="chips">'+stratChips+'</div></div></div>';
}

function currentLessonId(){ return $('#lesson-select') ? $('#lesson-select').value : null; }

document.addEventListener('change', function(e){
  if(e.target.id==='lesson-select'){ loadDesign(e.target.value); }
});
document.addEventListener('input', function(e){
  var lf = e.target.dataset && e.target.dataset.lf;
  if(lf){ saveLessonFieldDebounced(currentLessonId(), lf, e.target.value); }
});
var saveLessonFieldDebounced = debounce(function(lid, field, val){
  var patch = {}; patch[field] = val; save('teacher_updateLesson', lid, patch);
}, 700);

document.addEventListener('click', function(e){
  var sw = e.target.closest('.switch[data-choice]');
  if(sw){ var on = sw.getAttribute('aria-pressed')!=='true'; sw.setAttribute('aria-pressed', String(on)); save('teacher_setChoice', currentLessonId(), sw.dataset.choice, on); return; }

  var disc = e.target.closest('[data-disc]');
  if(disc){ $$('#discretion .chip').forEach(function(x){ x.setAttribute('aria-pressed','false'); }); disc.setAttribute('aria-pressed','true'); save('teacher_updateLesson', currentLessonId(), {'裁量レベル': Number(disc.dataset.disc)}); return; }

  var st = e.target.closest('[data-strat]');
  if(st){ var son = st.getAttribute('aria-pressed')!=='true'; st.setAttribute('aria-pressed', String(son)); save('teacher_setStrategyLink', currentLessonId(), st.dataset.strat, son); return; }

  if(e.target.id==='btn-publish'){ save('teacher_setLessonState', currentLessonId(), '公開中').then(function(){ toast('本時を児童に公開しました'); loadDesign(currentLessonId()); }); return; }
  if(e.target.id==='btn-close'){ save('teacher_setLessonState', currentLessonId(), '終了').then(function(){ toast('授業を終了しました'); loadDesign(currentLessonId()); }); return; }
});

/* ---- ふりかえり一覧 ---- */
var reflLessonId = null;
function loadReflections(){
  callServer('teacher_getReflections', null).then(function(d){
    if(!d.hasLesson){ $('#refl-body').innerHTML = '<div class="empty">本時がありません。</div>'; return; }
    reflLessonId = d.lessonId;
    $('#refl-title').textContent = d.period + '時のふりかえり一覧';
    var rows = d.rows.map(function(r){
      if(!r.hasRefl){
        return '<tr><td><b>'+esc(r.number)+' '+esc(r.name)+'</b></td><td class="muted">未記入</td><td></td><td class="muted">—（声かけ対象）</td><td></td></tr>';
      }
      var tags = r.attrGood.map(function(t){ return '<span class="attr-tag">○'+esc(short_(t))+'</span>'; })
        .concat(r.attrHard.map(function(t){ return '<span class="attr-tag">△'+esc(short_(t))+'</span>'; })).join(' ');
      return '<tr><td><b>'+esc(r.number)+' '+esc(r.name)+'</b></td>'+
        '<td><span class="bar-mini"><i style="width:'+esc(r.achievement)+'%"></i></span><span class="num">'+esc(r.achievement)+'</span> '+esc(r.mood||'')+'</td>'+
        '<td>'+(tags||'')+'</td>'+
        '<td>'+esc(r.selfEval||'')+(r.nextPlan?'<br><span class="muted">次：'+esc(r.nextPlan)+'</span>':'')+'</td>'+
        '<td><button class="star-btn" data-share="'+esc(r.userId)+'" aria-pressed="'+r.shared+'">⭐</button></td></tr>';
    }).join('');
    $('#refl-body').innerHTML = '<table class="refl-table"><thead><tr><th style="width:96px">児童</th><th style="width:130px">達成度</th><th style="width:150px">原因</th><th>ひとこと・次への一手</th><th style="width:46px">共有</th></tr></thead><tbody>'+rows+'</tbody></table>';
  });
}
function short_(t){ return t.replace(/（.*?）/g,'').slice(0,6); }

document.addEventListener('click', function(e){
  var sb = e.target.closest('[data-share]');
  if(sb){ var on = sb.getAttribute('aria-pressed')!=='true'; sb.setAttribute('aria-pressed', String(on));
    save('teacher_toggleShare', sb.dataset.share, reflLessonId, on).then(function(){ toast(on?'「みんなの工夫」に共有しました':'共有を取り消しました'); }); }
});

/* ---- 共通 ---- */
function setHeader(meta){
  if(!meta) return;
  $('#h-class').textContent = meta.grade + ' ' + (meta.subject||'');
  $('#h-title').textContent = meta.unitName + ' ' + meta.period + '/' + meta.total;
  $('#h-meta').textContent = meta.state;
}

/* 起動 */
callServer('teacher_bootstrap').then(function(res){
  $('#h-class').textContent = '先生';
  if(res.lessonMeta) setHeader(res.lessonMeta);
  else { $('#h-title').textContent = '公開中の授業はありません'; }
  startMonitor();
}).catch(function(e){ $('#h-title').textContent='エラー'; toast('読み込みに失敗しました: '+(e&&e.message||e)); });
</script>
