<script>
/** google.script.run を Promise 化して呼ぶ */
function callServer(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    runner[fn].apply(runner, args);
  });
}

var $  = function(s, el){ return (el||document).querySelector(s); };
var $$ = function(s, el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); };

/** 画面下のトースト。
    読み上げの領域は、知らせが入る前に置いておかないと読まれないので先に作る。 */
var _toastEl, _toastT;
function ensureToast(){
  if(_toastEl) return _toastEl;
  _toastEl = document.createElement('div');
  _toastEl.className = 'toast';
  _toastEl.setAttribute('role','status'); _toastEl.setAttribute('aria-live','polite');
  document.body.appendChild(_toastEl);
  return _toastEl;
}
function toast(msg){
  ensureToast();
  _toastEl.textContent = msg; _toastEl.classList.add('on');
  clearTimeout(_toastT); _toastT = setTimeout(function(){ _toastEl.classList.remove('on'); }, 2200);
}

/** 右下の保存インジケータ（「保存中…」→「保存しました」） */
var _saveEl, _saveT;
function saveBar(state){
  if(!_saveEl){
    _saveEl = document.createElement('div'); _saveEl.className='savebar';
    _saveEl.setAttribute('role','status'); _saveEl.setAttribute('aria-live','polite');
    document.body.appendChild(_saveEl);
  }
  if(state === 'saving'){ _saveEl.innerHTML = '<span class="spinner"></span> 保存中…'; _saveEl.classList.add('on'); clearTimeout(_saveT); }
  else if(state === 'saved'){ _saveEl.textContent = '✔ 保存しました'; _saveEl.classList.add('on'); clearTimeout(_saveT); _saveT = setTimeout(function(){ _saveEl.classList.remove('on'); }, 1400); }
  else { _saveEl.classList.remove('on'); }
}

// 読み上げ領域は先に用意しておく
if(document.body) ensureToast();
else document.addEventListener('DOMContentLoaded', ensureToast);

/** 保存系の共通ラッパ：インジケータを出しつつサーバー呼び出し */
function save(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  saveBar('saving');
  return callServer.apply(null, [fn].concat(args))
    .then(function(r){ saveBar('saved'); return r; })
    .catch(function(e){ saveBar('hide'); toast('保存できませんでした: ' + (e && e.message || e)); throw e; });
}

/** HTMLエスケープ */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/** デバウンス（テキスト入力の保存など） */
function debounce(fn, ms){
  var t; return function(){ var a=arguments, c=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); }, ms||600); };
}
</script>
