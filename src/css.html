<style>
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --surface2:#EDF0EA;
  --ink:#23303A; --muted:#5D6B76; --line:#D9DFD9;
  --primary:#2E5E8C; --primary-ink:#FFFFFF; --primary-soft:#E3ECF5; --primary-line:#B9CDE0;
  --accent:#DF9A1F; --accent-soft:#FBF0DA;
  --ok:#2E9E6B; --ok-soft:#E0F2E9;
  --busy:#3D7BB8; --busy-soft:#E2EEF8;
  --warn:#C79400; --warn-soft:#FAF1D2;
  --danger:#CE4A42; --danger-soft:#FAE3E1;
  --idle:#8A94A0; --idle-soft:#EAEDEF;
  --shadow:0 1px 3px rgba(35,48,58,.10);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151A1F; --surface:#1E252C; --surface2:#252D35;
    --ink:#E7EBEE; --muted:#9AA7B1; --line:#37414B;
    --primary:#6FA3D4; --primary-ink:#0F1519; --primary-soft:#24384C; --primary-line:#3A5878;
    --accent:#E5AC45; --accent-soft:#3A2F1A;
    --ok:#4CBB8A; --ok-soft:#1E3A2E; --busy:#6FA8DC; --busy-soft:#20344A;
    --warn:#D9B23C; --warn-soft:#3A331A; --danger:#E0736C; --danger-soft:#41231F;
    --idle:#7C8894; --idle-soft:#2A323A; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
input,textarea,select{font-family:inherit}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.app{max-width:1180px; margin:0 auto; padding:16px 16px 80px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card+.card, .stack>*+*{margin-top:14px}
.stack{display:flex; flex-direction:column}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 18px 0}
.card-b{padding:14px 18px 18px}
.h-badge{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-size:17px; background:var(--primary-soft); flex:none}
h2{font-size:16px; margin:0; text-wrap:balance}
h3{font-size:14px; margin:0 0 8px; color:var(--muted); font-weight:700}
.sub-h{font-size:11.5px; color:var(--muted); font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.center{text-align:center}
.row-end{display:flex; justify-content:flex-end}
.hidden{display:none!important}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 16px; font-weight:600; transition:border-color .15s, background .15s}
.chip[aria-pressed="true"]{border-color:var(--primary); background:var(--primary-soft)}
.chip .cx{display:none; color:var(--primary); font-weight:800; margin-right:2px}
.chip[aria-pressed="true"] .cx{display:inline}
.btn{border:0; border-radius:var(--r); padding:10px 22px; font-weight:800; background:var(--primary); color:var(--primary-ink)}
.btn.ghost{background:var(--surface); color:var(--primary); border:1.5px solid var(--primary-line)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5; cursor:default}
textarea, input[type=text]{width:100%; border:1.5px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); padding:9px 12px; resize:vertical}

.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:10px 22px; border-radius:999px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:99}
.toast.on{opacity:1; transform:translate(-50%,0)}

.lesson-head{display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--primary); color:var(--primary-ink); border-radius:var(--r); padding:14px 20px; margin-bottom:14px}
.lesson-head .subj{background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.25); border-radius:7px; padding:3px 12px; font-weight:800; font-size:13px}
.lesson-head .t{font-size:17px; font-weight:800; text-wrap:balance}
.lesson-head .n{margin-left:auto; font-size:13px; opacity:.9}
/* 役割の切り替え（教師は下見、児童はデモモードのときだけ） */
.role-sw{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
  border-radius:999px; padding:5px 14px; font-size:12px; font-weight:800; color:var(--primary-ink); text-decoration:none; white-space:nowrap}
.role-sw:hover{background:rgba(255,255,255,.3)}
.rs-demo{background:var(--accent); color:#1b1300; border-radius:999px; padding:1px 7px; font-size:10px; letter-spacing:.06em}

/* シートへのリンク（教師ヘッダー） */
.sheet-links{position:relative; display:inline-flex}
.sl-main{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
  border-radius:999px; padding:5px 14px; font-size:12px; font-weight:800; color:var(--primary-ink); text-decoration:none; white-space:nowrap}
.sl-main:hover{background:rgba(255,255,255,.3)}
.sl-ic{font-size:14px}
.sl-menu{position:absolute; top:calc(100% + 6px); right:0; min-width:190px; background:var(--surface); border:1.5px solid var(--line);
  border-radius:10px; box-shadow:0 6px 20px rgba(35,48,58,.18); padding:6px; display:none; flex-direction:column; z-index:75}
.sheet-links:hover .sl-menu, .sheet-links:focus-within .sl-menu{display:flex}
.sl-menu a{padding:7px 12px; border-radius:7px; font-size:12.5px; font-weight:700; color:var(--ink); text-decoration:none; white-space:nowrap}
.sl-menu a:hover{background:var(--primary-soft); color:var(--primary)}

/* ===== 1画面1まとまり：ステップ・帯・2カラム ===== */

/* 必須メーター（進んだ実感を上に固定して見せる） */
.meter{display:flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--line);
  border-radius:var(--r); padding:10px 16px; margin-bottom:12px}
.meter .mt-l{font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap}
.meter .mt-bar{flex:1; height:12px; background:var(--surface2); border-radius:999px; overflow:hidden}
.meter .mt-bar i{display:block; height:100%; width:0; border-radius:999px; background:var(--ok);
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter .mt-bar i.full{background:linear-gradient(90deg,var(--ok),var(--accent))}
.meter .mt-n{font-size:13px; font-weight:800; white-space:nowrap}

/* ステップの現在地 */
.stepbar{display:flex; align-items:center; gap:6px; margin-bottom:14px; flex-wrap:wrap}
.sdot{display:flex; align-items:center; gap:8px; border:2px solid var(--line); background:var(--surface);
  border-radius:999px; padding:6px 14px 6px 8px; transition:border-color .2s, background .2s}
.sdot .sd-n{display:grid; place-items:center; width:22px; height:22px; border-radius:50%;
  background:var(--surface2); color:var(--muted); font-weight:800; font-size:12px}
.sdot .sd-l{font-size:12.5px; font-weight:700; color:var(--muted)}
.sdot.now{border-color:var(--primary); background:var(--primary-soft)}
.sdot.now .sd-n{background:var(--primary); color:var(--primary-ink); animation:pulse 2s ease-in-out infinite}
.sdot.now .sd-l{color:var(--primary)}
.sdot.done .sd-n{background:var(--ok); color:#fff}
.sdot.done .sd-l{color:var(--ink)}
.sline{flex:0 0 20px; height:2px; background:var(--line); border-radius:2px; transition:background .3s}
.sline.done{background:var(--ok)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,94,140,.45)} 50%{box-shadow:0 0 0 6px rgba(46,94,140,0)}}

/* ステージ：1度に1つの step だけ見せる */
.stage{position:relative}
.step{display:none}
.step.on{display:block}
.step-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; flex-wrap:wrap}
.step-nav .btn.next{padding:12px 26px; font-size:15px}
.step-nav .now{font-size:12.5px; font-weight:800; border-radius:999px; padding:5px 12px; background:var(--idle-soft); color:var(--idle)}
.step-nav .now.s1{background:var(--busy-soft); color:var(--busy)}
.step-nav .now.s2{background:var(--ok-soft); color:var(--ok)}
.done-mark{font-size:15px; font-weight:800; color:var(--ok)}

@keyframes inRight{from{opacity:0; transform:translateX(28px)} to{opacity:1; transform:none}}
@keyframes inLeft{from{opacity:0; transform:translateX(-28px)} to{opacity:1; transform:none}}
@keyframes outLeft{from{opacity:1; transform:none} to{opacity:0; transform:translateX(-28px)}}
@keyframes outRight{from{opacity:1; transform:none} to{opacity:0; transform:translateX(28px)}}
@keyframes zoomIn{from{opacity:0; transform:scale(.97)} to{opacity:1; transform:none}}
.step.in-right, .panel.in-right{animation:inRight .28s cubic-bezier(.2,.8,.2,1)}
.step.in-left{animation:inLeft .28s cubic-bezier(.2,.8,.2,1)}
.step.out-left{display:block; position:absolute; inset:0; animation:outLeft .22s ease-in forwards; pointer-events:none}
.step.out-right{display:block; position:absolute; inset:0; animation:outRight .22s ease-in forwards; pointer-events:none}
.layer.zoom-in{animation:zoomIn .26s cubic-bezier(.2,.8,.2,1)}

/* ②：一覧 ⇄ 1課題 */
.layer{display:none}
.layer.on{display:block}
.task-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px}
.tcardx{border:2px solid var(--line); background:var(--surface); border-radius:var(--r); padding:14px 16px;
  display:grid; gap:6px; text-align:left; transition:border-color .18s, transform .18s, box-shadow .18s}
.tcardx:hover{border-color:var(--primary); transform:translateY(-2px); box-shadow:0 6px 18px rgba(35,48,58,.10)}
.tcardx.s1{border-color:var(--busy-soft); background:var(--busy-soft)}
.tcardx.s2{border-color:var(--ok-soft); background:var(--ok-soft)}
.tx-k{font-size:11px; font-weight:800}
.tx-t{font-size:15.5px; font-weight:800; line-height:1.4}
.tx-m{font-size:11.5px; color:var(--muted)}
.tx-s{justify-self:start; font-size:11px; font-weight:800; border-radius:999px; padding:3px 10px; background:var(--idle-soft); color:var(--idle)}
.tx-s.s1{background:var(--busy); color:#fff}
.tx-s.s2{background:var(--ok); color:#fff}
.tx-go{font-size:12px; font-weight:800; color:var(--primary); opacity:0; transition:opacity .18s}
.tcardx:hover .tx-go{opacity:1}

.task-top{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.tt-title{font-size:17px; font-weight:800}

/* 帯（課題の中の見通す→実行→振り返る） */
.bands{position:relative; display:flex; gap:4px; border-bottom:2px solid var(--line); margin-bottom:16px}
.band{background:transparent; border:none; padding:11px 18px; font-size:14px; font-weight:800; color:var(--muted);
  display:flex; align-items:center; gap:6px; transition:color .2s}
.band .bi{font-size:16px}
.band[aria-selected="true"]{color:var(--primary)}
.band-ink{position:absolute; bottom:-2px; left:0; height:3px; width:0; background:var(--primary); border-radius:2px;
  transition:transform .28s cubic-bezier(.2,.8,.2,1), width .28s cubic-bezier(.2,.8,.2,1)}

/* 2カラム：🆘とみんなの様子は常に手の届くところに */
.work-grid{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start}
.work-main{min-width:0}
.work-side{position:sticky; top:12px; display:flex; flex-direction:column; gap:12px}
.work-side .help-btn{width:100%; margin:0; padding:14px 12px; line-height:1.4}
.hb-s{display:block; font-size:11.5px; font-weight:700; opacity:.85}
.side-card .card-b{padding:12px 14px}
.side-card .peer-grid{grid-template-columns:1fr}
.side-btns{display:flex; flex-direction:column; gap:8px}
.shelf-b{border:2px solid var(--line); background:var(--surface); border-radius:var(--r); padding:11px 14px;
  font-size:12.5px; font-weight:800; text-align:left; transition:border-color .18s, background .18s}
.shelf-b:hover{border-color:var(--primary); background:var(--primary-soft); color:var(--primary)}

@media (max-width: 900px){
  .work-grid{grid-template-columns:1fr}
  .work-side{position:static; padding-bottom:4px}
  /* 1カラムになると右カラムは画面外に流れてしまう。
     こまったボタンだけは画面の下に貼り付けて、いつでも押せるようにする */
  .work-side .help-btn{position:fixed; left:16px; right:16px; bottom:14px; width:auto; z-index:70;
    box-shadow:0 6px 20px rgba(35,48,58,.28)}
  .app{padding-bottom:110px}
}

/* 引き出し（資料・学びログ・足あと） */
.stash{display:none}
.sheet{position:fixed; inset:0; z-index:86; background:rgba(15,21,25,.5); display:none; justify-content:flex-end}
.sheet.open{display:flex}
.sheet-box{width:min(560px,100vw); height:100%; background:var(--bg); box-shadow:-6px 0 24px rgba(35,48,58,.2);
  display:flex; flex-direction:column; animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(100%)} to{transform:none}}
.sheet-h{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px; font-weight:800; font-size:16px;
  background:var(--surface); border-bottom:1.5px solid var(--line)}
.sheet-x{border:none; background:transparent; font-size:18px; color:var(--muted); padding:2px 8px}
.sheet-b{flex:1; overflow-y:auto; padding:16px 18px 28px}

/* ヘッダーの足あとボタン */
.fp-btn{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
  border-radius:999px; padding:5px 14px; font-size:12px; font-weight:800; color:var(--primary-ink)}
.fp-btn:hover{background:rgba(255,255,255,.3)}

/* できた！の演出 */
.burst{position:fixed; z-index:99; pointer-events:none}
.burst i{position:absolute; font-size:20px; animation:pop .85s ease-out forwards; transform:rotate(var(--a))}
@keyframes pop{
  0%{opacity:0; transform:rotate(var(--a)) translateY(0) scale(.4)}
  25%{opacity:1}
  100%{opacity:0; transform:rotate(var(--a)) translateY(-70px) scale(1.15)}
}

@media (prefers-reduced-motion: reduce){
  .step, .panel, .layer, .sheet-box, .burst i{animation:none !important}
  .meter .mt-bar i, .band-ink{transition:none}
  .sdot.now .sd-n{animation:none}
}

/* 児童3タブ */
.big-tabs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px}
.big-tab{border:2px solid var(--line); background:var(--surface); border-radius:var(--r); padding:12px 10px 10px; text-align:center; transition:border-color .15s, background .15s}
.big-tab .no{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--surface2); color:var(--muted); font-weight:800; font-size:13px; margin-bottom:2px}
.big-tab .lb{display:block; font-size:16px; font-weight:800}
.big-tab .sb{display:block; font-size:11px; color:var(--muted)}
.big-tab[aria-selected="true"]{border-color:var(--primary); background:var(--primary-soft)}
.big-tab[aria-selected="true"] .no{background:var(--primary); color:var(--primary-ink)}
.panel{display:none; flex-direction:column; gap:14px}
.panel.on{display:flex}

.task-goal{display:grid; grid-template-columns:1.2fr 1fr; gap:14px}
@media (max-width:860px){.task-goal{grid-template-columns:1fr}}
.task-q{font-size:17px; font-weight:800; line-height:1.7; text-wrap:balance}
.goal-box{background:var(--accent-soft); border:1.5px solid var(--accent); border-radius:8px; padding:10px 14px; font-size:13.5px}
.goal-box b{display:block; color:var(--accent); font-size:11px; letter-spacing:.14em; margin-bottom:4px}
.res-strip{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; align-items:center; border-top:1px dashed var(--line); padding-top:10px; font-size:12px; color:var(--muted)}

.strat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:10px}
.strat{border:2px solid var(--line); border-radius:var(--r); background:var(--surface); padding:10px 12px; text-align:left; display:flex; flex-direction:column; gap:2px; transition:border-color .15s, background .15s}
.strat .ic{font-size:20px}
.strat .nm{font-weight:800; font-size:13.5px}
.strat .ds{font-size:11.5px; color:var(--muted); line-height:1.5}
.strat .cat{font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--primary); margin-top:4px}
.strat[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.strat .used{display:none; margin-top:6px; font-size:11.5px; font-weight:800; color:var(--accent)}
.strat.exec[aria-pressed="true"] .used{display:block}
.star-rec{color:var(--accent)}

.choice-row{display:flex; flex-direction:column; gap:4px}
.choice-cards{display:flex; flex-wrap:wrap; gap:10px}
.ccard{border:2px solid var(--line); border-radius:var(--r); background:var(--surface); padding:10px 16px; min-width:118px; text-align:center; transition:border-color .15s, background .15s}
.ccard .ic{display:block; font-size:22px}
.ccard .lb{font-weight:700; font-size:13.5px}
.ccard[aria-pressed="true"]{border-color:var(--busy); background:var(--busy-soft)}
.ccard[aria-pressed="true"] .lb::before{content:"✓ "; color:var(--busy); font-weight:800}

.res-list{display:flex; flex-direction:column; gap:8px}
.res-row{display:flex; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:var(--r); padding:9px 14px; background:var(--surface)}
.res-row .ic{font-size:20px; flex:none}
.res-row .ti{font-weight:700; font-size:13.5px}
.res-row .sub{font-size:11.5px; color:var(--muted)}
.rtag{flex:none; font-size:10px; font-weight:800; letter-spacing:.08em; border-radius:5px; padding:2px 8px; background:var(--surface2); color:var(--muted); margin-left:auto}
.rtag.link{background:var(--primary-soft); color:var(--primary)}
.open-btn{flex:none; border:1.5px solid var(--primary-line); background:var(--surface); color:var(--primary); border-radius:8px; padding:5px 14px; font-size:12.5px; font-weight:800; text-decoration:none; display:inline-block}

.help-btn{width:100%; border:2px solid var(--danger); background:var(--danger-soft); color:var(--danger); border-radius:var(--r); padding:14px; font-size:16px; font-weight:800; transition:background .15s}
.help-btn[aria-pressed="true"]{background:var(--danger); color:#fff}

.slider-wrap{display:flex; align-items:center; gap:16px}
.slider-wrap input[type=range]{flex:1; accent-color:var(--primary); height:32px}
.slider-val{font-size:30px; font-weight:800; min-width:96px; text-align:right; color:var(--primary); font-variant-numeric:tabular-nums}
.slider-val small{font-size:14px; color:var(--muted); font-weight:700}
.attr-cols{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:760px){.attr-cols{grid-template-columns:1fr}}
.attr-box{border:1.5px solid var(--line); border-radius:var(--r); padding:12px 14px}
.attr-box.good{border-color:var(--ok)}
.attr-box.hard{border-color:var(--warn)}
.attr-box h4{margin:0 0 8px; font-size:13px}
.attr-box.good h4{color:var(--ok)}
.attr-box.hard h4{color:var(--warn)}
.stamp-row{display:flex; gap:10px; flex-wrap:wrap}
.stamp{border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 14px 6px; min-width:96px; display:flex; flex-direction:column; align-items:center; gap:2px; transition:border-color .15s, background .15s}
.stamp .em{font-size:26px; line-height:1.2}
.stamp .sl{font-size:11.5px; font-weight:700; color:var(--muted); line-height:1.4; text-align:center}
.stamp[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.stamp[aria-pressed="true"] .sl{color:var(--accent)}
.timeline{display:flex; flex-direction:column; gap:0}
.tl-item{display:flex; gap:14px; position:relative; padding:0 0 16px 2px}
.tl-item::before{content:""; position:absolute; left:12px; top:24px; bottom:0; width:2px; background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{flex:none; width:22px; height:22px; border-radius:50%; background:var(--primary-soft); border:2px solid var(--primary); display:grid; place-items:center; font-size:10px; font-weight:800; color:var(--primary); margin-top:2px; z-index:1; font-variant-numeric:tabular-nums}
.tl-body{font-size:13px}
.tl-body .d{font-weight:800}
.tl-body .m{color:var(--muted)}
.fb-note{margin-top:6px; background:var(--primary-soft); border-left:3px solid var(--primary); border-radius:0 8px 8px 0; padding:6px 12px; font-size:12.5px}
.fb-note b{color:var(--primary)}
.tl-body .plan{color:var(--muted); font-size:12px}

/* 分かりぐあい（自己申告。評価ではないので色は穏やかに） */
.und-row{display:flex; flex-wrap:wrap; gap:8px}
.und{border:2px solid var(--line); border-radius:var(--r); background:var(--surface); padding:8px 12px; display:flex; align-items:center; gap:6px; transition:border-color .15s, background .15s}
.und .ic{font-size:18px}
.und .lb{font-weight:700; font-size:12.5px}
.und[aria-pressed="true"]{border-color:var(--ok); background:var(--ok-soft)}

/* 学びの足跡 */
.fp-unit{margin-bottom:14px}
.fp-unit:last-child{margin-bottom:0}
.fp-uh{font-weight:800; font-size:12.5px; color:var(--primary); padding-bottom:6px; border-bottom:2px solid var(--primary-line); margin-bottom:8px}
.fp-now{margin-left:8px; font-size:10.5px; font-weight:800; color:var(--primary-ink); background:var(--primary); border-radius:999px; padding:2px 8px}
.fp-row{display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
.fp-row:last-child{border-bottom:none}
.fp-st{flex:none; align-self:flex-start; font-size:10.5px; font-weight:800; border-radius:999px; padding:3px 9px; background:var(--idle-soft); color:var(--idle)}
.fp-st.s1{background:var(--busy-soft); color:var(--busy)}
.fp-st.s2{background:var(--ok-soft); color:var(--ok)}
.fp-body{min-width:0}
.fp-t{font-weight:700; font-size:13px}
.fp-und{margin-left:8px; font-size:11.5px; font-weight:700; color:var(--ok)}
.fp-memo{margin-top:4px; font-size:12.5px; background:var(--surface2); border-radius:8px; padding:6px 10px; white-space:pre-wrap}
.fp-used{margin-top:4px; font-size:11.5px; color:var(--muted)}
.fp-past{display:inline-block; margin-right:6px; font-size:10.5px; font-weight:700; color:var(--muted); background:var(--surface2); border-radius:999px; padding:1px 8px}

/* うつりかわり：やれそう（計画）と達成度（ふりかえり）を日ごとに並べる */
.fp-trend{display:flex; gap:6px; align-items:flex-end; overflow-x:auto; padding:6px 0 0}
.fp-bar{flex:none; width:34px; display:flex; flex-direction:column; align-items:center; gap:4px}
.fp-cols{display:flex; gap:3px; align-items:flex-end; height:64px}
.fp-cols i{width:11px; border-radius:3px 3px 0 0; min-height:2px}
.fp-cols .e{background:var(--busy)}
.fp-cols .a{background:var(--accent)}
.fp-d{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums}

/* 教師 */
.t-tabs{display:flex; gap:8px; margin-bottom:16px; border-bottom:2px solid var(--line)}
.t-tab{border:0; background:transparent; padding:9px 18px 11px; font-weight:800; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-2px}
.t-tab[aria-selected="true"]{color:var(--primary); border-bottom-color:var(--primary)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); align-items:center}
.legend .dot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:-1px}
.mon-wrap{display:grid; grid-template-columns:1fr 320px; gap:14px; align-items:start}
@media (max-width:980px){.mon-wrap{grid-template-columns:1fr}}
.mon-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:8px}
.tile{border:1.5px solid var(--line); border-left:5px solid var(--idle); border-radius:8px; background:var(--surface); padding:8px 10px; text-align:left; display:flex; flex-direction:column; gap:3px; transition:border-color .15s, box-shadow .15s}
.tile:hover{box-shadow:var(--shadow)}
.tile.sel{outline:3px solid var(--accent); outline-offset:1px}
.tile[data-st="busy"]{border-left-color:var(--busy)}
.tile[data-st="done"]{border-left-color:var(--ok)}
.tile[data-st="help"]{border-left-color:var(--danger); background:var(--danger-soft)}
.tile[data-st="idle"]{border-left-color:var(--warn); background:var(--warn-soft)}
.tile .nm{font-weight:800; font-size:13px; display:flex; align-items:center; gap:6px}
.tile .nm .no{color:var(--muted); font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums}
.tile .meta{font-size:11px; color:var(--muted); display:flex; gap:8px; align-items:center}
.tile .flag{font-size:10.5px; font-weight:800; margin-left:auto}
.tile[data-st="help"] .flag{color:var(--danger)}
.tile[data-st="idle"] .flag{color:var(--warn)}
.pbar{height:5px; border-radius:3px; background:var(--idle-soft); overflow:hidden; margin-top:2px}
.pbar i{display:block; height:100%; border-radius:3px; background:var(--busy)}
.tile[data-st="done"] .pbar i{background:var(--ok)}
.detail .card-b{display:flex; flex-direction:column; gap:12px}
.d-row{font-size:13px}
.d-row b{display:block; font-size:10.5px; letter-spacing:.14em; color:var(--muted); margin-bottom:2px}
.d-chips{display:flex; flex-wrap:wrap; gap:5px}
.d-chip{background:var(--surface2); border-radius:6px; padding:2px 9px; font-size:11.5px; font-weight:700}
.d-chip.acc{background:var(--accent-soft); color:var(--accent)}
.d-memos{display:flex; flex-direction:column; gap:4px}
.d-memo{background:var(--surface2); border-radius:8px; padding:6px 10px; font-size:12px; white-space:pre-wrap}
.d-memo .mt{display:block; font-weight:800; font-size:10.5px; color:var(--muted)}
/* 「この子の画面を見ています」 */
.viewing{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--warn-soft); border:2px solid var(--warn);
  border-radius:var(--r); padding:10px 16px; margin-bottom:14px; font-size:13px}
.viewing .vw-em{font-size:18px}
.viewing .vw-ro{display:inline-block; margin-left:8px; background:var(--warn); color:#1b1300; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:800}
.viewing .btn{margin-left:auto; padding:6px 14px; font-size:12.5px}
.see-btn{display:inline-flex; align-items:center; justify-content:center; text-decoration:none; padding:8px 14px; font-size:12.5px}

/* 先生の更新のお知らせ */
.update-bar{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:85; display:flex; align-items:center; gap:12px;
  background:var(--surface); border:2px solid var(--primary); border-radius:999px; padding:9px 12px 9px 20px;
  box-shadow:0 4px 20px rgba(35,48,58,.2); font-size:13px; font-weight:700; max-width:94vw}
.update-bar .btn{padding:6px 16px; font-size:12.5px}
.ub-x{border:none; background:transparent; color:var(--muted); font-size:14px; padding:2px 6px}

/* 単元デザインの編集 */
.te-ops{display:flex; gap:3px; margin-left:6px}
.mini{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:2px 7px; font-size:12px; color:var(--muted); line-height:1.5}
.mini:hover:not(:disabled){border-color:var(--primary); color:var(--primary)}
.mini:disabled{opacity:.35}
.mini.danger:hover{border-color:var(--danger); color:var(--danger)}
.d-chip.add{border:1px dashed var(--line); background:transparent; color:var(--muted); font-weight:700}
.d-chip.add:hover{border-color:var(--primary); color:var(--primary)}
.res-chip{border:1px solid transparent}
.res-chip:hover{border-color:var(--primary); color:var(--primary)}
.res-chip.unpub{opacity:.55; text-decoration:line-through}
.btn.danger{color:var(--danger); border-color:var(--danger)}

.modal{position:fixed; inset:0; z-index:88; background:rgba(15,21,25,.6); display:none; place-items:center; padding:16px}
.modal.open{display:grid}
.modal-box{width:min(520px,96vw); max-height:90vh; background:var(--surface); border-radius:14px; box-shadow:var(--shadow); display:flex; flex-direction:column}
.modal-h{display:flex; align-items:center; justify-content:space-between; padding:14px 16px 8px; font-weight:800; font-size:15px}
.modal-x{border:none; background:transparent; font-size:17px; color:var(--muted); padding:2px 6px}
.modal-b{padding:0 16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px}
.modal-f{display:flex; gap:8px; justify-content:flex-end; padding:12px 16px 14px}
.ed-f h3{margin-bottom:4px}
.ed-danger{border-top:1px solid var(--line); padding-top:10px; margin-top:2px}

.t-logs{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px}
.t-log{margin:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.t-log .tl-img{aspect-ratio:4/3; background:var(--surface2); display:grid; place-items:center; overflow:hidden}
.t-log .tl-img img{width:100%; height:100%; object-fit:cover; display:block}
.t-log figcaption{padding:4px 6px; font-size:10.5px; color:var(--muted)}
.t-priv{margin-left:4px}
.t-c{display:block; color:var(--ink); font-size:11.5px; margin-top:2px}
.quick{display:flex; flex-wrap:wrap; gap:6px}
.quick button{border:1.5px solid var(--primary-line); background:var(--surface); color:var(--primary); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px}
.view{display:none}
.view.on{display:block}
.design-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:900px){.design-grid{grid-template-columns:1fr}}
.sw-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line)}
.sw-row:last-child{border-bottom:0}
.sw-row .lb{font-weight:700; font-size:13.5px}
.sw-row .sb2{font-size:11px; color:var(--muted)}
.switch{width:44px; height:24px; border-radius:999px; background:var(--idle-soft); border:1px solid var(--line); position:relative; flex:none; transition:background .15s}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow); transition:left .15s}
.switch[aria-pressed="true"]{background:var(--ok)}
.switch[aria-pressed="true"]::after{left:22px}
.refl-table{width:100%; border-collapse:collapse; font-size:12.5px}
.refl-table th{text-align:left; font-size:10.5px; letter-spacing:.1em; color:var(--muted); border-bottom:2px solid var(--line); padding:6px 8px}
.refl-table td{border-bottom:1px solid var(--line); padding:8px; vertical-align:top}
.bar-mini{display:inline-block; width:64px; height:6px; border-radius:3px; background:var(--idle-soft); vertical-align:2px; margin-right:6px}
.bar-mini i{display:block; height:100%; border-radius:3px; background:var(--primary)}
.attr-tag{font-size:10.5px; font-weight:800; border-radius:5px; padding:1px 7px; background:var(--surface2); color:var(--muted); white-space:nowrap}
.star-btn{border:0; background:transparent; font-size:16px; opacity:.35}
.star-btn[aria-pressed="true"]{opacity:1}
.spinner{display:inline-block; width:16px; height:16px; border:2px solid var(--primary-line); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.savebar{position:fixed; right:16px; bottom:16px; font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 14px; box-shadow:var(--shadow); opacity:0; transition:opacity .2s}
.savebar.on{opacity:1}

/* 学習の手引き（契約書） */
.guide-list{display:flex; flex-direction:column; gap:5px}
.guide-row{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:var(--surface)}
.guide-row .gt{font-weight:700; font-size:13px}
.guide-row .gm{margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap}
.gk{font-size:10px; font-weight:800; border-radius:5px; padding:2px 8px; white-space:nowrap; flex:none}
.gk.k必須, .sn-n.k必須{background:var(--primary-soft); color:var(--primary)}
.gk.k選択, .sn-n.k選択{background:var(--surface2); color:var(--muted)}
.gk.k発展, .sn-n.k発展{background:var(--accent-soft); color:var(--accent)}
.gs{font-size:10.5px; font-weight:800; border-radius:5px; padding:1px 7px; white-space:nowrap}
.gs.s0{background:var(--idle-soft); color:var(--idle)}
.gs.s1{background:var(--busy-soft); color:var(--busy)}
.gs.s2{background:var(--ok-soft); color:var(--ok)}

/* 課題中心の「やってみる」 */
.task-hero{border-left:5px solid var(--primary); margin-bottom:14px}
.task-hero .tq{font-size:18px; font-weight:800; line-height:1.7; text-wrap:balance; margin:4px 0 0}
.task-hero .hgoal{margin-top:10px; background:var(--accent-soft); border:1.5px solid var(--accent); border-radius:8px; padding:8px 12px; font-size:12.5px}
.task-hero .hgoal b{color:var(--accent); font-size:10.5px; letter-spacing:.14em; margin-right:6px}
.eyebrow{font-size:11px; font-weight:800; letter-spacing:.16em; color:var(--muted)}
.steps-nav{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px}
.snav{flex:none; width:172px; border:2px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 12px; text-align:left; display:flex; flex-direction:column; gap:3px; transition:border-color .15s, background .15s}
.snav[aria-selected="true"]{border-color:var(--primary); background:var(--primary-soft)}
.sn-n{font-size:10px; font-weight:800; border-radius:5px; padding:1px 7px; align-self:flex-start}
.snav .sn-t{font-size:12.5px; font-weight:700; line-height:1.4}
.sn-s{font-size:10.5px; font-weight:800; border-radius:5px; padding:1px 7px; align-self:flex-start}
.sn-s.s0{background:var(--idle-soft); color:var(--idle)}
.sn-s.s1{background:var(--busy-soft); color:var(--busy)}
.sn-s.s2{background:var(--ok-soft); color:var(--ok)}
.tcard .card-h{align-items:flex-start}
.tcard .tmins{margin-left:auto; font-size:11.5px; color:var(--muted); font-weight:700; white-space:nowrap}
.tdesc{font-size:13.5px; line-height:1.7; margin-bottom:4px}
.tsec{border-top:1px dashed var(--line); padding-top:12px; margin-top:12px}
.tstate{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.tstate .now{font-size:12px; font-weight:800; border-radius:6px; padding:4px 12px}
.tstate .now.s0{background:var(--idle-soft); color:var(--idle)}
.tstate .now.s1{background:var(--busy-soft); color:var(--busy)}
.tstate .now.s2{background:var(--ok-soft); color:var(--ok)}
.always-res{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted)}

/* ① 単元の出口 */
.outcome{display:flex; gap:12px; align-items:flex-start; background:var(--primary-soft); border:1.5px solid var(--primary-line); border-radius:var(--r); padding:12px 16px}
.outcome .flag{font-size:22px; flex:none}
.outcome .lb{font-size:10.5px; font-weight:800; letter-spacing:.14em; color:var(--primary); display:block; margin-bottom:2px}
.outcome .ol{font-weight:800; font-size:14.5px; line-height:1.6}
.outcome .og{font-size:12px; color:var(--muted); margin-top:2px}

/* ② 自己効力感（見通す） */
.efficacy{display:flex; align-items:center; gap:14px}
.efficacy input[type=range]{flex:1; accent-color:var(--ok); height:32px}
.efficacy .face{font-size:26px; min-width:34px; text-align:center}
.efficacy .lab{font-size:12px; font-weight:800; min-width:88px; text-align:right}

/* ④ 確認タイムのバナー */
.checkin{position:fixed; left:50%; bottom:0; transform:translate(-50%,110%); width:min(680px,94vw); z-index:80;
  background:var(--surface); border:2px solid var(--accent); border-bottom:0; border-radius:14px 14px 0 0;
  box-shadow:0 -6px 24px rgba(35,48,58,.18); padding:14px 18px; transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.checkin.on{transform:translate(-50%,0)}
.checkin .ci-h{display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px}
.checkin .ci-h .em{font-size:22px}
.checkin .ci-q{font-size:12.5px; color:var(--muted); margin:6px 0 10px}
.checkin .ci-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.checkin .ci-btn{border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 18px; font-weight:800}
.checkin .ci-btn.ok{border-color:var(--ok); color:var(--ok)}
.checkin .ci-btn.adj{border-color:var(--warn); color:var(--warn)}
.checkin .ci-memo{flex:1; min-width:160px}

/* 学びログ（カメラとビュー） */
.log-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.log-tile{border:2px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden; margin:0; text-align:left}
.lt-img{aspect-ratio:4/3; background:var(--surface2); display:grid; place-items:center; overflow:hidden}
.lt-img img{width:100%; height:100%; object-fit:cover; display:block}
.lt-load{font-size:11.5px; color:var(--muted)}
.log-tile figcaption{padding:6px 8px; display:flex; flex-direction:column; gap:3px}
.lt-who{font-size:11px; font-weight:800; color:var(--muted)}
.lt-who.me{color:var(--primary)}
.lt-task{font-size:10.5px; color:var(--muted)}
.lt-c{font-size:12px; line-height:1.4}
.lt-c.muted{color:var(--muted); font-variant-numeric:tabular-nums}
.lt-acts{display:flex; gap:4px; align-items:center; margin-top:2px}
.lt-share{flex:1; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:3px 8px; font-size:10.5px; font-weight:700; color:var(--muted)}
.lt-share[aria-pressed="true"]{border-color:var(--primary-line); background:var(--primary-soft); color:var(--primary)}
.lt-del{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:3px 7px; font-size:11px}
.log-add{border:2px dashed var(--line); border-radius:var(--r); background:var(--surface2); min-height:120px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--muted)}
.log-add .ic{font-size:26px}
.log-add .lb{font-size:12px; font-weight:800}
.log-add:hover{border-color:var(--primary); color:var(--primary)}

.cam{position:fixed; inset:0; z-index:90; background:rgba(15,21,25,.72); display:none; place-items:center; padding:16px}
.cam.open{display:grid}
.cam-box{width:min(560px,96vw); background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:14px; display:flex; flex-direction:column; gap:10px}
.cam-h{display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:15px}
.cam-x{border:none; background:transparent; font-size:18px; color:var(--muted); padding:2px 6px}
.cam-stage{aspect-ratio:4/3; background:#000; border-radius:var(--r); overflow:hidden; display:grid; place-items:center}
.cam-stage video, .cam-stage img{width:100%; height:100%; object-fit:contain; display:block}
.cam-stage img{display:none}
.cam-row{display:flex; gap:8px; flex-wrap:wrap}
.cam-row .btn{flex:1; justify-content:center; text-align:center}
.cam-note{font-size:12px; color:var(--warn); min-height:1em}

.lightbox{position:fixed; inset:0; z-index:95; background:rgba(15,21,25,.9); display:none; place-items:center; padding:20px; gap:10px; grid-auto-flow:row}
.lightbox.open{display:grid}
.lightbox img{max-width:96vw; max-height:82vh; object-fit:contain; border-radius:var(--r)}
.lb-cap{color:#fff; font-size:13px; text-align:center}

/* 実行中の他者参照（みんなの様子） */
.peer-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.peer-mode{font-size:11px; font-weight:800; border-radius:5px; padding:2px 8px; background:var(--surface2); color:var(--muted)}
.peer-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.peer{border:1.5px solid var(--line); border-radius:8px; background:var(--surface); padding:8px 10px; display:flex; flex-direction:column; gap:3px; cursor:pointer; transition:border-color .15s, box-shadow .15s}
.peer:hover{box-shadow:var(--shadow)}
.peer.me{border-color:var(--primary); background:var(--primary-soft)}
.peer .pn{font-weight:800; font-size:12.5px; display:flex; align-items:center; gap:6px}
.peer .pn .no{color:var(--muted); font-size:10px; font-weight:700}
.peer .stage{font-size:10.5px; font-weight:800; border-radius:5px; padding:1px 7px; align-self:flex-start}
.peer .stage.s0{background:var(--idle-soft); color:var(--idle)}
